<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lume 微光 — 一天一點未來光">

  <!--
    手機瀏覽器（非安裝成 PWA 時）狀態列／網址列那塊底色是看這個 meta
    標籤，不是 manifest.json 的 theme_color——manifest 那個只有「已加入
    主畫面、用 standalone 模式開」才會生效。沒加這個標籤的話 iPhone
    Safari 上排會是預設白色，跟 App 深色底完全不搭（2026-09-23 使用者
    拿實機截圖回報最上面時間那排一片白）。顏色跟 manifest.json 的
    theme_color、background_color 同一個值，三處要保持一致。
  -->
  <meta name="theme-color" content="#0C0C13">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lume">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="alternate icon" type="image/png" href="favicon.png"/>

  <title>Lume 微光</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
