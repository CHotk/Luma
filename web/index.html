<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!--
    手機一開始就用裝置寬度排版。沒寫的話手機瀏覽器先用約 980px 寬的
    桌機版面縮小顯示，載入畫面的 logo、字會先變很小，等 Flutter 起來
    自己補上這個設定才又放大（2026-10-06 使用者回報「先變小才又放大」）。
    內容跟 Flutter 自己加的一樣。
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lume 微光 — 一天一點未來光">

  <!--
    手機瀏覽器（非安裝成 PWA 時）狀態列／網址列那塊底色是看這個 meta
    標籤，不是 manifest.json 的 theme_color——manifest 那個只有「已加入
    主畫面、用 standalone 模式開」才會生效。沒加這個標籤的話 iPhone
    Safari 上排會是預設白色，跟 App 深色底完全不搭（2026-09-23 使用者
    拿實機截圖回報最上面時間那排一片白）。顏色跟 manifest.json 的
    theme_color、background_color 同一個值，三處要保持一致。
  -->
  <meta name="theme-color" content="#0C0C13">

  <!--
    iOS「加入主畫面」要用這個獨立的舊版 apple- 前綴標籤才會真的進
    standalone 模式（不是下面那個通用 mobile-web-app-capable）——沒加
    這個的話，iOS 只會把主畫面捷徑當成一般 Safari 書籤開，整個瀏覽器
    外框（含白色狀態列）都還在，下面那顆 apple-mobile-web-app-status-
    bar-style 根本不會生效（2026-09-23 使用者拿實機「加到主畫面」測試
    回報頂部時間那排還是白的，這個漏掉的標籤就是原因）。
  -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lume">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="alternate icon" type="image/png" href="favicon.png"/>

  <title>Lume 微光</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Flutter 的 canvas 蓋滿畫面前，或瀏海/動態島那圈安全區域
       canvas 蓋不到的地方，底色要跟 App 本身一樣深，不然會透出瀏覽器
       預設的白色。 */
    html, body { background: #0C0C13; margin: 0; }

    /* 關掉 iOS Safari 長按的系統選單（拷貝／查詢那種）。長按卡片叫出
       App 自己的泡泡選單時，Safari 也會準備跳它的系統選單，接下來那一下
       點擊會被拿去關掉系統選單、App 收不到，看起來就是「第一次點選單
       沒反應、第二次才有」（2026-10-06 使用者回報）。只關系統選單，
       不碰 user-select，輸入框照常能選字。 */
    html, body { -webkit-touch-callout: none; }

    /* 載入畫面（2026-10-06 使用者回報：開 App 時載入中一片黑，原本還會
       看到 logo 跟 App 名稱）。開機真正花時間的是下載 main.dart.js、
       Flutter 引擎初始化、main() 裡開本機儲存這段，這段期間 Flutter 還
       畫不出任何東西；啟動頁（splash_page.dart）的停留時間 9/30 依使用
       者要求改成 0，所以 Flutter 那邊的 logo 只閃一下。這裡改用純 HTML
       在 Flutter 還沒起來前就先顯示，Flutter 畫出第一個畫面就淡出移除，
       不會多等任何時間。樣子跟 splash_page.dart 一致。 */
    #lume-splash {
      position: fixed; inset: 0; z-index: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0C0C13;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      transition: opacity .25s ease;
    }
    #lume-splash.hide { opacity: 0; pointer-events: none; }
    #lume-splash img { width: 120px; height: 120px; border-radius: 26px; }
    #lume-splash .name {
      margin-top: 14px; font-size: 29px; font-weight: 700;
      letter-spacing: -0.8px; color: #F3F2F8;
    }
    #lume-splash .sub {
      margin-top: 3px; font-size: 11px; letter-spacing: 4.4px;
      color: #A3A2B2;
    }
    #lume-splash .tag {
      margin-top: 14px; font-size: 12.5px;
      color: #74738A;
    }
    #lume-splash .loading {
      margin-top: 28px; display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: #74738A;
    }
    #lume-splash .spin {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid rgba(242, 241, 247, .15);
      border-top-color: rgba(242, 241, 247, .6);
      animation: lume-spin .8s linear infinite;
    }
    @keyframes lume-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="lume-splash" aria-label="Lume 載入中">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">Lume</div>
    <div class="sub">微 光</div>
    <div class="tag">一天一點未來光</div>
    <div class="loading"><div class="spin"></div>載入中…</div>
  </div>
  <script>
    // Flutter 畫出第一個畫面時會發這個事件，收到就淡出、移除載入畫面。
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('lume-splash');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
