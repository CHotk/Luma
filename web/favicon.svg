<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Lume 標誌：方向 D 配色 10。直筆白到紫漸層，橫筆淺藍半透明。 -->
  <defs>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9B7BFF"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D2547"/>
      <stop offset="0.58" stop-color="#0C0C13"/>
      <stop offset="1" stop-color="#1B1233"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#7EA6FF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7EA6FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#plate)"/>
  <rect width="100" height="100" rx="22" fill="url(#glow)"/>
  <rect x="33" y="22" width="11" height="45.5" rx="5.5" fill="url(#stem)"/>
  <rect x="33" y="56.5" width="35" height="11" rx="5.5" fill="#7EA6FF" fill-opacity="0.55"/>
</svg>
