<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>櫻花點亮重新設計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0C0C13; --card: #151520; --line: #2A2A3D; --ink: #F3F2F8; --ink2: #A3A2B2; --ink3: #74738A; --sakura: #FFB7CB; --sakura2: #FF7FA3; --deep: #E2557F; --gold: #F2C46D; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); min-height: 100vh; font: 14px/1.5 -apple-system, "SF Pro Text", system-ui, "Segoe UI", "Microsoft JhengHei", sans-serif; }
  .page { max-width: 1140px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .lead { color: var(--ink2); font-size: 13px; margin: 0 0 14px; } .lead b { color: var(--ink); }
  .vtabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .vtabs button { border: 1px solid var(--line); background: var(--card); color: var(--ink2); padding: 8px 14px; border-radius: 99px; cursor: pointer; font-size: 13px; }
  .vtabs button.on { border-color: var(--sakura2); color: #fff; background: rgba(255,127,163,.22); }
  .stage { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .notes { flex: 1 1 320px; max-width: 470px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; font-size: 13.5px; color: var(--ink2); }
  .notes h2 { color: var(--ink); font-size: 17px; margin: 0 0 4px; }
  .notes .tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px; background: rgba(255,127,163,.15); color: var(--sakura); margin-bottom: 8px; }
  .notes h3 { color: var(--ink); font-size: 13.5px; margin: 14px 0 4px; }
  .notes ul { margin: 0; padding-left: 18px; } .notes li { margin: 3px 0; }
  .notes .try { margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: rgba(255,127,163,.08); border: 1px solid rgba(255,127,163,.25); color: var(--ink); font-size: 12.5px; }
  .phone { width: 390px; max-width: 100%; height: 820px; flex-shrink: 0; border-radius: 44px; border: 1px solid var(--line); background: #0e0e17; position: relative; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.5); user-select: none; }
  .screen { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  .status { position: absolute; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; font-size: 13px; font-weight: 700; z-index: 70; pointer-events: none; }
  .top { display: flex; align-items: center; gap: 8px; padding: 50px 16px 8px; position: relative; z-index: 5; }
  .top b { flex: 1; font-size: 17px; }
  .ib { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--ink2); cursor: pointer; font-size: 16px; background: rgba(255,255,255,.06); }
  .flower { cursor: pointer; transition: transform .25s; transform-box: fill-box; transform-origin: center; }
  .flower:hover { transform: scale(1.08); }
  @keyframes bloom { 0% { transform: scale(.2) rotate(-60deg); opacity: 0 } 60% { transform: scale(1.18) rotate(8deg); opacity: 1 } 100% { transform: scale(1) rotate(0) } }
  .blooming { animation: bloom .9s cubic-bezier(.2,.9,.3,1.2); transform-box: fill-box; transform-origin: center; }
  @keyframes fall { 0% { transform: translate(0,-20px) rotate(0); opacity: 0 } 10% { opacity: .9 } 100% { transform: translate(60px, 860px) rotate(540deg); opacity: 0 } }
  .petal { position: absolute; top: 0; width: 12px; height: 10px; border-radius: 10px 0 10px 0; background: linear-gradient(135deg, #FFD3E0, #FF9DBB); animation: fall linear infinite; pointer-events: none; z-index: 3; }
  @keyframes glow { 0%,100% { opacity: .65 } 50% { opacity: 1 } }
  @keyframes sway { 0%,100% { transform: rotate(-2deg) } 50% { transform: rotate(2deg) } }
  .sheet-bg { position: absolute; inset: 0; z-index: 80; background: rgba(20,8,20,.35); animation: fadein .2s; }
  @keyframes fadein { from { opacity: 0 } }
  /* 明細：畫面正中間的粉色毛玻璃卡片（2026-10-16 使用者要求，不要從底部滑上來） */
  .sheet { position: absolute; left: 18px; right: 18px; top: 50%; transform: translateY(-50%); z-index: 81; padding: 20px 20px 22px; border-radius: 28px; background: linear-gradient(160deg, rgba(255,190,214,.30), rgba(255,120,165,.18)); border: 1px solid rgba(255,255,255,.38); box-shadow: 0 24px 60px rgba(60,10,40,.45), inset 0 1px 0 rgba(255,255,255,.35); backdrop-filter: blur(26px) saturate(1.4); -webkit-backdrop-filter: blur(26px) saturate(1.4); animation: popin .32s cubic-bezier(.2,.9,.3,1.25); }
  @keyframes popin { from { opacity: 0; transform: translateY(-50%) scale(.86) } }
  .sheet .kv div { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.14); }
  .sheet .muted, .sheet .small { color: rgba(255,240,246,.78); }
  @keyframes up { from { transform: translateY(100%) } }
  .grab { width: 38px; height: 5px; border-radius: 99px; background: #4a4a5c; margin: 0 auto 14px; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .kv div { background: rgba(255,255,255,.05); border-radius: 12px; padding: 9px 11px; } .kv b { display: block; font-size: 16px; }
  .small { color: var(--ink3); font-size: 11.5px; } .muted { color: var(--ink2); font-size: 12.5px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 14px; padding: 13px; background: linear-gradient(135deg, var(--sakura2), var(--deep)); color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; }
  .btn.ghost { background: rgba(255,255,255,.08); }
  .kchip { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; border: 1px solid #FF6B6B; color: #FF9A9A; font-size: 17px; margin-right: 6px; }
  .toast { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); z-index: 95; background: rgba(40,20,32,.95); border: 1px solid rgba(255,183,203,.6); border-radius: 14px; padding: 10px 16px; font-size: 13.5px; font-weight: 700; white-space: nowrap; }
  .serif { font-family: "Noto Serif JP", serif; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px; }
  .chip { min-width: 30px; padding: 4px 8px; text-align: center; border-radius: 99px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid rgba(255,255,255,.12); color: var(--ink3); }
  /* 6 GPT 圖層版 */
  .art { position: relative; width: 390px; height: 585px; margin-top: -4px; }
  .art img.layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .missing { position: absolute; border: 2px dashed rgba(255,183,203,.45); border-radius: 18px; display: grid; place-items: center; text-align: center; color: #FFB7CB; font-size: 12px; background: rgba(255,183,203,.05); }
  .bud { position: absolute; transform: translate(-50%,-50%); cursor: pointer; }
  .bud .tap { width: 54px; height: 54px; border-radius: 50%; }
  .tags { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
  .tags .ptag { pointer-events: auto; cursor: pointer; }
  .ptag { position: absolute; transform: translate(-50%,0); font: 800 11.5px -apple-system, "Microsoft JhengHei", sans-serif; white-space: nowrap; padding: 2px 8px; border-radius: 99px; background: rgba(20,14,28,.72); color: #B9AFC4; border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(4px); z-index: 2; }
  .ptag.lit { background: rgba(255,127,163,.92); color: #fff; border-color: rgba(255,255,255,.6); box-shadow: 0 2px 8px rgba(255,90,140,.45); }
  @keyframes ping { 0% { transform: translate(-50%,-50%) scale(.6); opacity: .9 } 100% { transform: translate(-50%,-50%) scale(1.8); opacity: 0 } }
  .bud.hl::before { content: ""; position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; border-radius: 50%; border: 3px solid #FFE08A; animation: ping 1s ease-out infinite; transform: translate(-50%,-50%); }
  .ptag.hl { background: #FFE08A; color: #3a2400; border-color: #fff; }
  .legend10 { display: flex; gap: 5px; padding: 0 12px; position: relative; z-index: 5; }
  .legend10 span { flex: 1; text-align: center; padding: 5px 0; border-radius: 10px; font-size: 13px; font-weight: 800; cursor: pointer; background: rgba(20,14,28,.6); color: #8a7f96; border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(6px); }
  .legend10 span.on { background: rgba(255,127,163,.85); color: #fff; border-color: rgba(255,255,255,.5); }
  .legend10 span.hl { outline: 2px solid #FFE08A; }
  .bud img.bloom { position: absolute; left: 50%; top: 50%; width: 74px; height: 74px; margin: -46px 0 0 -37px; pointer-events: none; }
  .bud.calib .tap { outline: 2px solid #4ade80; background: rgba(74,222,128,.15); }
  .gpt-step { margin: 8px 16px 0; padding: 10px 12px; border-radius: 14px; background: rgba(255,183,203,.08); border: 1px solid rgba(255,183,203,.3); font-size: 12px; color: var(--ink2); position: relative; z-index: 5; }
  .chip.on { background: rgba(255,183,203,.18); border-color: rgba(255,183,203,.6); color: #FFD3E0; }
  /* 會說話的樹 */
  .talk { display: flex; gap: 10px; align-items: flex-start; margin: 6px 14px 0; height: 104px; position: relative; z-index: 6; cursor: pointer; }
  .talk .ava { width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #FFC2D4 45%, #FF7FA3); display: grid; place-items: center; font-size: 20px; box-shadow: 0 4px 14px rgba(255,90,140,.45); animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-3px) rotate(-4deg) } }
  .talk .bub { position: relative; flex: 1; padding: 9px 12px; border-radius: 4px 16px 16px 16px; background: rgba(255,240,246,.16); border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(14px); font-size: 13px; line-height: 1.45; color: #FFF4F8; animation: popin .3s; }
  .talk .bub { max-height: 104px; overflow: hidden; }
  .talk .bub .say { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .talk .bub small { display: block; color: rgba(255,240,246,.6); font-size: 10.5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .talk .wds { display: flex; gap: 5px; margin-top: 5px; flex-wrap: nowrap; overflow: hidden; }
  .talk .wd { flex-shrink: 0; padding: 2px 8px; border-radius: 10px; background: rgba(255,255,255,.2); font: 800 13px "Noto Serif JP", serif; color: #fff; }
  .talk .wd i { font: 400 10px -apple-system, "Microsoft JhengHei", sans-serif; font-style: normal; color: rgba(255,240,246,.75); margin-left: 3px; }
  .talk .wd.lock { background: rgba(20,14,28,.45); color: rgba(255,255,255,.55); border: 1px dashed rgba(255,255,255,.35); }
  .stages { margin: 10px 14px 0; position: relative; z-index: 5; }
  .stages .bar { position: relative; height: 8px; border-radius: 99px; background: rgba(20,14,28,.6); border: 1px solid rgba(255,255,255,.12); }
  .stages .fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: linear-gradient(90deg, #FFC2D4, #FF7FA3); box-shadow: 0 0 10px rgba(255,127,163,.7); transition: width .8s; }
  .stages .ms { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; background: #2a1e30; border: 1.5px solid #5a4458; }
  .stages .ms.on { background: #FF7FA3; border-color: #fff; }
  .stages .lbl { display: flex; justify-content: space-between; font-size: 10.5px; color: rgba(255,240,246,.55); margin-top: 7px; }
  .stages .lbl b { color: #FFD3E0; }
  .cele-bg { position: absolute; inset: 0; z-index: 90; background: rgba(20,6,18,.55); backdrop-filter: blur(3px); animation: fadein .25s; }
  .cele { position: absolute; left: 22px; right: 22px; top: 50%; transform: translateY(-50%); z-index: 91; text-align: center; padding: 70px 20px 20px; border-radius: 30px; background: linear-gradient(165deg, rgba(255,200,222,.34), rgba(255,120,165,.2)); border: 1px solid rgba(255,255,255,.4); backdrop-filter: blur(26px) saturate(1.4); box-shadow: 0 24px 60px rgba(60,10,40,.5); animation: popin .4s cubic-bezier(.2,.9,.3,1.3); }
  .cele .big { position: absolute; left: 50%; top: -58px; width: 130px; height: 130px; margin-left: -65px; animation: bloom 1s cubic-bezier(.2,.9,.3,1.2); filter: drop-shadow(0 8px 20px rgba(255,90,140,.6)); }
  .cele h4 { margin: 0; font: 900 26px "Noto Serif JP", serif; color: #fff; text-shadow: 0 2px 10px rgba(255,90,140,.6); }
  .cele .stage-name { display: inline-block; margin: 6px 0 10px; padding: 2px 10px; border-radius: 99px; background: rgba(255,255,255,.2); font-size: 12px; font-weight: 800; color: #FFF4F8; }
  .cele p { margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: #FFF4F8; }
  .cele .facts { display: flex; gap: 8px; margin-bottom: 14px; }
  .cele .facts div { flex: 1; padding: 8px 4px; border-radius: 12px; background: rgba(255,255,255,.12); font-size: 11px; color: rgba(255,240,246,.75); }
  .cele .facts b { display: block; font-size: 16px; color: #fff; }
  .cele .btns { display: flex; gap: 8px; }
  .cele .btns span { flex: 1; padding: 11px 0; border-radius: 14px; font-weight: 800; cursor: pointer; background: rgba(255,255,255,.18); color: #fff; }
  .cele .btns span.main { background: #FF7FA3; color: #fff; box-shadow: 0 6px 18px rgba(255,90,140,.5); }
  .storm img { position: absolute; top: -30px; pointer-events: none; z-index: 92; animation: storm linear infinite; }
  @keyframes storm { 0% { transform: translate(0,0) rotate(0); opacity: 0 } 8% { opacity: 1 } 100% { transform: translate(-80px, 900px) rotate(720deg); opacity: .2 } }
  .mankai { position: absolute; inset: 0; z-index: 91; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 26px; text-align: center; background: radial-gradient(circle at 50% 35%, rgba(255,214,150,.38), rgba(50,8,34,.88) 72%); backdrop-filter: blur(8px); animation: fadein .5s; }
  .mankai .kanji { font: 900 64px "Noto Serif JP", serif; color: #fff; letter-spacing: 6px; text-shadow: 0 0 30px rgba(255,200,120,.9), 0 4px 20px rgba(255,90,140,.8); animation: popin .8s cubic-bezier(.2,.9,.3,1.3); }
  .mankai .sub { font-size: 15px; font-weight: 800; color: #FFE7B0; margin: 2px 0 16px; }
  .mankai p { font-size: 14px; line-height: 1.7; color: #FFF4F8; margin: 0 0 16px; }
  .mankai .card { width: 100%; padding: 14px; border-radius: 22px; background: rgba(255,240,246,.14); border: 1px solid rgba(255,255,255,.35); backdrop-filter: blur(18px); margin-bottom: 16px; }
  .mankai .card .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mankai .card .facts div { padding: 8px; border-radius: 12px; background: rgba(255,255,255,.1); font-size: 11px; color: rgba(255,240,246,.75); }
  .mankai .card .facts b { display: block; font-size: 17px; color: #fff; }
  .mankai .card .row10 { display: flex; gap: 4px; margin-top: 10px; }
  .mankai .card .row10 span { flex: 1; padding: 4px 0; border-radius: 8px; background: rgba(255,127,163,.85); font-size: 12px; font-weight: 800; color: #fff; }
  .keep-prev { position: absolute; inset: 0; z-index: 95; background: rgba(10,4,12,.82); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 50px 30px 30px; animation: fadein .3s; }
  .keep-prev img { max-width: 100%; max-height: 600px; border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
  .keep-prev .small { color: #FFE3EC; text-align: center; }
</style>
</head>
<body>
<div class="page">
  <h1>日文點亮：櫻花重新設計・五版</h1>
  <p class="lead">規則不變：10 行（あ～わ），考試選「點亮」、那一行全對就開花。這次每版都用<b>真正的五瓣櫻花</b>（花瓣尖端有缺口），有<b>開花動畫</b>跟<b>飄落的花瓣</b>，越開越熱鬧。<br>每版都能：點花看明細（開花日期、花幾天、練幾次、寫多久、最好幾 %、還錯哪幾字）→「開始點亮」；右上 ✦ 模擬下一行全對看開花。</p>
  <div class="vtabs" id="vtabs"></div>
  <div class="stage"><div class="phone" id="phone"></div><div class="notes" id="notes"></div></div>
</div>
<script src="assets/jp_light/embed.js"></script>
<script>
const ROWS = ['あ', 'か', 'さ', 'た', 'な', 'は', 'ま', 'や', 'ら', 'わ'];
const KANA = { あ: 'あいうえお', か: 'かきくけこ', さ: 'さしすせそ', た: 'たちつてと', な: 'なにぬねの', は: 'はひふへほ', ま: 'まみむめも', や: 'や ゆ よ', ら: 'らりるれろ', わ: 'わ を ん' };
const SEED = [['9/18', '9/12', 34, 41, 3, 100, ''], ['9/24', '9/15', 28, 36, 4, 100, ''], ['10/02', '9/20', 41, 52, 5, 100, ''], ['10/09', '9/26', 30, 44, 6, 100, ''], [null, '10/01', 22, 27, 3, 80, 'ぬ'], [null, '10/05', 15, 19, 2, 60, 'ひふ'], [null, '10/10', 6, 8, 1, 40, 'むめも'], [null, null, 0, 0, 0, 0, ''], [null, null, 0, 0, 0, 0, ''], [null, null, 0, 0, 0, 0, '']];
const S = { tip: new Date().getDate(), v: 0, data: SEED.map(r => [...r]), sheet: null, toast: null, justLit: null };
const rec = i => { const r = S.data[i]; return { lit: r[0], first: r[1], n: r[2], min: r[3], exams: r[4], best: r[5], bad: r[6] }; };
const litN = () => S.data.filter(r => r[0]).length;
const nextIdx = () => S.data.findIndex(r => !r[0]);
const days = (a, b) => Math.max(1, Math.round((new Date('2026/' + b) - new Date('2026/' + a)) / 864e5));
const fmtMin = m => m >= 60 ? `${Math.floor(m / 60)} 小時 ${m % 60} 分` : `${m} 分`;
const totalMin = () => S.data.reduce((s, r) => s + r[3], 0);

// 五瓣櫻花（花瓣尖端有 V 字缺口），r = 半徑
function sakura(cx, cy, r, { lit, i, color = '#FFC4D6', edge = '#FF8FB1', label = '', labelColor, budColor = '#3a2a36', budEdge = '#5a4458', font = 13, serif = false } = {}) {
  const petal = `M0,0 C${-r * .55},${-r * .25} ${-r * .62},${-r * .85} ${-r * .2},${-r} L0,${-r * .82} L${r * .2},${-r} C${r * .62},${-r * .85} ${r * .55},${-r * .25} 0,0Z`;
  const cls = `flower ${S.justLit === i ? 'blooming' : ''}`;
  if (!lit) {
    return `<g class="flower" data-row="${i}" transform="translate(${cx},${cy})"><circle r="${r * .52}" fill="${budColor}" stroke="${budEdge}" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text text-anchor="middle" dy=".35em" font-size="${font}" font-weight="800" fill="#8a7a90" ${serif ? 'font-family="Noto Serif JP"' : ''}>${label}</text></g>`;
  }
  const grad = `g${i}${S.v}`;
  return `<g class="${cls}" data-row="${i}" transform="translate(${cx},${cy})">
    <defs><radialGradient id="${grad}"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="${color}"/><stop offset="1" stop-color="${edge}"/></radialGradient></defs>
    ${[0, 72, 144, 216, 288].map(a => `<path d="${petal}" fill="url(#${grad})" stroke="rgba(255,255,255,.35)" stroke-width=".6" transform="rotate(${a})"/>`).join('')}
    <circle r="${r * .18}" fill="#FFE08A"/>${[0, 60, 120, 180, 240, 300].map(a => `<circle r="${r * .045}" fill="#E8A33D" transform="rotate(${a}) translate(0,${-r * .28})"/>`).join('')}
    ${label ? `<text text-anchor="middle" y="${r + font + 2}" font-size="${font}" font-weight="900" fill="${labelColor || '#FFD3E0'}" ${serif ? 'font-family="Noto Serif JP"' : ''}>${label}</text>` : ''}</g>`;
}
const petals = (n, color) => Array.from({ length: n }, (_, k) => `<span class="petal" style="left:${(k * 47) % 360}px;animation-duration:${6 + (k % 5)}s;animation-delay:${-k * 1.3}s;${color ? `background:${color}` : ''}"></span>`).join('');
const topBar = (title, color = 'var(--ink)') => `<div class="top"><span class="ib">‹</span><b style="color:${color}">${title}</b><span class="ib" data-sim title="模擬下一行全對">✦</span></div>`;

function detail(i) {
  const r = rec(i), row = ROWS[i];
  const status = r.lit ? `<div style="font-size:15px;font-weight:800;color:var(--sakura)">🌸 ${r.lit} 開花</div><div class="muted">從第一次練（${r.first}）到開花，花了 <b style="color:var(--ink)">${days(r.first, r.lit)} 天</b></div>`
    : r.first ? `<div style="font-size:15px;font-weight:800">還是花苞</div><div class="muted">從 ${r.first} 開始練；最好 ${r.best}%</div>` : `<div style="font-size:15px;font-weight:800">還沒開始</div><div class="muted">先手寫練幾次，再用點亮模式考一次</div>`;

          <div class="row10">${ROWS.map(x => `<span>${x}</span>`).join('')}</div></div>
        <div class="cele btns" style="position:static;transform:none;padding:0;background:none;border:0;box-shadow:none;backdrop-filter:none;animation:none;width:100%"><div class="btns" style="width:100%"><span data-cele-close>回到樹下</span><span class="main" data-keep="${i}">📸 留個紀念</span></div></div>
      </div>`;
    }
    const nx = nextIdx();
    return `<div class="cele-bg" data-cele-close></div><div class="cele">
      <img class="big" src="${ART}bloom${(i % 4) + 1}.png">
      <h4>${ROWS[i]}行 開花！</h4><div class="stage-name">第 ${n} 朵・${st[0]}（${st[1]}）</div>
      <p>${CHEER[n]}<br><span style="opacity:.8;font-size:13px">${speedLine(i)}</span></p>
      <div class="facts"><div>花了<b>${days(r.first, r.lit)} 天</b></div><div>手寫<b>${r.n} 次</b></div><div>考了<b>${r.exams} 次</b></div></div>
      <div class="btns"><span data-keep="${i}">📸 記錄</span>${nx >= 0 ? `<span class="main" data-go="${nx}" data-cele-close>點亮 ${ROWS[nx]}行 →</span>` : ''}</div>
    </div>`;
  } });

// 「留個紀念」：把滿開畫面畫成一張 1080×1920 的圖。手機（支援分享檔案）叫出系統分享選單——
// iPhone 選「儲存影像」就進照片、Android 可存相簿；不支援的（電腦）直接下載 PNG。不分作業系統。
const loadImg = src => new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = src; });
const EMB = k => (window.JP_EMBED || {})[k] || ART + (k === 'bg' ? 'bg.png' : k + '.png');
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
async function keepsake(row) {
  const all = litN() === 10, r1 = rec(row);
  const W = 1080, H = 1920, c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  await Promise.all([document.fonts.load('900 200px "Noto Serif JP"'), document.fonts.load('700 40px "Noto Serif JP"')]).catch(() => {});
  const [bg, tree, ...blooms] = await Promise.all(['bg', 'tree', 'bloom1', 'bloom2', 'bloom3', 'bloom4'].map(k => loadImg(EMB(k))));
  // 背景（cover）
  const sc = Math.max(W / bg.width, H / bg.height); g.drawImage(bg, (W - bg.width * sc) / 2, (H - bg.height * sc) / 2, bg.width * sc, bg.height * sc);
  // 樹＋10 團花（跟畫面同一組座標）
  const TY = 330, ts = W / 1024; g.drawImage(tree, 0, TY, W, W * 1.5);
  const bs = 74 / 390 * W; BUDS.forEach(([x, y], i) => { if (S.data[i][0]) g.drawImage(blooms[i % 4], x * ts - bs / 2, TY + y * ts - 9 / 390 * W - bs / 2, bs, bs); });
  // 上面壓暗＋金色光暈，標題才看得清楚
  let gr = g.createLinearGradient(0, 0, 0, 700); gr.addColorStop(0, 'rgba(30,8,30,.85)'); gr.addColorStop(1, 'rgba(30,8,30,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, 700);
  gr = g.createRadialGradient(W / 2, 250, 20, W / 2, 250, 520); gr.addColorStop(0, 'rgba(255,214,150,.45)'); gr.addColorStop(1, 'rgba(255,214,150,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, 800);
  g.textAlign = 'center'; g.fillStyle = '#fff'; g.shadowColor = 'rgba(255,120,160,.9)'; g.shadowBlur = 40;
  g.font = '900 210px "Noto Serif JP", serif'; g.fillText(all ? '満開' : ROWS[row] + '行 開花', W / 2, 330);
  g.shadowBlur = 0; g.fillStyle = '#FFE7B0'; g.font = '800 46px -apple-system, "Microsoft JhengHei", sans-serif'; g.fillText(all ? '五十音 10 行，全部開花' : `第 ${litN()} 朵・${STAGE(litN())[0]}`, W / 2, 420);
  // 下面總結卡
  const dv = d => new Date('2026/' + d), byDate = (a, b) => dv(a) - dv(b);
  const firsts = S.data.map(x => x[1]).sort(byDate), lasts = S.data.map(x => x[0]).sort(byDate);
  gr = g.createLinearGradient(0, H - 620, 0, H); gr.addColorStop(0, 'rgba(40,10,34,0)'); gr.addColorStop(.35, 'rgba(40,10,34,.75)'); gr.addColorStop(1, 'rgba(40,10,34,.92)'); g.fillStyle = gr; g.fillRect(0, H - 620, W, 620);
  const facts = !all ? [['從開始練到開花', days(r1.first, r1.lit) + ' 天'], ['手寫練習', r1.n + ' 次'], ['寫了多久', fmtMin(r1.min)], ['點亮考試', r1.exams + ' 次']] : [['第一朵到滿開', days(firsts[0], lasts[9]) + ' 天'], ['總共練了', fmtMin(totalMin())], ['手寫練習', S.data.reduce((a, x) => a + x[2], 0) + ' 次'], ['點亮考試', S.data.reduce((a, x) => a + x[4], 0) + ' 次']];
  facts.forEach(([k, v], j) => { const x = 70 + (j % 2) * 480, y = H - 430 + Math.floor(j / 2) * 150; g.fillStyle = 'rgba(255,255,255,.14)'; rr(g, x, y, 460, 130, 28); g.fill(); g.textAlign = 'left'; g.fillStyle = 'rgba(255,240,246,.75)'; g.font = '500 32px -apple-system, "Microsoft JhengHei", sans-serif'; g.fillText(k, x + 32, y + 50); g.fillStyle = '#fff'; g.font = '900 48px -apple-system, "Microsoft JhengHei", sans-serif'; g.fillText(v, x + 32, y + 106); });
  ROWS.forEach((r, i) => { const w = 86, x = 70 + i * (w + 9.5), y = H - 140; g.fillStyle = S.data[i][0] ? 'rgba(255,127,163,.9)' : 'rgba(20,14,28,.6)'; rr(g, x, y, w, 64, 16); g.fill(); g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = '900 36px "Noto Serif JP", serif'; g.fillText(r, x + w / 2, y + 45); });
  g.fillStyle = 'rgba(255,240,246,.6)'; g.font = '500 28px -apple-system, "Microsoft JhengHei", sans-serif'; g.textAlign = 'center'; g.fillText(`Lume・五十音櫻花樹・${new Date().toLocaleDateString('zh-TW')}`, W / 2, H - 470);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const file = new File([blob], `${all ? '満開' : ROWS[row] + '行開花'}_${new Date().toISOString().slice(0, 10)}.png`, { type: 'image/png' });
  S.keepUrl = URL.createObjectURL(blob); render();
  if (navigator.canShare && navigator.canShare({ files: [file] }) && /Mobi|Android|iPhone|iPad/.test(navigator.userAgent)) {
    try { await navigator.share({ files: [file], title: all ? '満開' : ROWS[row] + '行 開花' }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = S.keepUrl; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  toast('📸 已存成圖片（下載資料夾）');
}

const phone = document.getElementById('phone');
function render() {
  const v = V[S.v];
  // 開花動畫只播這一次，之後不管什麼原因重畫都不再播。
  requestAnimationFrame(() => { S.justLit = null; });
  document.getElementById('vtabs').innerHTML = V.map((x, i) => `<button class="${i === S.v ? 'on' : ''}" data-v="${i}">${x.name}</button>`).join('');
  document.getElementById('notes').innerHTML = `<span class="tag">${v.tag}</span><h2>${v.title}</h2>${v.desc}<h3>每版都一樣的</h3><ul><li>點花（或花苞）出明細：開花日期、從第一次練到開花花幾天、手寫練幾次／多久、點亮考幾次、最好幾 %、上次還錯哪幾字；下面「開始點亮」直接進那一行的點亮考試。</li><li>開花時有一段<b>綻放動畫</b>（從小轉著長大、彈一下）。</li></ul><div class="try">試試：按右上 ✦ 連按幾次，看花一朵朵開、背景跟花瓣越來越熱鬧；點任一朵花看明細。</div>`;
  phone.innerHTML = `<div class="status"><span>21:30</span><span>5G ▮</span></div><div class="screen">${v.render()}</div>
    ${S.sheet !== null ? `<div class="sheet-bg" data-close></div><div class="sheet"><span data-close style="position:absolute;right:14px;top:12px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);cursor:pointer;font-size:14px">✕</span>${detail(S.sheet)}</div>` : ''}${S.toast ? `<div class="toast">${S.toast}</div>` : ''}${v.overlay ? v.overlay() : ''}${S.keepUrl ? `<div class="keep-prev" data-keep-close><img src="${S.keepUrl}"><div class="small">這張已經存下來了（手機會跳出分享選單，選「儲存影像」就進照片）<br>點任何地方關閉</div></div>` : ''}`;
}
let tt;
// 提示消失時只拿掉那一條，不整個重畫——整個重畫會讓開花動畫、明細卡片的彈出動畫又播一次（2026-10-16 使用者回報「點開花會觸發兩次」）。
function toast(t) { S.toast = t; clearTimeout(tt); tt = setTimeout(() => { S.toast = null; const el = phone.querySelector('.toast'); if (el) el.remove(); }, 1700); }
document.addEventListener('click', e => {
  if (e.target.closest('[data-calib]')) { S.calib = !S.calib; render(); return; }
  if (S.calib && e.target.closest('[data-bud]')) return;
  if (e.target.closest('[data-keep-close]')) { S.keepUrl = null; render(); return; }
  if (e.target.closest('[data-keep]')) { keepsake(+e.target.closest('[data-keep]').dataset.keep).catch(err => toast('存圖失敗：' + err.message)); return; }
  if (e.target.closest('[data-cele-close]')) { const g = e.target.closest('[data-go]'); S.cele = null; if (g) toast(`開始點亮 ${ROWS[+g.dataset.go]}行…`); render(); return; }
  const tr = e.target.closest('[data-tiprow]'); if (tr) { S.sheet = +tr.dataset.tiprow; render(); return; }
  if (e.target.closest('[data-tip]')) { S.tip = (S.tip || 0) + 1; render(); return; }
  const hl = e.target.closest('[data-hl]');
  if (hl) { const i = +hl.dataset.hl; if (S.hl === i) { S.sheet = i; S.hl = null; } else { S.hl = i; } render(); return; }
  const el = e.target.closest('[data-v],[data-row],[data-close],[data-go],[data-sim]');
  if (!el) return; const d = el.dataset;
  S.justLit = null;
  if (d.v) { S.v = +d.v; S.sheet = null; S.hl = null; S.cele = null; }
  else if (d.sim !== undefined) { const i = nextIdx(); if (i < 0) { S.data = SEED.map(r => [...r]); toast('全部開完了，重來一次'); } else { const r = S.data[i]; r[0] = '10/16'; r[1] = r[1] || '10/14'; r[4]++; r[5] = 100; r[6] = ''; S.justLit = i; if (V[S.v].cele) S.cele = i; else toast(`🌸 ${ROWS[i]}行 開花了！`); } }
  else if (d.row !== undefined) S.sheet = +d.row;
  else if (d.close !== undefined) S.sheet = null;
  else if (d.go !== undefined) { S.sheet = null; toast(`開始點亮 ${ROWS[+d.go]}行…`); }
  render();
});
let dragBud = null;
phone.addEventListener('pointerdown', e => { if (!S.calib) return; const b = e.target.closest('[data-bud]'); if (b) { dragBud = +b.dataset.bud; e.preventDefault(); } });
window.addEventListener('pointermove', e => { if (dragBud === null) return; const r = document.getElementById('art').getBoundingClientRect(); BUDS[dragBud] = [(e.clientX - r.left) / SC, (e.clientY - r.top) / SC]; render(); });
window.addEventListener('pointerup', () => { dragBud = null; });
// 沒指定就開第 6 版（GPT 圖層版，正在一步一步做）。
S.v = /^#[1-9]$/.test(location.hash) ? +location.hash[1] - 1 : V.length - 1;
render();
</script>
</body>
</html>
