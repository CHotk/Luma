<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT 播放清單</title>
<style>
  :root {
    --bg: #0C0C13; --card: #151520; --card2: #161622; --sheet: #1A1A27; --line: #2A2A3D;
    --ink: #F3F2F8; --ink2: #A3A2B2; --ink3: #74738A;
    --accent: #7EA6FF; --accentSolid: #2E6BFF; --yt: #FF4E45; --ok: #5FE08D; --mid: #F5C763; --pink: #FF6FA8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); min-height: 100vh; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif; }
  .page { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .lead { color: var(--ink2); font-size: 13px; margin: 0 0 18px; } .lead b { color: var(--ink); }
  .vtabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .vtabs button { border: 1px solid var(--line); background: var(--card); color: var(--ink2); padding: 8px 14px; border-radius: 99px; cursor: pointer; font-size: 13px; }
  .vtabs button.on { border-color: var(--accent); color: #fff; background: rgba(46,107,255,.35); }
  .stage { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .notes { flex: 1 1 320px; max-width: 460px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; font-size: 13.5px; color: var(--ink2); }
  .notes h2 { color: var(--ink); font-size: 17px; margin: 0 0 4px; }
  .notes .tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px; background: rgba(255,78,69,.15); color: var(--yt); margin-bottom: 10px; }
  .notes h3 { color: var(--ink); font-size: 13.5px; margin: 14px 0 4px; }
  .notes ul { margin: 0; padding-left: 18px; } .notes li { margin: 3px 0; }
  .notes .try { margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: rgba(126,166,255,.08); border: 1px solid rgba(126,166,255,.25); color: var(--ink); font-size: 12.5px; }
  .reset { margin-top: 12px; border: 1px solid var(--line); background: transparent; color: var(--ink2); border-radius: 10px; padding: 6px 12px; cursor: pointer; font-size: 12px; }

  .phone { width: 380px; max-width: 100%; height: 800px; flex-shrink: 0; border-radius: 34px; border: 1px solid var(--line);
    background: radial-gradient(120% 60% at 20% 0%, #2a1520 0%, #0e0e17 60%); position: relative; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .screen { position: absolute; inset: 0 0 62px 0; overflow-y: auto; padding: 14px 14px 24px; scrollbar-width: thin; scrollbar-color: #4a4a66 transparent; }
  .nav { position: absolute; left: 0; right: 0; bottom: 0; height: 62px; display: flex; border-top: 1px solid var(--line); background: rgba(14,14,22,.95); z-index: 10; }
  .nav button { flex: 1; border: 0; background: transparent; color: var(--ink3); font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .nav button b { font-size: 18px; font-weight: 400; }
  .nav button.on { color: var(--ink); }
  .nav button.on b { color: var(--yt); }
  .bar { display: flex; align-items: center; gap: 6px; padding: 4px 0 12px; }
  .bar .t { flex: 1; font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ib { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: var(--ink2); cursor: pointer; font-size: 16px; flex-shrink: 0; }
  .ib:hover { background: rgba(255,255,255,.05); }
  .note { font-size: 11.5px; color: var(--ink2); } .note3 { font-size: 11px; color: var(--ink3); }
  .row { display: flex; align-items: center; gap: 8px; } .sp { flex: 1; }
  .gap { height: 12px; }
  .sect { font-size: 12px; color: var(--ink2); margin: 14px 2px 6px; display: flex; align-items: center; }
  .sect .link { margin-left: auto; color: var(--accent); cursor: pointer; font-size: 12px; }
  .vid { display: flex; gap: 10px; padding: 8px 2px; border-bottom: 1px solid rgba(255,255,255,.05); align-items: flex-start; }
  .thumb { width: 118px; aspect-ratio: 16/9; border-radius: 10px; flex-shrink: 0; position: relative; overflow: hidden; cursor: pointer; }
  .thumb b { position: absolute; right: 5px; bottom: 4px; font-size: 10px; background: rgba(0,0,0,.75); padding: 0 4px; border-radius: 4px; font-weight: 600; }
  .thumb .em { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 22px; opacity: .8; }
  .vt { font-size: 12.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); color: var(--ink2); border-radius: 99px; padding: 4px 11px; font-size: 12px; cursor: pointer; background: transparent; white-space: nowrap; }
  .chip.on { background: rgba(255,78,69,.18); border-color: rgba(255,78,69,.6); color: #fff; }
  .btn { border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 13.5px; cursor: pointer; background: var(--yt); color: #fff; }
  .btn.ghost { background: rgba(255,255,255,.07); color: var(--ink); }
  .btn.sm { padding: 6px 10px; font-size: 12px; border-radius: 10px; }
  .mini { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; cursor: pointer; color: var(--ink3); flex-shrink: 0; font-size: 15px; }
  .mini:hover { background: rgba(255,255,255,.06); color: var(--ink); }
  .heart.on { color: var(--pink); }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: flex; align-items: flex-end; animation: fade .18s; }
  .sheet { width: 100%; background: var(--sheet); border-radius: 24px 24px 0 0; max-height: 86%; display: flex; flex-direction: column; animation: up .22s ease-out; }
  .sheet .body { overflow-y: auto; padding: 0 16px 16px; }
  .handle { width: 40px; height: 5px; border-radius: 9px; background: rgba(255,255,255,.14); margin: 10px auto 8px; }
  .menu { position: absolute; z-index: 25; background: #232336; border: 1px solid #36364f; border-radius: 14px; padding: 6px; min-width: 190px; box-shadow: 0 12px 30px rgba(0,0,0,.5); animation: fade .12s; }
  .menu div { padding: 9px 10px; border-radius: 9px; cursor: pointer; font-size: 13px; }
  .menu div:hover { background: rgba(255,255,255,.06); }
  .pl { display: flex; align-items: center; gap: 12px; padding: 10px 4px; cursor: pointer; border-radius: 10px; }
  .pl:hover { background: rgba(255,255,255,.03); }
  .cover { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; flex-shrink: 0; position: relative; overflow: hidden; }
  .check { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--ink3); display: grid; place-items: center; font-size: 13px; flex-shrink: 0; }
  .check.on { background: var(--yt); border-color: var(--yt); color: #fff; }
  .input { display: flex; align-items: center; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
  .input input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--ink); font: inherit; padding: 10px 0; }
  .toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 40; max-width: 88%; background: rgba(30,30,46,.95); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 9px 14px; font-size: 12.5px; text-align: center; animation: drop .25s; display: flex; gap: 10px; align-items: center; }
  .toast span { color: var(--accent); cursor: pointer; white-space: nowrap; }
  .collage { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; border-radius: 14px; overflow: hidden; aspect-ratio: 16/10; position: relative; }
  .collage i { display: block; }
  .collage .cnt { position: absolute; right: 0; top: 0; bottom: 0; width: 42%; background: rgba(10,10,16,.78); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hero { margin: -14px -14px 0; padding: 20px 16px 16px; }
  .carousel { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; margin: 0 -14px; padding-left: 14px; padding-right: 14px; scrollbar-width: none; }
  .bigcover { width: 132px; flex-shrink: 0; cursor: pointer; }
  .bigcover .sq { width: 132px; height: 132px; border-radius: 16px; display: grid; place-items: center; font-size: 46px; box-shadow: 0 10px 24px rgba(0,0,0,.4); }
  .kanban { display: flex; gap: 10px; overflow-x: auto; margin: 0 -14px; padding: 0 14px 10px; scroll-snap-type: x mandatory; }
  .col { width: 250px; flex-shrink: 0; background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 16px; padding: 10px; scroll-snap-align: start; }
  .kcard { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 8px; margin-top: 8px; }
  .kcard .thumb { width: 100%; }
  .tagdot { display: inline-block; font-size: 10px; padding: 0 7px; border-radius: 99px; margin: 2px 3px 0 0; }
  .drag { color: var(--ink3); cursor: grab; padding: 0 2px; }
  @keyframes fade { from { opacity: 0 } }
  @keyframes up { from { transform: translateY(40px); opacity: 0 } }
  @keyframes drop { from { transform: translate(-50%, -14px); opacity: 0 } }
</style>
</head>
<body>
<div class="page">
  <h1>YT 管理：播放清單（收藏影片）五種設計</h1>
  <p class="lead">
    像 YouTube 播放清單那樣，把最愛、想之後看、想存起來的影片收起來。五版功能都一樣：<b>把影片存進清單、一部可以存進好幾個清單、新增／改名／刪除清單、清單裡排順序、移除、從清單直接播、看是哪個頻道的</b>。
    存的是影片當下的標題、縮圖、頻道（之後頻道刪掉或影片下架也還看得到名字），而且<b>跟其他資料一樣多裝置同步</b>。<br>
    手機框下面兩個分頁：「影片」（模擬依影片顯示）、「播放清單」。都能點：存、取消、新增清單、排順序、移除、播放。
  </p>
  <div class="vtabs" id="vtabs"></div>
  <div class="stage">
    <div class="phone" id="phone"></div>
    <div class="notes" id="notes"></div>
  </div>
</div>
<script>
const CH = { gao: ['老高與小茉', '#FF4E45'], cook: ['阿慶師', '#5FE08D'], tech: ['電獺少女', '#7EA6FF'], game: ['老皮實況', '#FF8A4C'], music: ['Joeman', '#C792EA'], study: ['啾啾鞋', '#F5C763'] };
const VIDS = [
  ['宇宙的盡頭是什麼？我們可能一直搞錯了', 'gao', '28:14', '🌌'], ['三杯雞這樣做，餐廳師傅都在用的祕訣', 'cook', '12:40', '🍗'],
  ['iPhone 18 Pro 開箱：值得換嗎？', 'tech', '18:02', '📱'], ['艾爾登法環 DLC 全收集路線', 'game', '1:42:10', '🗡️'], ['一個人去日本吃 10 家拉麵', 'music', '24:33', '🍜'],
  ['為什麼會做清醒夢？大腦在幹嘛', 'study', '15:21', '💤'], ['金字塔裡被封住的房間', 'gao', '31:05', '🔺'], ['紅燒牛肉麵，湯頭一次到位', 'cook', '16:48', '🍲'],
  ['我用 AI 寫了一整個 App', 'tech', '21:30', '🤖'], ['薩爾達：王國之淚 100% 結局', 'game', '58:12', '🗺️'], ['花 10 萬買的耳機到底差在哪', 'music', '19:44', '🎧'], ['一次看懂量子力學', 'study', '13:09', '⚛️'],
].map(([title, ch, len, em], i) => ({ id: i, title, ch, len, em, c: [`hsl(${i * 47 % 360} 45% 22%)`, `hsl(${(i * 47 + 60) % 360} 50% 14%)`] }));
function seed() {
  return [
    { id: 'fav', name: '最愛', em: '❤️', color: '#FF6FA8', vids: [0, 6, 2] },
    { id: 'later', name: '稍後觀看', em: '🕘', color: '#7EA6FF', vids: [3, 9, 8, 1] },
    { id: 'learn', name: '想學的', em: '📚', color: '#F5C763', vids: [11, 5] },
  ];
}
const S = { v: 0, tab: 'feed', pls: seed(), open: null, sheet: null, menu: null, toast: null, undo: null, filter: [], tagMode: 'or', newName: '' };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const pl = id => S.pls.find(p => p.id === id);
const inAny = vid => S.pls.filter(p => p.vids.includes(vid));
const thumb = (v, w) => `<div class="thumb" data-a="play" data-id="${v.id}" style="${w ? 'width:' + w + 'px;' : ''}background:linear-gradient(135deg,${v.c[0]},${v.c[1]})"><span class="em">${v.em}</span><b>${v.len}</b></div>`;
const chName = v => `<span style="color:${CH[v.ch][1]}">●</span> ${CH[v.ch][0]}`;
function toggle(pid, vid) {
  const p = pl(pid), had = p.vids.includes(vid);
  p.vids = had ? p.vids.filter(x => x !== vid) : [...p.vids, vid];
  return !had;
}
function toast(m, undo) { S.toast = m; S.undo = undo || null; clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; S.undo = null; paint(); }, 2600); }
function coverCollage(p) {
  const vs = p.vids.slice(0, 4).map(i => VIDS[i]);
  return `<div class="collage">${[0, 1, 2, 3].map(k => vs[k] ? `<i style="background:linear-gradient(135deg,${vs[k].c[0]},${vs[k].c[1]})"></i>` : `<i style="background:${p.color}22"></i>`).join('')}
    <div class="cnt"><b style="font-size:16px">${p.vids.length}</b>部<span style="font-size:18px">≡▶</span></div></div>`;
}
// 存到哪些清單的底部表單（版本 1、3 共用）
function saveSheet(vid, style) {
  const v = VIDS[vid];
  return `<div class="scrim" data-a="closeSheet"><div class="sheet" data-stop><div class="handle"></div>
    <div class="row" style="padding:0 16px 8px"><b style="flex:1">存到…</b><span class="note3">${esc(v.title.slice(0, 14))}…</span></div>
    <div class="body">${S.pls.map(p => style === 'tile'
      ? `<div class="pl" data-a="tog" data-p="${p.id}" data-id="${vid}"><div class="cover" style="background:${p.color}33">${p.em}</div><div class="sp"><b>${esc(p.name)}</b><div class="note3">${p.vids.length} 部</div></div>${p.vids.includes(vid) ? '<b style="color:var(--ok);font-size:18px">✓</b>' : '<span class="mini">＋</span>'}</div>`
      : `<div class="pl" data-a="tog" data-p="${p.id}" data-id="${vid}"><div class="check ${p.vids.includes(vid) ? 'on' : ''}">${p.vids.includes(vid) ? '✓' : ''}</div><span style="font-size:18px">${p.em}</span><span class="sp">${esc(p.name)}</span><span class="note3">${p.vids.length}</span></div>`).join('')}
      <div class="gap"></div><div class="row"><div class="input" style="flex:1"><input data-k="newName" placeholder="新增播放清單…" value="${esc(S.newName)}"></div><button class="btn sm" data-a="newPl" data-id="${vid}">建立並存入</button></div>
    </div><div style="padding:8px 16px 16px"><button class="btn" style="width:100%" data-a="closeSheet">完成</button></div></div></div>`;
}
function plDetail(p, opts = {}) {
  const vs = p.vids.map(i => VIDS[i]);
  const first = vs[0];
  return `<div class="hero" style="background:linear-gradient(180deg,${first ? first.c[0] : p.color + '55'} 0%, transparent 100%)">
      <div class="row"><div class="ib" data-a="back">←</div><span class="sp"></span><div class="ib" data-a="plMenu" data-p="${p.id}">⋯</div></div>
      <div style="display:flex;gap:14px;align-items:flex-end;margin-top:8px"><div class="cover" style="width:${opts.big ? 110 : 84}px;height:${opts.big ? 110 : 84}px;font-size:${opts.big ? 46 : 34}px;background:${p.color}44;border-radius:18px">${p.em}</div>
        <div><div style="font-size:21px;font-weight:900">${esc(p.name)}</div><div class="note">${vs.length} 部影片・${new Set(vs.map(v => v.ch)).size} 個頻道</div></div></div>
      <div class="row" style="margin-top:14px"><button class="btn" style="flex:1" data-a="playAll" data-p="${p.id}">▶ 全部播放</button><button class="btn ghost" style="flex:1" data-a="shuffle" data-p="${p.id}">🔀 隨機播放</button></div></div>
    ${vs.length ? vs.map((v, i) => `<div class="vid"><span class="drag" title="排順序">⋮⋮</span>${thumb(v, 104)}<div class="sp" style="min-width:0"><div class="vt">${esc(v.title)}</div><div class="note3">${chName(v)}</div></div>
      <div style="display:flex;flex-direction:column"><span class="mini" data-a="up" data-p="${p.id}" data-i="${i}">↑</span><span class="mini" data-a="rm" data-p="${p.id}" data-id="${v.id}">✕</span></div></div>`).join('')
      : `<div class="note3" style="text-align:center;padding:40px 10px">這個清單還是空的<br>到「影片」那邊存幾部進來</div>`}`;
}
function feedRow(v, right) {
  return `<div class="vid">${thumb(v)}<div class="sp" style="min-width:0"><div class="vt">${esc(v.title)}</div><div class="note3">${chName(v)}・${v.id + 2} 天前</div>
    ${inAny(v.id).length ? `<div style="margin-top:3px">${inAny(v.id).map(p => `<span class="tagdot" style="background:${p.color}22;color:${p.color}">${p.em} ${esc(p.name)}</span>`).join('')}</div>` : ''}</div>${right}</div>`;
}

const V = [
  {
    name: '1 YouTube 式（主流）', title: '版本 1：跟 YouTube 一模一樣的「存到…」', tag: 'YouTube App 的做法',
    desc: `<h3>怎麼存</h3><ul><li>每部影片右邊 ⋮ → 「存到播放清單」，下面滑出清單列表打勾（可以勾好幾個），最下面直接打名字新建。</li>
      <li>⋮ 選單第一個是「存到稍後觀看」，一鍵存。</li></ul>
      <h3>怎麼看</h3><ul><li>「播放清單」分頁：兩欄大卡，封面是清單裡前 4 部縮圖拼起來、右邊半透明寫幾部（YouTube 媒體庫那樣）。</li>
      <li>點進去：上面漸層大標題、「全部播放」「隨機播放」，下面清單可以 ↑ 排順序、✕ 移除（有復原）。</li></ul>
      <h3>好處</h3><ul><li>不用學，跟 YouTube 一樣。</li></ul><h3>缺點</h3><ul><li>存一部要點兩下。</li></ul>`,
    feed() { return VIDS.map(v => feedRow(v, `<span class="mini" data-a="dots" data-id="${v.id}">⋮</span>`)).join(''); },
    lib() {
      if (S.open) return plDetail(pl(S.open));
      return `<div class="bar"><div class="t">播放清單</div><div class="ib" data-a="newPlPrompt">＋</div></div><div class="grid2">${S.pls.map(p => `<div data-a="openPl" data-p="${p.id}" style="cursor:pointer">${coverCollage(p)}<div style="font-weight:700;margin-top:6px">${p.em} ${esc(p.name)}</div><div class="note3">${p.vids.length} 部影片</div></div>`).join('')}</div>`;
    },
  },
  {
    name: '2 愛心＋收藏夾', title: '版本 2：每部影片一顆愛心，一點就收進「最愛」', tag: '存最快',
    desc: `<h3>怎麼存</h3><ul><li>每部影片右邊一顆 ♡，點一下變粉紅 ❤️ 直接收進「最愛」，上面跳「已加入最愛・改存到別的」。</li>
      <li>旁邊 📁 選其他收藏夾（稍後觀看、想學的…）。</li></ul>
      <h3>怎麼看</h3><ul><li>「播放清單」分頁最上面一排收藏夾膠囊（像 IG 收藏），點哪個看哪個，下面直接是影片清單。</li><li>「全部」看所有存過的。</li></ul>
      <h3>好處</h3><ul><li>最常做的「這部好看先存」只要一下。</li></ul><h3>缺點</h3><ul><li>存到別的清單還是要多一步。</li></ul>`,
    feed() {
      return VIDS.map(v => { const on = pl('fav').vids.includes(v.id);
        return feedRow(v, `<div style="display:flex;flex-direction:column"><span class="mini heart ${on ? 'on' : ''}" data-a="heart" data-id="${v.id}" style="font-size:18px">${on ? '❤' : '♡'}</span><span class="mini" data-a="folder" data-id="${v.id}">📁</span></div>`); }).join('');
    },
    lib() {
      const cur = S.open || 'all';
      const vids = cur === 'all' ? [...new Set(S.pls.flatMap(p => p.vids))] : pl(cur).vids;
      return `<div class="bar"><div class="t">我的收藏</div><div class="ib" data-a="newPlPrompt">＋</div></div>
        <div class="chips" style="flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px"><button class="chip ${cur === 'all' ? 'on' : ''}" data-a="openPl" data-p="all">全部 ${new Set(S.pls.flatMap(p => p.vids)).size}</button>
        ${S.pls.map(p => `<button class="chip ${cur === p.id ? 'on' : ''}" data-a="openPl" data-p="${p.id}">${p.em} ${esc(p.name)} ${p.vids.length}</button>`).join('')}</div>
        ${cur !== 'all' ? `<div class="row" style="margin:10px 0 2px"><button class="btn sm" data-a="playAll" data-p="${cur}">▶ 全部播放</button><button class="btn ghost sm" data-a="shuffle" data-p="${cur}">🔀 隨機</button><span class="sp"></span><span class="mini" data-a="plMenu" data-p="${cur}">⋯</span></div>` : ''}
        ${vids.map(i => VIDS[i]).map((v, k) => feedRow(v, cur === 'all' ? '' : `<span class="mini" data-a="rm" data-p="${cur}" data-id="${v.id}">✕</span>`)).join('') || '<div class="note3" style="text-align:center;padding:30px">還沒有東西</div>'}`;
    },
  },
  {
    name: '3 音樂 App 式', title: '版本 3：像 Spotify／Apple Music 的大封面清單', tag: '最好看',
    desc: `<h3>怎麼存</h3><ul><li>每部影片右邊 ＋，滑出「加到…」，每個清單一行大封面＋ ✓／＋，點了就加，不用按完成。</li></ul>
      <h3>怎麼看</h3><ul><li>「影片」分頁最上面就有一排橫滑的大方塊封面「我的清單」，不用切分頁就點得進去。</li>
      <li>「播放清單」分頁：大封面直排，每個清單有自己的顏色跟表情符號（可以換）。</li><li>清單頁是大封面＋漸層，播放鈕很大。</li></ul>
      <h3>好處</h3><ul><li>清單有個性、一眼認得；首頁就能進。</li></ul><h3>缺點</h3><ul><li>首頁多一排會把影片往下推。</li></ul>`,
    feed() {
      return `<div class="sect">我的清單<span class="link" data-a="tab" data-t="lib">全部 ›</span></div><div class="carousel">${S.pls.map(p => `<div class="bigcover" data-a="openPlTab" data-p="${p.id}"><div class="sq" style="background:linear-gradient(135deg,${p.color}88,${p.color}22)">${p.em}</div><div style="font-weight:700;margin-top:6px;font-size:13px">${esc(p.name)}</div><div class="note3">${p.vids.length} 部</div></div>`).join('')}
        <div class="bigcover" data-a="newPlPrompt"><div class="sq" style="border:2px dashed var(--line);font-size:30px;color:var(--ink3);box-shadow:none">＋</div><div class="note3" style="margin-top:6px">新清單</div></div></div>
        <div class="sect">最新影片</div>${VIDS.map(v => feedRow(v, `<span class="mini" data-a="plus" data-id="${v.id}" style="font-size:20px">＋</span>`)).join('')}`;
    },
    lib() {
      if (S.open) return plDetail(pl(S.open), { big: true });
      return `<div class="bar"><div class="t">播放清單</div><div class="ib" data-a="newPlPrompt">＋</div></div>${S.pls.map(p => `<div class="pl" data-a="openPl" data-p="${p.id}"><div class="cover" style="width:72px;height:72px;font-size:32px;border-radius:14px;background:linear-gradient(135deg,${p.color}88,${p.color}22)">${p.em}</div>
        <div class="sp"><b style="font-size:15px">${esc(p.name)}</b><div class="note3">${p.vids.length} 部・${new Set(p.vids.map(i => VIDS[i].ch)).size} 個頻道</div></div><span class="mini" data-a="playAll" data-p="${p.id}" style="background:var(--yt);color:#fff;border-radius:50%">▶</span></div>`).join('')}`;
    },
  },
  {
    name: '4 標籤式', title: '版本 4：不分清單，改用標籤（一部可以貼好幾個）', tag: '最彈性',
    desc: `<h3>怎麼存</h3><ul><li>每部影片右邊 🏷，點了下面滑出彩色標籤，點幾個貼幾個（最愛、稍後看、想學的、做菜…），也能新增標籤。</li>
      <li>貼了標籤的影片，標題下面就看得到彩色小標。</li></ul>
      <h3>怎麼看</h3><ul><li>「收藏」分頁：所有貼過標籤的影片一個清單，上面標籤膠囊可以多選篩，旁邊切「符合任一個／全部都要」。</li></ul>
      <h3>好處</h3><ul><li>「想學的＋做菜」這種交叉篩選做得到，清單做不到。</li></ul><h3>缺點</h3><ul><li>沒有「一個清單一個順序」，排序只能照存的時間。</li></ul>`,
    feed() { return VIDS.map(v => feedRow(v, `<span class="mini" data-a="tags" data-id="${v.id}">🏷</span>`)).join(''); },
    lib() {
      const all = [...new Set(S.pls.flatMap(p => p.vids))];
      const ok = vid => !S.filter.length || (S.tagMode === 'or' ? S.filter.some(f => pl(f).vids.includes(vid)) : S.filter.every(f => pl(f).vids.includes(vid)));
      const list = all.filter(ok);
      return `<div class="bar"><div class="t">收藏</div><div class="ib" data-a="newPlPrompt">＋</div></div>
        <div class="chips">${S.pls.map(p => `<button class="chip" data-a="filt" data-p="${p.id}" style="${S.filter.includes(p.id) ? `background:${p.color}33;border-color:${p.color};color:#fff` : ''}">${p.em} ${esc(p.name)} ${p.vids.length}</button>`).join('')}</div>
        <div class="row" style="margin:8px 0 4px"><span class="note3">${list.length} 部</span><span class="sp"></span>${S.filter.length > 1 ? `<button class="chip ${S.tagMode === 'or' ? 'on' : ''}" data-a="mode" data-m="or">任一個</button><button class="chip ${S.tagMode === 'and' ? 'on' : ''}" data-a="mode" data-m="and">全部都要</button>` : ''}</div>
        ${list.map(i => feedRow(VIDS[i], `<span class="mini" data-a="tags" data-id="${i}">🏷</span>`)).join('') || '<div class="note3" style="text-align:center;padding:30px">沒有符合的</div>'}
        ${S.filter.length === 1 ? `<div class="gap"></div><button class="btn" style="width:100%" data-a="playAll" data-p="${S.filter[0]}">▶ 播放「${esc(pl(S.filter[0]).name)}」全部</button>` : ''}`;
    },
  },
  {
    name: '5 看板式', title: '版本 5：三欄看板「稍後觀看 → 最愛 → 想學的」，卡片左右搬', tag: '最有整理感',
    desc: `<h3>怎麼存</h3><ul><li>每部影片右邊 ＋，一律先進第一欄「稍後觀看」（最常見的情境）；長按 ＋ 可以直接選欄。</li></ul>
      <h3>怎麼看</h3><ul><li>「播放清單」分頁是橫向滑的看板，一欄一個清單，卡片上有 ← → 搬到隔壁欄（看完覺得讚就往「最愛」搬）。</li>
      <li>每欄頂端有 ▶ 全部播放；最右邊一欄「＋ 新增清單」。</li></ul>
      <h3>好處</h3><ul><li>「先存、看完再分類」的整理流程很直覺。</li></ul><h3>缺點</h3><ul><li>手機一次只看得到一欄多一點。</li></ul>`,
    feed() { return VIDS.map(v => feedRow(v, `<span class="mini" data-a="toLater" data-id="${v.id}" style="font-size:20px">＋</span>`)).join(''); },
    lib() {
      return `<div class="bar"><div class="t">播放清單</div></div><div class="kanban">${cols5().map((p, ci) => `<div class="col"><div class="row"><span style="font-size:18px">${p.em}</span><b class="sp">${esc(p.name)}</b><span class="note3">${p.vids.length}</span><span class="mini" data-a="playAll" data-p="${p.id}">▶</span><span class="mini" data-a="plMenu" data-p="${p.id}">⋯</span></div>
        ${p.vids.map(i => VIDS[i]).map(v => `<div class="kcard">${thumb(v)}<div class="vt" style="margin-top:6px">${esc(v.title)}</div><div class="note3">${chName(v)}</div>
          <div class="row" style="margin-top:6px">${ci > 0 ? `<span class="mini" data-a="move" data-p="${p.id}" data-id="${v.id}" data-d="-1">←</span>` : ''}<span class="sp"></span><span class="mini" data-a="rm" data-p="${p.id}" data-id="${v.id}">✕</span>${ci < cols5().length - 1 ? `<span class="mini" data-a="move" data-p="${p.id}" data-id="${v.id}" data-d="1">→</span>` : ''}</div></div>`).join('') || '<div class="note3" style="text-align:center;padding:20px 0">空的</div>'}</div>`).join('')}
        <div class="col" style="display:grid;place-items:center;border-style:dashed;cursor:pointer;min-height:200px" data-a="newPlPrompt"><span class="note">＋ 新增清單</span></div></div>`;
    },
  },
];

// 看板：稍後觀看排第一欄（先存、看完再搬）
const cols5 = () => [...S.pls.filter(p => p.id === 'later'), ...S.pls.filter(p => p.id !== 'later')];
function sheets() {
  if (!S.sheet) return '';
  const { type, id } = S.sheet;
  if (type === 'save') return saveSheet(id, 'check');
  if (type === 'plus') return saveSheet(id, 'tile');
  if (type === 'folder' || type === 'tags') {
    return `<div class="scrim" data-a="closeSheet"><div class="sheet" data-stop><div class="handle"></div><div class="row" style="padding:0 16px 10px"><b style="flex:1">${type === 'tags' ? '貼標籤' : '存到收藏夾'}</b><span class="note3">可以選好幾個</span></div>
      <div class="body"><div class="chips">${S.pls.map(p => `<button class="chip" data-a="tog" data-p="${p.id}" data-id="${id}" style="padding:8px 14px;font-size:13px;${p.vids.includes(id) ? `background:${p.color}33;border-color:${p.color};color:#fff` : ''}">${p.em} ${esc(p.name)}${p.vids.includes(id) ? ' ✓' : ''}</button>`).join('')}</div>
      <div class="gap"></div><div class="row"><div class="input" style="flex:1"><input data-k="newName" placeholder="${type === 'tags' ? '新標籤' : '新收藏夾'}名稱" value="${esc(S.newName)}"></div><button class="btn sm" data-a="newPl" data-id="${id}">新增</button></div></div>
      <div style="padding:8px 16px 16px"><button class="btn" style="width:100%" data-a="closeSheet">完成</button></div></div></div>`;
  }
  if (type === 'plMenu') {
    const p = pl(id);
    return `<div class="scrim" data-a="closeSheet"><div class="sheet" data-stop><div class="handle"></div><div class="body">
      <div class="note3" style="margin-bottom:8px">${p.em} ${esc(p.name)}</div><div class="row" style="margin-bottom:10px"><div class="input" style="flex:1"><input data-k="newName" value="${esc(S.newName || p.name)}"></div><button class="btn sm" data-a="rename" data-p="${p.id}">改名</button></div>
      <div class="note3" style="margin-bottom:6px">換圖示</div><div class="chips">${['❤️', '🕘', '📚', '🍳', '🎮', '🎧', '⭐', '🔥', '🌙'].map(e => `<button class="chip" data-a="emoji" data-p="${p.id}" data-e="${e}" style="font-size:16px;${p.em === e ? 'border-color:var(--yt)' : ''}">${e}</button>`).join('')}</div>
      <div class="gap"></div><button class="btn ghost" style="width:100%;color:var(--yt)" data-a="delPl" data-p="${p.id}">刪除這個清單（影片本身不會刪）</button></div></div></div>`;
  }
  if (type === 'newPl') {
    return `<div class="scrim" data-a="closeSheet"><div class="sheet" data-stop><div class="handle"></div><div class="body"><b>新增播放清單</b><div class="gap"></div>
      <div class="row"><div class="input" style="flex:1"><input data-k="newName" placeholder="例如：做菜、睡前聽的" value="${esc(S.newName)}"></div><button class="btn sm" data-a="newPl">建立</button></div></div></div></div>`;
  }
  return '';
}
const phone = document.getElementById('phone');
function paint() {
  const sc = phone.querySelector('.screen'), top = sc ? sc.scrollTop : 0;
  const ae = document.activeElement, keep = ae && phone.contains(ae) && ae.dataset.k ? ae.selectionStart : null;
  const v = V[S.v];
  const body = S.tab === 'feed' ? `<div class="bar"><div class="t">▶ 依影片顯示</div><div class="ib">⚙</div></div>${v.feed()}` : v.lib();
  phone.innerHTML = `<div class="screen">${body}</div>
    <div class="nav"><button class="${S.tab === 'feed' ? 'on' : ''}" data-a="tab" data-t="feed"><b>▶</b>影片</button><button class="${S.tab === 'lib' ? 'on' : ''}" data-a="tab" data-t="lib"><b>≡</b>${S.v === 3 ? '收藏' : '播放清單'}</button></div>
    ${S.menu ? `<div class="menu" style="right:18px;top:${S.menu.y}px"><div data-a="quickLater" data-id="${S.menu.id}">🕘 存到稍後觀看</div><div data-a="openSave" data-id="${S.menu.id}">≡＋ 存到播放清單…</div><div data-a="noop">🙈 隱藏這部</div><div data-a="noop">↗ 在 YouTube 開啟</div></div>` : ''}
    ${sheets()}${S.toast ? `<div class="toast">${S.toast}${S.undo ? '<span data-a="undo">復原</span>' : ''}</div>` : ''}`;
  phone.querySelector('.screen').scrollTop = top;
  if (keep != null) { const el = phone.querySelector('[data-k="newName"]'); if (el) { el.focus(); el.setSelectionRange(keep, keep); } }
}
function pick(i) {
  Object.assign(S, { v: i, tab: 'feed', open: null, sheet: null, menu: null, filter: [], newName: '' });
  document.querySelectorAll('#vtabs button').forEach((b, j) => b.classList.toggle('on', j === i));
  const v = V[i];
  document.getElementById('notes').innerHTML = `<h2>${v.title}</h2><span class="tag">${v.tag}</span>${v.desc}
    <div class="try">試試看：在「影片」存兩三部、新增一個清單；切到下面的「${i === 3 ? '收藏' : '播放清單'}」點進去排順序、移除（有復原）、全部播放。</div>
    <button class="reset" id="reset">↺ 重來（資料還原）</button>`;
  document.getElementById('reset').onclick = () => { S.pls = seed(); pick(S.v); };
  paint();
}
document.getElementById('vtabs').innerHTML = V.map(v => `<button>${v.name}</button>`).join('');
document.querySelectorAll('#vtabs button').forEach((b, i) => b.onclick = () => pick(i));
phone.addEventListener('input', e => { if (e.target.dataset.k === 'newName') S.newName = e.target.value; });
phone.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.k === 'newName') phone.querySelector('[data-a="newPl"],[data-a="rename"]')?.click(); });
phone.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) { if (S.menu) { S.menu = null; paint(); } return; }
  if (el.dataset.a === 'closeSheet' && e.target.closest('[data-stop]') && !e.target.closest('[data-stop] [data-a="closeSheet"]')) return;
  const a = el.dataset.a, id = el.dataset.id != null ? +el.dataset.id : null, p = el.dataset.p;
  if (a !== 'dots') S.menu = null;
  switch (a) {
    case 'tab': S.tab = el.dataset.t; S.open = null; phone.querySelector('.screen').scrollTop = 0; break;
    case 'dots': { const r = el.getBoundingClientRect(), pr = phone.getBoundingClientRect(); S.menu = { id, y: Math.min(r.top - pr.top + 26, 560) }; break; }
    case 'quickLater': { const added = !pl('later').vids.includes(id); if (added) pl('later').vids.push(id); toast(added ? '已存到「稍後觀看」' : '已經在「稍後觀看」了', added ? () => toggle('later', id) : null); break; }
    case 'openSave': S.sheet = { type: 'save', id }; break;
    case 'plus': S.sheet = { type: 'plus', id }; break;
    case 'folder': S.sheet = { type: 'folder', id }; break;
    case 'tags': S.sheet = { type: 'tags', id }; break;
    case 'tog': toggle(p, id); break;
    case 'heart': { const on = toggle('fav', id); toast(on ? '❤ 已加入最愛' : '已從最愛移除', () => toggle('fav', id)); break; }
    case 'toLater': { const added = !pl('later').vids.includes(id); if (added) pl('later').vids.unshift(id); toast(added ? '已放進「稍後觀看」' : '已經在「稍後觀看」了', added ? () => toggle('later', id) : null); break; }
    case 'closeSheet': S.sheet = null; S.newName = ''; break;
    case 'newPlPrompt': S.sheet = { type: 'newPl' }; S.newName = ''; break;
    case 'newPl': {
      const name = S.newName.trim(); if (!name) { toast('先打名字'); break; }
      const np = { id: 'p' + Date.now(), name, em: '⭐', color: ['#5FE08D', '#C792EA', '#FF8A4C', '#4FD1C5'][S.pls.length % 4], vids: id != null ? [id] : [] };
      S.pls.push(np); S.newName = ''; if (S.sheet && S.sheet.type === 'newPl') S.sheet = null;
      toast(`已建立「${name}」${id != null ? '並存入' : ''}`); break;
    }
    case 'openPl': S.open = p; break;
    case 'openPlTab': S.tab = 'lib'; S.open = p; break;
    case 'back': S.open = null; break;
    case 'plMenu': S.sheet = { type: 'plMenu', id: p }; S.newName = ''; break;
    case 'rename': { const n = S.newName.trim(); if (n) pl(p).name = n; S.sheet = null; S.newName = ''; toast('已改名'); break; }
    case 'emoji': pl(p).em = el.dataset.e; break;
    case 'delPl': { if (!confirm('刪除這個清單？裡面的影片不會被刪掉。')) return; const idx = S.pls.findIndex(x => x.id === p), del = S.pls[idx]; S.pls.splice(idx, 1); S.sheet = null; S.open = null; toast(`已刪除「${del.name}」`, () => S.pls.splice(idx, 0, del)); break; }
    case 'up': { const l = pl(p).vids, i = +el.dataset.i; if (i > 0) [l[i - 1], l[i]] = [l[i], l[i - 1]]; break; }
    case 'rm': { const l = pl(p).vids, i = l.indexOf(id); l.splice(i, 1); toast('已從清單移除', () => l.splice(i, 0, id)); break; }
    case 'move': { const cs = cols5(), ci = cs.findIndex(x => x.id === p), to = cs[ci + +el.dataset.d]; pl(p).vids = pl(p).vids.filter(x => x !== id); if (!to.vids.includes(id)) to.vids.unshift(id); toast(`搬到「${to.name}」`); break; }
    case 'filt': S.filter = S.filter.includes(p) ? S.filter.filter(x => x !== p) : [...S.filter, p]; break;
    case 'mode': S.tagMode = el.dataset.m; break;
    case 'play': toast('▶ 播放：' + VIDS[id].title.slice(0, 16) + '…'); break;
    case 'playAll': toast(`▶ 從頭播「${pl(p).name}」${pl(p).vids.length} 部，播完自動下一部`); break;
    case 'shuffle': toast(`🔀 隨機播「${pl(p).name}」`); break;
    case 'undo': if (S.undo) S.undo(); S.toast = null; S.undo = null; break;
    case 'noop': toast('（其他既有功能）'); break;
  }
  paint();
});
pick(0);
</script>
