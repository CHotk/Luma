  .sec { font-weight: 800; font-size: 15px; margin: 14px 14px 8px; display: flex; align-items: center; gap: 8px; }
  .sec .muted { font-weight: 500; }
  /* 上傳頻率圖 */
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 60px; }
  .bars i { flex: 1; background: linear-gradient(var(--accent), rgba(126,166,255,.3)); border-radius: 3px 3px 1px 1px; min-height: 2px; }
  .blbl { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink3); margin-top: 3px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  .sheet-bg { position: absolute; inset: 0; z-index: 80; background: rgba(0,0,0,.5); animation: fade .2s; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 81; background: var(--sheet); border-radius: 24px 24px 0 0; padding: 10px 16px 30px; animation: up .25s cubic-bezier(.2,.9,.3,1); max-height: 80%; overflow-y: auto; }
  .sheet .grab { width: 38px; height: 5px; border-radius: 99px; background: #4a4a5c; margin: 0 auto 12px; }
  .sheet h4 { margin: 14px 0 7px; font-size: 13px; color: var(--ink2); font-weight: 600; }
  .sheet .apply { width: 100%; margin-top: 18px; border: 0; border-radius: 14px; padding: 12px; background: var(--ios); color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; }
  @keyframes up { from { transform: translateY(100%) } } @keyframes fade { from { opacity: 0 } }
  @keyframes pop { from { transform: scale(.9); opacity: 0 } }
  .seg { display: flex; background: rgba(255,255,255,.07); border-radius: 10px; padding: 2px; }
  .seg button { flex: 1; border: 0; background: none; color: var(--ink2); padding: 6px 0; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }

  .ytabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }

  .ytabs button.on { color: var(--ink); border-color: var(--ink); }
  .navbar { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 60; display: flex; gap: 4px; padding: 6px; border-radius: 99px; background: rgba(30,30,44,.72); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.14); }
  .navbar span { padding: 7px 16px; border-radius: 99px; font-size: 12px; font-weight: 700; color: var(--ink2); }
  .navbar span.on { background: rgba(255,255,255,.14); color: #fff; }
  .menu { position: absolute; z-index: 90; background: rgba(30,30,44,.97); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 6px; box-shadow: 0 16px 40px rgba(0,0,0,.6); animation: pop .18s; min-width: 190px; }

  .scrim { position: absolute; inset: 0; z-index: 85; }

  .stat { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 9px 10px; cursor: pointer; }

  .vtabs button.final { border-color: #FFB340; color: #FFB340; } .vtabs button.final.on { background: rgba(255,179,64,.25); color: #fff; }

  .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 99px; padding: 6px 10px; font-size: 11.5px; font-weight: 600; color: var(--ink2); background: rgba(255,255,255,.05); border: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
  .pill.on { color: var(--ink); background: rgba(46,107,255,.22); border-color: #2E6BFF; }
  .fchip { display: inline-block; border-radius: 9px; padding: 5px 11px; font-size: 12.5px; color: var(--ink2); background: rgba(255,255,255,.05); border: 1px solid var(--line); cursor: pointer; }
  .fchip.on { color: var(--ink); background: rgba(46,107,255,.28); border-color: #2E6BFF; }
  .dmenu { position: absolute; z-index: 90; width: 248px; right: 14px; background: rgba(28,28,43,.95); border: 1px solid var(--line); border-radius: 14px; padding: 6px; box-shadow: 0 16px 40px rgba(0,0,0,.6); animation: fade .14s; }
  .dmenu .mi { display: flex; align-items: center; gap: 6px; padding: 9px 10px; border-radius: 9px; font-size: 13px; cursor: pointer; }
  .dmenu .mi.on { background: rgba(46,107,255,.2); font-weight: 700; }
  .dmenu .mi .n { margin-left: auto; font-size: 11.5px; color: var(--ink3); }
  .dmenu .mi.on::after { content: "✓"; color: #2E6BFF; font-weight: 900; }
  .day { font-size: 11.5px; color: var(--ink3); margin: 14px 2px 4px; }
  .wcard { display: flex; gap: 0; background: #17172A; border: 1px solid var(--line); border-radius: 14px; margin: 4px 0; overflow: hidden; }
  .btt { position: absolute; right: 14px; bottom: 96px; z-index: 65; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,78,69,.38); border: 1px solid rgba(255,255,255,.25); color: rgba(255,255,255,.8); font-size: 20px; cursor: pointer; backdrop-filter: blur(6px); }
  .astat { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 9px 10px; } .astat b { display: block; font-size: 16px; }
  .facts { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 6px; } .facts div { min-width: 96px; } .facts b { display: block; font-size: 13.5px; }
  .mbars { display: flex; align-items: flex-end; gap: 6px; height: 58px; margin-top: 8px; } .mbars div { flex: 1; text-align: center; font-size: 10px; color: var(--ink3); }
  .mbars i { display: block; border-radius: 3px; background: rgba(126,166,255,.4); margin: 2px 0 3px; } .mbars i.hi { background: rgba(126,166,255,.95); }
  .wcard .tm { width: 48px; padding: 14px 0 0 10px; font-size: 11.5px; font-weight: 700; color: var(--ink2); flex-shrink: 0; }
</style>
</head>
<body>
<div class="page">
  <h1>YT 頻道詳情頁：五種版面</h1>
  <p class="lead">現在的頻道頁從上到下是：頭像名稱 → 簡介 → 上傳頻率圖 → 全部影片 (N) → 類型篩選 → 時長 ▾ → 隱藏已看過／顯示已隱藏兩個開關 → 影片清單，<b>越長越擠，要滑很久才看到影片</b>。五版都能點：篩選、開關真的會篩下面的影片，往下滑看頭部怎麼收。<br>影片圖是真的 YouTube 縮圖（周杰倫 MV）。</p>
  <div class="vtabs" id="vtabs"></div>
  <div class="stage"><div class="phone" id="phone"></div><div class="notes" id="notes"></div></div>
</div>
<script>
const T = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const AV = T('DYptgVvkVLQ');
// [id, 標題, 秒數, 幾天前, 觀看, 類型, 已看過, 已隱藏, 快取來的]
const RAW = [
  ['1emA1EFsPMM', '周杰倫 Jay Chou【最偉大的作品 Greatest Works of Art】Official MV', 245, 1, '1.2 億', '影片', 0, 0, 0],
  ['HK7SPnGSxLM', '周杰倫 Jay Chou x 五月天阿信【說好不哭 Won\'t Cry】Official MV', 322, 6, '1.6 億', '影片', 1, 0, 0],
  ['kfXdP7nZIiE', '周杰倫 Jay Chou【等你下課 Waiting For You】Official MV', 270, 9, '2.3 億', '影片', 0, 0, 1],
  ['bu7nU9Mhpyo', '周杰倫【告白氣球】#shorts 床邊故事幕後', 42, 12, '820 萬', 'Shorts', 0, 0, 0],
  ['DYptgVvkVLQ', '周杰倫 Jay Chou【晴天 Sunny Day】Official MV', 269, 20, '3.1 億', '影片', 1, 0, 1],
  ['sHD_z90ZKV0', '周杰倫 Jay Chou【稻香 Rice Field】Official MV', 223, 27, '2.5 億', '影片', 0, 0, 1],
  ['9q7JOQfcJQM', '嘉年華世界巡迴演唱會 直播回放【以父之名】', 3920, 33, '540 萬', '直播', 0, 0, 1],
  ['Z8Mqw0b9ADs', '周杰倫 Jay Chou【青花瓷 Blue and White Porcelain】Official MV', 239, 41, '1.9 億', '影片', 1, 0, 1],
  ['Bbp9ZaJD_eA', '周杰倫 Jay Chou【七里香 Orange Jasmine】Official MV', 299, 55, '2.8 億', '影片', 0, 1, 1],
  ['6Q0Pd53mojY', '周杰倫【夜曲】#shorts 十一月的蕭邦', 55, 60, '310 萬', 'Shorts', 0, 0, 1],
  ['Y4xCVlyCvX4', '周杰倫 Jay Chou【簡單愛 Simple Love】Official MV', 270, 74, '1.4 億', '影片', 0, 0, 1],
  ['uIWypArI73w', '周杰倫 Jay Chou【不能說的祕密 Secret】Official MV', 296, 90, '1.7 億', '影片', 1, 0, 1],
  ['YJfHuATJYsQ', '周杰倫 Jay Chou【擱淺 Step Aside】Official MV', 235, 110, '9800 萬', '影片', 0, 0, 1],
  ['_B8RaLCNUZw', '周杰倫 Jay Chou【聽媽媽的話 Listen to Mom】Official MV', 266, 140, '8700 萬', '影片', 0, 1, 1],
  ['VitJnr3IySc', '周杰倫 Jay Chou【蒲公英的約定】Official MV', 247, 170, '7600 萬', '影片', 0, 0, 1],
  ['1hI-7vj2FhE', '周杰倫 Jay Chou【安靜 Silence】Official MV', 334, 200, '1.1 億', '影片', 1, 0, 1],
];
const VIDS = RAW.map(r => ({ id: r[0], t: r[1], s: r[2], d: r[3], views: r[4], type: r[5], w: !!r[6], h: !!r[7], c: !!r[8] }));
const UPLOADS = [3, 5, 2, 4, 6, 3, 1, 4, 7, 5, 3, 6];
const MONTHS = ['11月', '12月', '1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月'];
const DURS = ['不限', '2 分內', '2–6 分', '6–20 分', '自訂'];
const S = { v: 0, type: '全部', dur: '不限', hideW: true, showH: false, sort: '最新', sheet: null, menu: null, tab: '影片', scrolled: false, info: false, stat: null };
const fmt = s => s >= 3600 ? `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const ago = d => d < 7 ? `${d} 天前` : d < 30 ? `${Math.floor(d / 7)} 週前` : d < 365 ? `${Math.floor(d / 30)} 個月前` : `${Math.floor(d / 365)} 年前`;
function list() {
  let a = VIDS.filter(v => (S.type === '全部' || v.type === S.type)
    && (!S.hideW || !v.w) && (S.showH || !v.h)
    && (S.dur === '不限' || (S.dur === '2 分內' && v.s <= 120) || (S.dur === '2–6 分' && v.s > 120 && v.s <= 360) || (S.dur === '6–20 分' && v.s > 360 && v.s <= 1200) || S.dur === '自訂'));
  if (S.stat === 'unseen') a = a.filter(v => !v.w);
  if (S.sort === '最舊') a = [...a].reverse();
  if (S.sort === '熱門') a = [...a].sort((x, y) => parseFloat(y.views) * (y.views.includes('億') ? 1e4 : 1) - parseFloat(x.views) * (x.views.includes('億') ? 1e4 : 1));
  return a;
}
const filterCount = () => (S.type !== '全部') + (S.dur !== '不限') + (!S.hideW) + S.showH + (S.sort !== '最新');
const row = v => `<div class="vrow ${v.w ? 'watched' : ''}"><div class="th"><img src="${T(v.id)}" loading="lazy"><span class="dur">${fmt(v.s)}</span>${v.w ? '<span class="prog" style="width:100%"></span>' : ''}</div>
  <div class="vi"><div class="vt">${v.t}</div><div class="small" style="margin-top:3px">${v.views} 次・${ago(v.d)}</div>
  <div style="margin-top:3px">${v.w ? '<span class="badge b-w">已看過</span>' : ''}${v.h ? '<span class="badge b-h">已隱藏</span>' : ''}${v.type !== '影片' ? `<span class="badge b-s">${v.type}</span>` : ''}</div></div></div>`;
const listHtml = () => { const a = list(); return a.length ? a.map(row).join('') : '<div class="empty">沒有符合的影片<br><span class="small">把篩選放寬一點看看</span></div>'; };
const typeChips = (cls = '') => ['全部', '影片', 'Shorts', '直播'].map(t => `<span class="chip ${cls} ${S.type === t ? 'on' : ''}" data-type="${t}">${t}${t !== '全部' ? ` ${VIDS.filter(v => v.type === t).length}` : ''}</span>`).join('');
const durChips = () => DURS.map(d => `<span class="chip blue ${S.dur === d ? 'on' : ''}" data-dur="${d}">${d}</span>`).join('');
const toggles = () => `<span class="tgl" data-t="hideW"><span class="sw ${S.hideW ? 'on' : ''}"></span>隱藏已看過</span><span class="tgl" data-t="showH"><span class="sw ${S.showH ? 'on' : ''}"></span>顯示已隱藏</span>`;
const chart = () => `<div class="bars">${UPLOADS.map(n => `<i style="height:${n / 7 * 100}%" title="${n} 部"></i>`).join('')}</div><div class="blbl"><span>${MONTHS[0]}</span><span>${MONTHS[5]}</span><span>${MONTHS[11]}</span></div>`;
const intro = '周杰倫官方 YouTube 頻道。華語流行樂天王，作品橫跨 R&B、中國風、嘻哈。新歌 MV、演唱會、幕後花絮都在這裡。';
const NAV = `<div class="navbar"><span class="on">頻道</span><span>影片</span><span>播放清單</span></div>`;
const topbar = (title, right = '') => `<div class="top"><span class="ib">‹</span><span class="t" id="tt">${title}</span>${right}<span class="ib" title="搜尋">⌕</span><span class="ib" title="編輯">✎</span></div>`;

const V = [];
// 1 YouTube 式（主流）
V.push({ name: '1 YouTube 式分頁（主流）', title: '版本 1：跟 YouTube App 一樣——頭部＋分頁（影片／Shorts／直播／簡介）', tag: '主流・最熟悉',

    return `${topbar(S.scrolled ? '周杰倫 Jay Chou' : '').replace('class="top"', 'class="top" style="background:#0e0e17"')}
      <div class="pad" style="display:flex;gap:12px;align-items:center;padding-bottom:10px"><img class="av" src="${AV}" style="width:58px;height:58px">
        <div><div style="font-weight:800;font-size:17px">周杰倫 Jay Chou</div><div class="muted">音樂・2,140 萬訂閱</div><div class="muted">共 ${VIDS.length} 部影片</div><div class="small" style="color:var(--accent);text-decoration:underline">youtube.com/@jaychou</div></div></div>
      <div class="ytabs" style="position:sticky;top:88px;z-index:30;background:#0e0e17;padding:0 6px">${tabs.map(t => `<button class="${tab === t ? 'on' : ''}" data-tab6="${t}">${t}</button>`).join('')}</div>${body}`;
  },
});

const phone = document.getElementById('phone');
function render() {
  const v = V[S.v];
  document.getElementById('vtabs').innerHTML = V.map((x, i) => `<button class="${i === S.v ? 'on' : ''} ${x.final ? 'final' : ''}" data-v="${i}">${x.name}</button>`).join('');
  document.getElementById('notes').innerHTML = `<span class="tag">${v.tag}</span><h2>${v.title}</h2>${v.desc}<div class="try">試試：改篩選看清單變化、往下滑看頭部、點 ⓘ／⚙／▾。</div>`;
  const st = phone.querySelector('.screen')?.scrollTop || 0;
  let menu = '';
  if (S.menu === 'sort') menu = `<div class="scrim" data-close></div><div class="menu" style="right:14px;top:180px">${['最新', '熱門', '最舊'].map(s => `<div class="mi ${S.sort === s ? 'on' : ''}" data-sort="${s}">${s}</div>`).join('')}</div>`;
  if (S.menu === 'more') menu = `<div class="scrim" data-close></div><div class="menu" style="right:14px;top:84px"><div class="mi" data-t="hideW">${S.hideW ? '✓ ' : ''}隱藏已看過</div><div class="mi" data-t="showH">${S.showH ? '✓ ' : ''}顯示已隱藏</div><div class="mi">⇅ 排序：${S.sort}</div></div>`;
  if (S.menu === 'dur') menu = `<div class="scrim" data-close></div><div class="menu" style="right:14px;top:220px">${DURS.map(d => `<div class="mi ${S.dur === d ? 'on' : ''}" data-dur="${d}">${d}</div>`).join('')}<div style="height:1px;background:var(--line);margin:4px"></div><div class="mi" data-t="hideW">${S.hideW ? '✓ ' : ''}隱藏已看過</div><div class="mi" data-t="showH">${S.showH ? '✓ ' : ''}顯示已隱藏</div></div>`;
  if (S.menu === 'dur6') {
    const base = VIDS.filter(v => (S.type === '全部' || v.type === S.type) && (!S.hideW || !v.w) && (S.showH || !v.h));
    const cnt = d => base.filter(v => d === '不限' || (d === '2 分內' && v.s <= 120) || (d === '2–6 分' && v.s > 120 && v.s <= 360) || (d === '6–20 分' && v.s > 360 && v.s <= 1200)).length;
    menu = `<div class="scrim" data-close style="background:rgba(0,0,0,.26)"></div><div class="dmenu" style="top:${S.menuTop || 260}px">${DURS.map(d => `<div class="mi ${S.dur === d ? 'on' : ''}" data-dur="${d}">${d}${d !== '自訂' ? `<span class="n">${cnt(d)}</span>` : '<span class="n"></span>'}</div>`).join('')}</div>`;
  }
  phone.innerHTML = `<div class="status"><span>21:30</span><span>5G ▮</span></div><div class="screen">${v.render()}</div>${NAV}${v.final ? `<div class="btt" id="btt" data-top style="display:${st > 300 ? 'grid' : 'none'}">↑</div>` : ''}
    ${S.sheet && v.sheet ? `<div class="sheet-bg" data-close></div><div class="sheet"><div class="grab"></div>${v.sheet(S.sheet)}</div>` : ''}${menu}`;
  const sc = phone.querySelector('.screen'); sc.scrollTop = st;
  sc.onscroll = () => { const b = phone.querySelector('#btt'); if (b) b.style.display = sc.scrollTop > 300 ? 'grid' : 'none'; const s = sc.scrollTop > 70; if (s !== S.scrolled) { S.scrolled = s; const tt = phone.querySelector('#tt'); if (tt) tt.textContent = s ? '周杰倫 Jay Chou' : ''; } };
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-top]')) { phone.querySelector('.screen').scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const el = e.target.closest('[data-tab6],[data-v],[data-type],[data-dur],[data-t],[data-sort],[data-open],[data-close],[data-tab],[data-tab5],[data-info],[data-clear],[data-menu],[data-stat]');
  if (!el) return; const d = el.dataset;
  if (d.v) { Object.assign(S, { v: +d.v, sheet: null, menu: null, tab: '影片', type: '全部', scrolled: false }); phone.querySelector('.screen') && (phone.querySelector('.screen').scrollTop = 0); }
  else if (d.type) S.type = d.type;
  else if (d.dur) { S.dur = d.dur; if (S.menu === 'dur' || S.menu === 'dur6') S.menu = null; }
  else if (d.t) S[d.t] = !S[d.t];
  else if (d.sort) { S.sort = d.sort; S.menu = null; }
  else if (d.open) S.sheet = d.open;
  else if (d.close !== undefined) { S.sheet = null; S.menu = null; }
  else if (d.tab) { S.tab = d.tab; if (d.tab !== '簡介') S.type = d.tab === '影片' ? '影片' : d.tab; }
  else if (d.tab5) S.tab5 = d.tab5;
  else if (d.info !== undefined) S.info = !S.info;
  else if (d.clear) { if (d.clear === 'type') S.type = '全部'; if (d.clear === 'dur') S.dur = '不限'; if (d.clear === 'hideW') S.hideW = true; if (d.clear === 'showH') S.showH = false; }
  else if (d.menu) { S.menu = d.menu; const r = el.getBoundingClientRect(), pr = phone.getBoundingClientRect(); S.menuTop = r.bottom - pr.top + 6; }
  else if (d.tab6) { S.tab6 = d.tab6; S.type = ['全部', 'Shorts', '直播'].includes(d.tab6) ? d.tab6 : S.type; }
  else if (d.stat !== undefined) S.stat = d.stat || null;
  render();
});
// 沒指定就開最終版。
S.v = /^#[1-6]$/.test(location.hash) ? +location.hash[1] - 1 : V.length - 1;
render();
</script>
</body>
</html>
