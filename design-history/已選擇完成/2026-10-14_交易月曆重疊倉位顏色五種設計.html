<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月曆重疊倉位顏色</title>
<style>
  :root {
    --bg: #0C0C13; --card: #151520; --card2: #1A1A27; --sheet: #1C1C29; --line: #2A2A3D;
    --ink: #F3F2F8; --ink2: #A3A2B2; --ink3: #74738A; --accent: #7EA6FF; --up: #34D399; --down: #F87171; --mid: #F5C763;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); min-height: 100vh; font: 14px/1.5 -apple-system, "SF Pro Text", system-ui, "Segoe UI", "Microsoft JhengHei", sans-serif; }
  .page { max-width: 1140px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .lead { color: var(--ink2); font-size: 13px; margin: 0 0 14px; } .lead b { color: var(--ink); }
  .vtabs, .ntabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  .vtabs button, .ntabs button { border: 1px solid var(--line); background: var(--card); color: var(--ink2); padding: 8px 14px; border-radius: 99px; cursor: pointer; font-size: 13px; }
  .vtabs button.on { border-color: var(--accent); color: #fff; background: rgba(46,107,255,.35); }
  .ntabs button.on { border-color: var(--mid); color: #1a1405; background: var(--mid); font-weight: 800; }
  .ntabs span { font-size: 12px; color: var(--ink3); margin-right: 4px; }
  .stage { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .notes { flex: 1 1 320px; max-width: 470px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; font-size: 13.5px; color: var(--ink2); }
  .notes h2 { color: var(--ink); font-size: 17px; margin: 0 0 4px; }
  .notes .tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px; background: rgba(245,199,99,.15); color: var(--mid); margin-bottom: 8px; }
  .notes h3 { color: var(--ink); font-size: 13.5px; margin: 14px 0 4px; }
  .notes ul { margin: 0; padding-left: 18px; } .notes li { margin: 3px 0; }
  .notes .box { margin-top: 14px; padding: 11px 13px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); font-size: 12.5px; }
  .notes .box b { color: var(--ink); }
  .pal { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .pal i { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-style: normal; font-size: 10px; font-weight: 800; color: #111; }

  .phone { width: 390px; max-width: 100%; height: 820px; flex-shrink: 0; border-radius: 44px; border: 1px solid var(--line);
    background: radial-gradient(120% 55% at 20% 0%, #24203a 0%, #0e0e17 60%); position: relative; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .screen { position: absolute; inset: 0; overflow-y: auto; padding: 46px 14px 40px; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  .status { position: absolute; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; font-size: 13px; font-weight: 700; z-index: 30; pointer-events: none; }
  .glass { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 18px; padding: 12px; }
  .row { display: flex; align-items: center; gap: 8px; } .sp { flex: 1; }
  .note { font-size: 12px; color: var(--ink2); } .note3 { font-size: 11px; color: var(--ink3); }
  .bar { display: flex; align-items: center; gap: 8px; padding: 0 2px 12px; }
  .bar .t { flex: 1; font-weight: 800; font-size: 18px; }

  /* 月曆 */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .wd { text-align: center; font-size: 10.5px; color: var(--ink3); padding-bottom: 2px; }
  .cell { position: relative; height: 62px; border-radius: 9px; background: rgba(255,255,255,.035); cursor: pointer; overflow: hidden; }
  .cell.sel { outline: 2px solid #fff; z-index: 3; }
  .cell.today { box-shadow: inset 0 0 0 1px var(--ink2); }
  .cell.dim { opacity: .35; }
  .cell .d { position: absolute; left: 4px; top: 2px; font-size: 10px; color: var(--ink3); }
  .cell .pnl { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; font-size: 10.5px; font-weight: 800; }
  .tg { display: inline-block; font-size: 8.5px; font-weight: 900; padding: 0 2.5px; border-radius: 3px; line-height: 1.35; color: #111; }
  .tags { position: absolute; left: 3px; top: 16px; display: flex; gap: 2px; flex-wrap: wrap; right: 2px; }

  /* V1 底部色條（Google 日曆多日事件） */
  .lanes { position: absolute; left: 0; right: 0; bottom: 2px; display: flex; flex-direction: column-reverse; gap: 1.5px; }
  .lane { height: 2.5px; position: relative; }
  .lane i { position: absolute; top: 0; bottom: 0; }
  /* V3 跨格連續色帶 */
  .spans { position: relative; margin-top: -2px; }
  .weekrow { position: relative; }
  .sband { position: absolute; height: 12px; border-radius: 4px; font-size: 8.5px; font-weight: 800; color: #111; padding: 0 4px; line-height: 12px; white-space: nowrap; overflow: hidden; cursor: pointer; }
  /* V4 分段色塊 */
  .seg { position: absolute; left: 3px; right: 3px; bottom: 2px; height: 6px; display: flex; gap: 1px; border-radius: 3px; overflow: hidden; }
  .seg i { flex: 1; }
  .cnt { position: absolute; right: 3px; top: 2px; font-size: 9px; font-weight: 900; padding: 0 4px; border-radius: 6px; background: rgba(255,255,255,.12); color: var(--ink); }
  /* V2 色點 */
  .dots { position: absolute; left: 0; right: 0; bottom: 3px; display: flex; justify-content: center; gap: 2.5px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; position: relative; }
  .dots i.o { background: transparent !important; border: 2px solid; width: 8px; height: 8px; }
  .dots i.c::after { content: ""; position: absolute; inset: 1.5px; border-radius: 50%; background: #0E0E16; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .lg { display: flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 4px 9px 4px 6px; border-radius: 99px; border: 1px solid var(--line); cursor: pointer; color: var(--ink2); transition: opacity .2s; }
  .lg b { color: var(--ink); }
  .lg i { width: 10px; height: 10px; border-radius: 3px; }
  .lg.off { opacity: .35; }
  .lg.on { border-color: #fff; color: #fff; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 70; display: flex; align-items: flex-end; }
  .sheet { width: 100%; background: var(--sheet); border-radius: 24px 24px 0 0; padding: 0 16px 30px; animation: up .25s cubic-bezier(.2,.9,.3,1); }
  @keyframes up { from { transform: translateY(50px); opacity: .4 } }
  .handle { width: 40px; height: 5px; border-radius: 9px; background: rgba(255,255,255,.18); margin: 9px auto 10px; }
  .tr { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .tr .sw { width: 6px; align-self: stretch; border-radius: 3px; }
</style>
</head>
<body>
<div class="page">
  <h1>交易月曆：重疊倉位用顏色分開・五種設計</h1>
  <p class="lead">同一段時間抱著好幾單時，月曆上現在只有一條黃線，分不出誰是誰。五版都是<b>每一單一個顏色</b>（月曆、甘特圖、當天頁同一個顏色），差在<b>顏色畫在格子的哪裡、怎麼畫</b>。<br>
    上面「重疊幾單」切 1～5 單看每一版會長怎樣；點格子看那天有哪幾單。</p>
  <div class="vtabs" id="vtabs"></div>
  <div class="ntabs" id="ntabs"></div>
  <div class="stage">
    <div class="phone" id="phone"></div>
    <div class="notes" id="notes"></div>
  </div>
</div>
<script>
// 顏色：避開綠／紅（那是賺賠），五個彼此差很多、深底上都看得清楚
const PALETTE = [
  { c: '#F5C763', n: '黃' }, { c: '#60A5FA', n: '藍' }, { c: '#C084FC', n: '紫' }, { c: '#2DD4BF', n: '青' }, { c: '#F472B6', n: '粉' },
];
// 重疊的單（10 月，今天 10/14）；close null＝還抱著
const ALL = [
  { sym: 'BTC', d: '多', lev: 10, o: [3, 21], c: [9, 14], pnl: 246 },
  { sym: 'ETH', d: '空', lev: 15, o: [6, 9], c: [12, 22], pnl: -120 },
  { sym: 'SOL', d: '多', lev: 5, o: [7, 10], c: [8, 16], pnl: 58 },
  { sym: 'DOGE', d: '多', lev: 8, o: [1, 12], c: null, pnl: null },
  { sym: 'XRP', d: '空', lev: 12, o: [8, 23], c: [13, 10], pnl: 80 },
];
const TODAY = 14;
const S = { v: 0, n: 3, sel: null, focus: null };
const trades = () => ALL.slice(0, S.n).map((t, i) => ({ ...t, i, col: PALETTE[i].c, end: t.c ? t.c[0] : TODAY }));
const onDay = d => trades().filter(t => t.o[0] <= d && d <= t.end);
const dayPnl = d => { const l = trades().filter(t => t.c && t.c[0] === d); return l.length ? l.reduce((a, t) => a + t.pnl, 0) : null; };
const fmt = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v);
const lbl = t => `${t.sym}${t.d} ${t.lev}x`;
// 10/1 是星期四
const FIRST = 4;

function cellBase(d, inner, extraCls = '') {
  const p = dayPnl(d), held = onDay(d);
  const bg = p == null ? 'rgba(255,255,255,.035)' : (p > 0 ? `rgba(52,211,153,${.12 + Math.min(Math.abs(p), 250) / 250 * .25})` : `rgba(248,113,113,${.12 + Math.min(Math.abs(p), 250) / 250 * .25})`);
  return `<div class="cell ${S.sel === d ? 'sel' : ''} ${d === TODAY ? 'today' : ''} ${d > TODAY ? 'dim' : ''} ${extraCls}" style="background:${bg}" data-d="${d}">
    <span class="d">${d}</span>${p != null ? `<span class="pnl" style="color:${p > 0 ? 'var(--up)' : 'var(--down)'}">${fmt(p)}</span>` : ''}${inner(d, held)}</div>`;
}
// 開／平標籤用那單的顏色
function tags(d) {
  const ev = [];
  trades().forEach(t => { if (t.o[0] === d) ev.push({ t, k: '開', at: t.o[1] }); if (t.c && t.c[0] === d) ev.push({ t, k: '平', at: t.c[1] }); });
  ev.sort((a, b) => a.at - b.at);
  if (!ev.length) return '';
  return `<div class="tags">${ev.map(e => `<span class="tg" style="background:${e.k === '開' ? e.t.col : 'transparent'};color:${e.k === '開' ? '#111' : e.t.col};box-shadow:inset 0 0 0 1.2px ${e.t.col}">${e.k}</span>`).join('')}</div>`;
}
function grid(inner, extra) {
  let h = '日一二三四五六'.split('').map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < FIRST; i++) h += '<div></div>';
  for (let d = 1; d <= 31; d++) h += cellBase(d, inner, extra ? extra(d) : '');
  return `<div class="cal">${h}</div>`;
}
function legend(clickable) {
  return `<div class="legend">${trades().map(t => `<div class="lg ${S.focus != null ? (S.focus === t.i ? 'on' : 'off') : ''}" ${clickable ? `data-f="${t.i}"` : ''}><i style="background:${t.col}"></i><b>${lbl(t)}</b>${t.c ? `<span style="color:${t.pnl > 0 ? 'var(--up)' : 'var(--down)'}">${fmt(t.pnl)}</span>` : '<span style="color:var(--mid)">抱著</span>'}</div>`).join('')}</div>`;
}
const fade = t => S.focus != null && S.focus !== t.i ? .15 : 1;

const V = [];
V.push({
  name: '1 底部色條（主流）', title: '版本 1：格子底部一單一條細色條（Google 日曆多日事件）', tag: '最多人看過',
  desc: `<h3>長相</h3><ul><li>每一單固定一個「車道」，格子最底下由下往上疊細色條：抱著的那幾天都有那條，連起來就是那單的期間。</li>
    <li>同一單永遠在同一層，跨好幾天一眼連得起來。開／平小標籤也換成那單的顏色（開＝實心、平＝空心框）。</li>
    <li>五單就是五條 2.5px 的線，格子底部約 20px。</li></ul>
    <h3>好處</h3><ul><li>最接近現在的樣子（現在就是一條黃線），改最少。</li></ul><h3>缺點</h3><ul><li>五單時線很細，要靠下面的圖例對顏色。</li></ul>`,
  render() {
    return grid((d, held) => tags(d) + `<div class="lanes">${trades().map(t => { const on = t.o[0] <= d && d <= t.end; return `<div class="lane">${on ? `<i style="left:${t.o[0] === d ? 4 : 0}px;right:${t.end === d ? 4 : 0}px;background:${t.col};border-radius:${t.o[0] === d ? 2 : 0}px ${t.end === d ? 2 : 0}px ${t.end === d ? 2 : 0}px ${t.o[0] === d ? 2 : 0}px;opacity:${fade(t)}"></i>` : ''}</div>`; }).join('')}</div>`) + legend(true);
  },
});
V.push({
  name: '2 色點', title: '版本 2：格子下面一排小圓點，一單一顆', tag: '最乾淨',
  desc: `<h3>長相</h3><ul><li>抱著的那天格子底下一顆那單顏色的小圓點；<b>開倉那天是空心圈</b>、<b>平倉那天是有洞的點</b>、中間的日子實心。</li>
    <li>五單就五顆點並排，數得出今天抱幾單。</li><li>開／平文字標籤拿掉，用點的樣子表示。</li></ul>
    <h3>好處</h3><ul><li>格子最乾淨，損益數字最清楚。</li></ul><h3>缺點</h3><ul><li>看不出「連續」，要靠同顏色的點一格一格找。</li></ul>`,
  render() {
    return grid((d, held) => `<div class="dots">${held.map(t => `<i class="${t.o[0] === d ? 'o' : (t.c && t.c[0] === d ? 'c' : '')}" style="background:${t.col};border-color:${t.col};opacity:${fade(t)}"></i>`).join('')}</div>`) + legend(true);
  },
});
V.push({
  name: '3 跨格色帶', title: '版本 3：一單一條色帶，跨格子連起來，開頭寫幣種', tag: '最像甘特圖',
  desc: `<h3>長相</h3><ul><li>像 Google 日曆月檢視的多日行程：色帶從開倉那格一路畫到平倉那格，<b>中間不斷</b>，每週一行重新起頭。</li>
    <li>色帶開頭寫「BTC多」，看得出是哪一單；結尾是平倉那天。</li><li>色帶疊在格子下半部，損益數字移到格子右上。</li></ul>
    <h3>好處</h3><ul><li>期間一眼看完，不用對顏色；甘特圖可以考慮拿掉。</li></ul><h3>缺點</h3><ul><li>五單時每格要放 5 條 12px 色帶，格子要變高（約 96px）。</li></ul>`,
  render() {
    const n = trades().length, cellH = 30 + n * 13;
    let out = '<div class="cal">' + '日一二三四五六'.split('').map(w => `<div class="wd">${w}</div>`).join('') + '</div>';
    for (let w = 0; w < 5; w++) {
      const startD = w * 7 - FIRST + 1;
      let cells = '';
      for (let k = 0; k < 7; k++) {
        const d = startD + k;
        if (d < 1 || d > 31) { cells += '<div></div>'; continue; }
        const p = dayPnl(d);
        cells += `<div class="cell ${S.sel === d ? 'sel' : ''} ${d === TODAY ? 'today' : ''} ${d > TODAY ? 'dim' : ''}" style="height:${cellH}px" data-d="${d}"><span class="d">${d}</span>${p != null ? `<span style="position:absolute;right:4px;top:2px;font-size:10px;font-weight:800;color:${p > 0 ? 'var(--up)' : 'var(--down)'}">${fmt(p)}</span>` : ''}</div>`;
      }
      const bands = trades().map((t, li) => {
        const a = Math.max(t.o[0], startD, 1), b = Math.min(t.end, startD + 6, 31);
        if (a > b) return '';
        const ka = a - startD, kb = b - startD, colW = 100 / 7;
        const head = t.o[0] === a, tail = t.end === b;
        return `<div class="sband" data-f="${t.i}" style="left:calc(${ka * colW}% + ${head ? 3 : 0}px);width:calc(${(kb - ka + 1) * colW}% - ${(head ? 3 : 0) + (tail ? 3 : 0)}px);top:${20 + li * 13}px;background:${t.col};border-radius:${head ? 4 : 0}px ${tail ? 4 : 0}px ${tail ? 4 : 0}px ${head ? 4 : 0}px;opacity:${fade(t)}">${head || ka === 0 ? lbl(t) + (tail && t.c ? ' ✓' : '') : ''}${!t.c && b === TODAY ? ' →' : ''}</div>`;
      }).join('');
      out += `<div class="weekrow" style="margin-top:4px"><div class="cal">${cells}</div>${bands}</div>`;
    }
    return out + legend(true);
  },
});
V.push({
  name: '4 分段色塊＋數量', title: '版本 4：格子底部一條分段色塊，右上角寫抱幾單', tag: '數量最清楚',
  desc: `<h3>長相</h3><ul><li>格子底部一條 6px 的色塊，抱幾單就切幾段（每段那單的顏色）。</li>
    <li>右上角小徽章「×3」寫這天抱幾單；開／平標籤用那單的顏色。</li><li>色塊段的順序固定（照開倉先後），連續幾天看得出同一段一直在。</li></ul>
    <h3>好處</h3><ul><li>數量一眼就知道；色塊比細線粗，顏色好認。</li></ul><h3>缺點</h3><ul><li>五單時每段很短；連續性比版本 1、3 弱。</li></ul>`,
  render() {
    return grid((d, held) => tags(d) + (held.length ? `${held.length > 1 ? `<span class="cnt">×${held.length}</span>` : ''}<div class="seg">${held.map(t => `<i style="background:${t.col};opacity:${fade(t)}"></i>`).join('')}</div>` : '')) + legend(true);
  },
});
V.push({
  name: '5 圖例點選聚焦', title: '版本 5：上面一排單子按鈕，點一單其他單淡掉（顏色＋聚焦）', tag: '單多時最好讀',
  desc: `<h3>長相</h3><ul><li>月曆上面一排「這個月的單」膠囊（顏色＋幣種＋賺賠）；格子裡用版本 1 的細色條。</li>
    <li><b>點一個膠囊＝只看那一單</b>：其他單的顏色淡掉、那單抱著的格子整格淡淡上色、開平那兩天加框；再點一次取消。</li>
    <li>跟甘特圖連動：點甘特圖的條也是一樣效果。</li></ul>
    <h3>好處</h3><ul><li>重疊再多也讀得懂（一次只看一單）。</li></ul><h3>缺點</h3><ul><li>要多點一下才看得清；平常沒點時跟版本 1 一樣。</li></ul>`,
  render() {
    const chips = `<div class="note3" style="margin:-4px 2px 6px">這個月的單（點一單只看它）</div>` + legend(true);
    const g = grid((d, held) => {
      const f = S.focus != null ? trades()[S.focus] : null;
      const tint = f && f.o[0] <= d && d <= f.end ? `<div style="position:absolute;inset:0;background:${f.col}22;box-shadow:${f.o[0] === d || f.end === d ? `inset 0 0 0 1.5px ${f.col}` : 'none'}"></div>` : '';
      return tint + tags(d) + `<div class="lanes">${trades().map(t => { const on = t.o[0] <= d && d <= t.end; return `<div class="lane">${on ? `<i style="left:0;right:0;background:${t.col};opacity:${fade(t)}"></i>` : ''}</div>`; }).join('')}</div>`;
    });
    return chips + `<div style="height:10px"></div>` + g;
  },
});

const phone = document.getElementById('phone');
function sheet() {
  if (S.sel == null) return '';
  const d = S.sel, held = onDay(d);
  return `<div class="scrim" data-a="close"><div class="sheet" data-stop><div class="handle"></div><b style="font-size:16px">10/${d}・${held.length ? `抱著 ${held.length} 單` : '沒有單'}</b>
    ${held.map(t => { const st = t.o[0] === d ? `${t.o[1]}:00 開倉` : t.c && t.c[0] === d ? `${t.c[1]}:00 平倉` : '整天抱著'; return `<div class="tr"><span class="sw" style="background:${t.col}"></span><div style="flex:1"><b>${lbl(t)}</b><div class="note3">10/${t.o[0]} 開 → ${t.c ? '10/' + t.c[0] + ' 平' : '還抱著'}</div></div>
      <div style="text-align:right"><div class="note">${st}</div>${t.c && t.c[0] === d ? `<b style="color:${t.pnl > 0 ? 'var(--up)' : 'var(--down)'}">${fmt(t.pnl)}</b>` : ''}</div></div>`; }).join('')}
    <div class="note3" style="margin-top:10px">（實際 App 是進到這天的頁面，這裡只示意顏色對得起來）</div></div></div>`;
}
function paint() {
  const v = V[S.v];
  phone.innerHTML = `<div class="status"><span>21:41</span><span>▮▮▮ ◔ 82%</span></div><div class="screen">
    <div class="bar"><div class="t">交易&自律</div></div>
    <div class="glass" style="margin-bottom:12px"><div class="row"><span class="note">10 月已實現損益</span><span class="sp"></span><b style="color:var(--up)">${fmt(trades().filter(t => t.c).reduce((a, t) => a + t.pnl, 0))}</b></div></div>
    <div class="glass"><div class="row" style="margin-bottom:8px"><span>‹</span><b class="sp" style="text-align:center">2026 年 10 月</b><span style="opacity:.3">›</span></div>${v.render()}</div></div>${sheet()}`;
}
function notes() {
  const v = V[S.v];
  document.getElementById('notes').innerHTML = `<h2>${v.title}</h2><span class="tag">${v.tag}</span>${v.desc}
    <div class="box"><b>五版都一樣：顏色怎麼給</b><ul><li>照開倉先後輪流用五個顏色：<div class="pal">${PALETTE.map((p, i) => `<i style="background:${p.c}">${i + 1}</i>`).join('')}</div></li>
      <li><b>避開綠跟紅</b>（月曆上綠＝賺、紅＝賠），五個顏色在深底上彼此差很多。</li>
      <li>同一單在月曆、甘特圖、當天頁、票根都是<b>同一個顏色</b>。</li>
      <li>同時抱超過 5 單時第 6 單起重複用色（實際上你很少超過 3 單）。</li></ul></div>`;
}
function pick(i) { S.v = i; S.sel = null; S.focus = null; document.querySelectorAll('#vtabs button').forEach((b, j) => b.classList.toggle('on', j === i)); notes(); paint(); }
function pickN(n) { S.n = n; S.focus = null; document.querySelectorAll('#ntabs button').forEach((b, j) => b.classList.toggle('on', j + 1 === n)); paint(); }
document.getElementById('vtabs').innerHTML = V.map(v => `<button>${v.name}</button>`).join('');
document.querySelectorAll('#vtabs button').forEach((b, i) => b.onclick = () => pick(i));
document.getElementById('ntabs').innerHTML = '<span>重疊幾單：</span>' + [1, 2, 3, 4, 5].map(n => `<button>${n} 單</button>`).join('');
document.querySelectorAll('#ntabs button').forEach((b, i) => b.onclick = () => pickN(i + 1));
phone.addEventListener('click', e => {
  if (e.target.closest('[data-stop]') && !e.target.closest('[data-a]')?.dataset.a?.startsWith('x')) { if (!e.target.closest('.scrim') || e.target.closest('.sheet')) { if (e.target.closest('.sheet')) return; } }
  const f = e.target.closest('[data-f]'); if (f) { const i = +f.dataset.f; S.focus = S.focus === i ? null : i; paint(); return; }
  const c = e.target.closest('[data-d]'); if (c) { S.sel = +c.dataset.d; paint(); return; }
  if (e.target.closest('[data-a="close"]')) { S.sel = null; paint(); }
});
pick(0); pickN(3);
</script>
</body>
</html>
