<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日文月曆看板 3 三大數字儀表板</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#1B1420;--panel:#241a28;--panel2:#2c1f32;--line:#3a2836;--text:#f6eef1;--sub:#b79aa6;--accent:#EA92AC;--accent2:#F7B8CB;--ok:#8FBF9F;--amb1:#4A2036;--amb2:#6B3550}
