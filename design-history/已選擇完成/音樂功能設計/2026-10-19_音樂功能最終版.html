<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音樂功能最終版</title>
<style>
  :root {
    --bg: #0B0B12; --card: #151520; --card2: #1A1A27; --sheet: #1C1C2A; --line: #2A2A3D;
    --ink: #F4F3F8; --ink2: #A9A8B8; --ink3: #75748A;
    --accent: #7EA6FF; --ios: #0A84FF; --yt: #FF3B3B; --ok: #5FE08D; --mid: #F5C763; --pink: #FF6FAE;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); min-height: 100vh; font: 14px/1.5 -apple-system, "SF Pro Text", system-ui, "Segoe UI", "Microsoft JhengHei", sans-serif; }
  img { display: block; }
  .page { max-width: 1160px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 21px; margin: 0 0 6px; }
  .lead { color: var(--ink2); font-size: 13px; margin: 0 0 14px; } .lead b { color: var(--ink); }
  .vtabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .vtabs button { border: 1px solid var(--line); background: var(--card); color: var(--ink2); padding: 8px 14px; border-radius: 99px; cursor: pointer; font-size: 13px; }
  .vtabs button.on { border-color: var(--accent); color: #fff; background: rgba(46,107,255,.35); }
  .stage { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .notes { flex: 1 1 330px; max-width: 480px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; font-size: 13.5px; color: var(--ink2); }
  .notes h2 { color: var(--ink); font-size: 17px; margin: 0 0 4px; }
  .notes .tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px; background: rgba(255,59,59,.15); color: var(--yt); margin-bottom: 8px; }
  .notes h3 { color: var(--ink); font-size: 13.5px; margin: 14px 0 4px; }
  .notes ul { margin: 0; padding-left: 18px; } .notes li { margin: 3px 0; }
  .notes .box { margin-top: 14px; padding: 11px 13px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); font-size: 12.5px; }
  .notes .box b { color: var(--ink); }
  .notes .try { margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: rgba(126,166,255,.08); border: 1px solid rgba(126,166,255,.25); color: var(--ink); font-size: 12.5px; }
  .notes .warn { background: rgba(245,199,99,.07); border-color: rgba(245,199,99,.3); }
  .notes button.demo { margin-top: 8px; border: 1px solid var(--line); background: var(--card2); color: var(--ink); border-radius: 10px; padding: 6px 10px; cursor: pointer; font-size: 12px; }

  /* 手機框 */
  .phone { width: 390px; max-width: 100%; height: 820px; flex-shrink: 0; border-radius: 44px; border: 1px solid var(--line); background: #0E0E16; position: relative; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
  .screen { position: absolute; inset: 0; overflow-y: auto; padding: 44px 16px 170px; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  .status { position: absolute; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; font-size: 13px; font-weight: 700; z-index: 30; pointer-events: none; }
  .home-ind { position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%); width: 124px; height: 5px; border-radius: 9px; background: rgba(255,255,255,.6); z-index: 90; pointer-events: none; }
  .bgglow { position: absolute; inset: 0 0 auto 0; height: 380px; pointer-events: none; transition: background .6s; }

  .row { display: flex; align-items: center; gap: 10px; } .sp { flex: 1; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 2px 0 12px; position: relative; }
  .bar .t { flex: 1; font-weight: 900; font-size: 26px; letter-spacing: -.3px; }
  .ib { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: var(--ink2); cursor: pointer; flex-shrink: 0; font-size: 17px; }
  .ib:hover { background: rgba(255,255,255,.06); }
  .note { font-size: 12px; color: var(--ink2); } .note3 { font-size: 11px; color: var(--ink3); }
  .h2 { font-size: 18px; font-weight: 800; margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; position: relative; }
  .h2 .more { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--ink2); cursor: pointer; }
  .chips { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; position: relative; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.06); color: var(--ink); border-radius: 9px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
  .chip.on { background: #fff; color: #111; border-color: #fff; font-weight: 700; }
  .hscroll { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 4px; position: relative; }
  .hscroll::-webkit-scrollbar { display: none; }

  .cover { border-radius: 10px; overflow: hidden; background: linear-gradient(135deg,#2a2a40,#15151f); position: relative; flex-shrink: 0; }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .sq { aspect-ratio: 1; }
  .wide { aspect-ratio: 16/9; }
  .round { border-radius: 50%; }
  .tile { width: 132px; cursor: pointer; flex-shrink: 0; }
  .tile .tt { font-size: 13px; font-weight: 700; margin-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song { display: flex; align-items: center; gap: 11px; padding: 7px 0; cursor: pointer; border-radius: 10px; position: relative; }
  .song:hover { background: rgba(255,255,255,.03); }
  .song .cover { width: 50px; height: 50px; border-radius: 8px; }
  .song .meta { flex: 1; min-width: 0; }
  .song .nm { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song.now .nm { color: var(--pink); }
  .song .sub { font-size: 12px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song .num { width: 22px; text-align: center; font-weight: 800; color: var(--ink3); }
  .dots { width: 30px; height: 30px; display: grid; place-items: center; color: var(--ink3); border-radius: 9px; cursor: pointer; }
  .dots:hover { background: rgba(255,255,255,.07); }
  .badge { font-size: 9.5px; font-weight: 800; padding: 1px 5px; border-radius: 5px; margin-right: 4px; vertical-align: 1px; }
  .b-mv { background: rgba(255,59,59,.18); color: #FF7A7A; } .b-live { background: rgba(95,224,141,.15); color: var(--ok); } .b-lyric { background: rgba(126,166,255,.15); color: var(--accent); }
  .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; margin-right: 5px; }
  .eq i { width: 3px; background: var(--pink); border-radius: 2px; animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: .2s } .eq i:nth-child(3) { animation-delay: .4s }
  .paused .eq i { animation-play-state: paused; }
  @keyframes eq { 0%,100% { height: 3px } 50% { height: 12px } }
  .btn { border: 0; border-radius: 99px; padding: 10px 18px; font-weight: 800; font-size: 14px; cursor: pointer; background: #fff; color: #111; display: inline-flex; gap: 6px; align-items: center; }
  .btn.ghost { background: rgba(255,255,255,.12); color: var(--ink); }
  .btn.pink { background: var(--pink); color: #2a0614; }
  .btn.sm { padding: 7px 13px; font-size: 12.5px; }

  /* 浮動膠囊（跟 App 新的底部分頁列同一個元件） */
  .lg { background: rgba(28,28,40,.55); backdrop-filter: blur(22px) saturate(190%); -webkit-backdrop-filter: blur(22px) saturate(190%);
    border: 1px solid rgba(255,255,255,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 10px 30px rgba(0,0,0,.5); }
  .tabbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 26px; height: 60px; border-radius: 30px; display: flex; padding: 4px; z-index: 50; }
  .tabbar .blob { position: absolute; top: 4px; bottom: 4px; width: 84px; border-radius: 26px; background: rgba(255,255,255,.14); transition: left .38s cubic-bezier(.3,1.35,.4,1); }
  .tabbar button { position: relative; width: 84px; border: 0; background: transparent; color: #fff; font-size: 10.5px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; }
  .tabbar button span { font-size: 20px; line-height: 1.1; }
  .tabbar button.on { color: var(--pink); }

  /* 迷你播放列 */
  .mini { position: absolute; left: 12px; right: 12px; bottom: 96px; height: 60px; border-radius: 16px; z-index: 55; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 7px; cursor: pointer; overflow: hidden; animation: rise .3s cubic-bezier(.2,.9,.3,1); }
  .mini .cover { width: 46px; height: 46px; border-radius: 9px; }
  .mini .pbar { position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
  .mini .pbar i { display: block; height: 100%; background: var(--pink); }
  .mini .ctl { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; }
  .mini .ctl:hover { background: rgba(255,255,255,.08); }

  /* 全螢幕播放器 */
  .player { position: absolute; inset: 0; z-index: 80; overflow-y: auto; padding: 44px 22px 40px; animation: up .32s cubic-bezier(.2,.9,.3,1); scrollbar-width: none; }
  .player::-webkit-scrollbar { display: none; }
  .player .bgimg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(46px) saturate(1.4) brightness(.45); transform: scale(1.2); z-index: -1; }
  .ytbox { border-radius: 16px; overflow: hidden; position: relative; aspect-ratio: 16/9; background: #000; box-shadow: 0 20px 50px rgba(0,0,0,.5); transition: all .35s; }
  .ytbox img { width: 100%; height: 100%; object-fit: cover; opacity: .92; }
  .ytbox .ytlogo { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 64px; height: 44px; border-radius: 12px; background: rgba(255,0,0,.92); display: grid; place-items: center; font-size: 20px; }
  .ytbox .lbl { position: absolute; left: 8px; bottom: 8px; font-size: 10px; background: rgba(0,0,0,.65); padding: 2px 7px; border-radius: 6px; }
  .ytbox.small { width: 110px; margin-left: auto; }
  .bigart { aspect-ratio: 1; border-radius: 20px; overflow: hidden; margin: 6px 14px 0; box-shadow: 0 26px 60px rgba(0,0,0,.55); }
  .bigart img { width: 100%; height: 100%; object-fit: cover; }
  .seg2 { display: flex; background: rgba(255,255,255,.1); border-radius: 10px; padding: 2px; margin: 0 auto 14px; width: max-content; }
  .seg2 button { border: 0; background: transparent; color: var(--ink2); font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
  .seg2 button.on { background: rgba(255,255,255,.2); color: #fff; }
  .prog { margin: 18px 0 4px; height: 5px; border-radius: 5px; background: rgba(255,255,255,.18); position: relative; cursor: pointer; }
  .prog i { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; border-radius: 5px; }
  .prog b { position: absolute; top: 50%; width: 13px; height: 13px; border-radius: 50%; background: #fff; transform: translate(-50%,-50%); }
  .ctls { display: flex; align-items: center; justify-content: space-between; margin: 12px 6px; }
  .ctls .c { width: 44px; height: 44px; display: grid; place-items: center; font-size: 22px; cursor: pointer; border-radius: 50%; color: var(--ink2); }
  .ctls .c.on { color: var(--pink); }
  .ctls .big { width: 70px; height: 70px; border-radius: 50%; background: #fff; color: #111; font-size: 28px; display: grid; place-items: center; cursor: pointer; }
  .limit { margin-top: 16px; padding: 11px 12px; border-radius: 14px; background: rgba(255,255,255,.07); font-size: 11.5px; color: var(--ink2); line-height: 1.6; }
  .limit b { color: var(--ink); }
  .ytlink { color: #FF7A7A; font-weight: 700; text-decoration: none; }

  /* 底部面板、提示 */
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 95; display: flex; align-items: flex-end; animation: fade .18s; }
  .sheet { width: 100%; background: var(--sheet); border-radius: 26px 26px 0 0; padding: 0 16px 34px; max-height: 80%; overflow-y: auto; animation: up .26s cubic-bezier(.2,.9,.3,1); }
  .handle { width: 40px; height: 5px; border-radius: 9px; background: rgba(255,255,255,.2); margin: 9px auto 10px; }
  .act { display: flex; gap: 14px; align-items: center; padding: 13px 4px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; }
  .act:last-child { border-bottom: 0; }
  .toast { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); z-index: 99; width: max-content; max-width: 86%; background: rgba(40,40,58,.96); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 9px 14px; font-size: 12.5px; animation: drop .22s; }
  @keyframes fade { from { opacity: 0 } }
  @keyframes up { from { transform: translateY(70px); opacity: .3 } }
  @keyframes rise { from { transform: translateY(16px); opacity: 0 } }
  @keyframes drop { from { transform: translate(-50%, -12px); opacity: 0 } }

  /* V1 快速選曲 */
  .qp { display: grid; grid-auto-flow: column; grid-template-rows: repeat(4, auto); grid-auto-columns: 86%; gap: 0 14px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; scroll-snap-type: x mandatory; }
  .qp::-webkit-scrollbar { display: none; }
  .qp .song { scroll-snap-align: start; }
  .search { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.08); border-radius: 12px; padding: 0 12px; height: 42px; }
  .search input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--ink); font: inherit; font-size: 15px; }

  /* V2 歌手頁 */
  .artgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 12px; }
  .art { text-align: center; cursor: pointer; position: relative; }
  .art .cover { width: 100%; }
  .art .nm { font-size: 12.5px; font-weight: 700; margin-top: 6px; }
  .newdot { position: absolute; top: 4px; right: 6px; background: var(--pink); color: #2a0614; font-size: 9.5px; font-weight: 900; padding: 1px 6px; border-radius: 99px; }
  .hero { margin: -44px -16px 0; height: 330px; position: relative; overflow: hidden; }
  .hero img { width: 100%; height: 100%; object-fit: cover; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 35%, #0E0E16); }
  .hero .hn { position: absolute; left: 18px; bottom: 16px; z-index: 2; }
  .hero .hn b { font-size: 34px; font-weight: 900; letter-spacing: -.5px; display: block; }
  .hero .back { position: absolute; left: 12px; top: 46px; z-index: 3; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.4); cursor: pointer; }

  /* V3 情境 */
  .mood { border-radius: 22px; padding: 16px; margin-bottom: 12px; cursor: pointer; position: relative; overflow: hidden; min-height: 132px; }
  .mood .t { font-size: 20px; font-weight: 900; }
  .mood .stack { position: absolute; right: 14px; bottom: 14px; display: flex; }
  .mood .stack .cover { width: 54px; height: 54px; border-radius: 10px; margin-left: -18px; border: 2px solid rgba(0,0,0,.25); box-shadow: 0 6px 14px rgba(0,0,0,.35); }

  /* V4 動態 */
  .post { margin-bottom: 18px; }
  .post .who { display: flex; gap: 9px; align-items: center; margin-bottom: 8px; }
  .post .who .cover { width: 34px; height: 34px; }
  .post .wide { border-radius: 16px; cursor: pointer; }
  .post .acts { display: flex; gap: 8px; margin-top: 9px; }
  .newbanner { border-radius: 18px; padding: 14px; background: linear-gradient(135deg, rgba(255,111,174,.25), rgba(126,166,255,.15)); border: 1px solid rgba(255,255,255,.1); margin-bottom: 14px; }

  /* V5 心情 */
  .moods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .md { border-radius: 20px; padding: 14px 8px; text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,.1); transition: transform .15s; }
  .md:active { transform: scale(.95); }
  .md .e { font-size: 30px; } .md .n { font-size: 13px; font-weight: 800; margin-top: 2px; }
  .md.on { outline: 2px solid #fff; }
  .card { position: relative; height: 420px; margin-top: 8px; }
  .card .c { position: absolute; inset: 0; border-radius: 26px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.5); transition: transform .35s, opacity .35s; }
  .card .c img { width: 100%; height: 100%; object-fit: cover; }
  .card .c::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0,0,0,.85)); }
  .card .c .ci { position: absolute; left: 18px; right: 18px; bottom: 18px; z-index: 2; }
  .card .c.back { transform: scale(.94) translateY(16px); opacity: .55; }
  .card .c.out-l { transform: translateX(-130%) rotate(-14deg); opacity: 0; }
  .card .c.out-r { transform: translateX(130%) rotate(14deg); opacity: 0; }
  .swipe { display: flex; justify-content: center; gap: 22px; margin-top: 16px; }
  .swipe .s { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; cursor: pointer; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); }
  .swipe .s.l { color: #FF7A7A; } .swipe .s.r { color: var(--pink); width: 70px; height: 70px; background: rgba(255,111,174,.15); }
  .modes { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .modes button { border: 1px solid var(--line); background: var(--card); color: var(--ink2); padding: 9px 16px; border-radius: 99px; cursor: pointer; font-size: 13.5px; font-weight: 700; }
  .modes button.on { border-color: var(--pink); color: #fff; background: rgba(255,111,174,.2); }
  .modes button.yt.on { border-color: var(--yt); background: rgba(255,59,59,.18); }
  .notes table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
  .notes td, .notes th { border-bottom: 1px solid var(--line); padding: 5px 4px; text-align: left; vertical-align: top; }
  .notes th { color: var(--ink); }
  .notes .layers { display: grid; gap: 6px; margin: 8px 0; }
  .notes .layers div { padding: 9px 11px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink); }
  .notes .layers small { display: block; color: var(--ink3); font-size: 11.5px; margin-top: 2px; }
  .ty { font-size: 9.5px; font-weight: 800; padding: 1px 6px; border-radius: 5px; margin-right: 4px; vertical-align: 1px; white-space: nowrap; }
  .ty-演唱 { background: rgba(255,255,255,.1); color: var(--ink2); } .ty-合唱 { background: rgba(126,166,255,.18); color: var(--accent); }
  .ty-翻唱 { background: rgba(176,124,255,.2); color: #C9A6FF; } .ty-Live { background: rgba(95,224,141,.15); color: var(--ok); }
  .ty-清唱 { background: rgba(245,199,99,.16); color: var(--mid); } .ty-其他 { background: rgba(255,255,255,.08); color: var(--ink3); }
  .gcov { display: grid; place-items: center; font-weight: 900; color: rgba(255,255,255,.88); font-size: 16px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 2px; }
  .seg span { padding: 6px 12px; border-radius: 99px; background: rgba(255,255,255,.08); font-size: 12.5px; cursor: pointer; }
  .seg span.on { background: #fff; color: #111; font-weight: 800; }
  .seg span.add { border: 1px dashed var(--ink3); background: none; color: var(--ink2); }
  .field { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.08); border-radius: 12px; padding: 0 12px; height: 42px; margin: 4px 0; }
  .field input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--ink); font: inherit; font-size: 14px; min-width: 0; }
  .lbl2 { font-size: 11.5px; color: var(--ink3); margin-top: 12px; font-weight: 700; }
  .hint { font-size: 11px; color: var(--ink3); margin-top: 3px; }
  .auto { font-size: 11.5px; padding: 8px 10px; border-radius: 10px; background: rgba(126,166,255,.1); border: 1px solid rgba(126,166,255,.25); margin: 8px 0 2px; }
  .vprev { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 14px; background: rgba(255,255,255,.05); }
  .vprev .cover { width: 96px; aspect-ratio: 16/9; border-radius: 8px; }
  .cand { display: flex; align-items: center; gap: 11px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .cand .cover { width: 72px; aspect-ratio: 16/9; border-radius: 6px; }
  .cand .meta { flex: 1; min-width: 0; } .cand .nm { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .addbtn { padding: 6px 12px; border-radius: 99px; background: var(--pink); color: #2a0614; font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap; }
  .inmusic { padding: 6px 10px; border-radius: 99px; background: rgba(95,224,141,.15); color: var(--ok); font-size: 11.5px; font-weight: 800; white-space: nowrap; }
  .fab { position: absolute; right: 18px; bottom: 170px; width: 52px; height: 52px; border-radius: 50%; background: var(--pink); color: #2a0614; font-size: 26px; display: grid; place-items: center; z-index: 56; cursor: pointer; box-shadow: 0 10px 26px rgba(255,111,174,.45); }
  .sec-sub { font-size: 11.5px; color: var(--ink3); margin: -6px 0 6px; }
  .work { display: flex; align-items: center; gap: 11px; padding: 8px 0; cursor: pointer; }
  .work .stack { width: 50px; height: 50px; position: relative; flex-shrink: 0; }

function guess(v) {
  const t = v.title, ch = YCH[v.ch] ? YCH[v.ch].name : v.ch;
  const named = Object.keys(A).filter(k => t.includes(A[k].name));
  let type = /翻唱|cover/i.test(t) ? '翻唱' : / x |feat|合唱/i.test(t) ? '合唱' : /清唱/.test(t) ? '清唱' : /live|演唱會|現場/i.test(t) ? 'Live' : /official|mv|music video/i.test(t) ? '演唱' : '其他';
  // 歌名：【】《》[ ] 裡面的字
  const m = t.match(/[【《\[]\s*([^】》\]]+?)\s*[】》\]]/); let name = m && !/翻唱/.test(m[1]) ? m[1] : t.replace(/【翻唱】|翻唱|cover.*$|-.*$|｜.*$/gi, '');
  name = name.replace(/Jay Chou|Accusefive|Official( Music)? (Video|MV)|Blue and White Porcelain|Nocturne/gi, '');
  Object.values(A).forEach(a => name = name.replace(a.name, '')); name = name.replace(/[x]/g, '').trim().split(/\s+/)[0];
  const work = Object.keys(W).find(w => W[w].t === name) || null;
  // 演唱者：上傳頻道本人（名字在標題裡）＋標題提到的；翻唱的原唱不算演唱者
  let by = named.slice();
  if (type === '翻唱') { const orig = work ? W[work].orig : named.slice(-1); by = by.filter(k => !orig.includes(k)); if (/小花/.test(t)) by.push('hana'); }
  if (!by.length && A[v.ch]) by = [v.ch];
  const newOrig = type === '翻唱' ? named.slice(-1) : by.slice(0, 1);
  const newNames = /告五人/.test(t + ch) && !Object.values(A).some(x => x.name === '告五人') ? ['告五人'] : [];
  const why = `${{ 翻唱: '標題有「翻唱／cover」', 合唱: '標題有「x／合唱」', 清唱: '標題有「清唱」', Live: '標題有「Live／演唱會」', 演唱: '標題有 Official MV', 其他: '看不出來' }[type]}；歌名「${name}」${work ? '已經在音樂裡 → 加成它的新版本' : '是新歌'}`;
  return { vid: v.id, v, work, name, type, by: [...new Set(by)], newNames, orig: work ? W[work].orig.slice() : newOrig, why };
}

      <div class="act" data-a="pasteUrl">🔗　貼網址加</div>`; }
  if (k === 'newArtist') return `<b style="font-size:17px">新增歌手</b><div class="lbl2">名字</div><div class="field"><input id="naName" placeholder="例如：告五人"></div>
    <div class="lbl2">頭像（選填）</div><div class="act" data-a="toast" data-m="（示意）從 YT 管理挑一個頻道，抄它的頭像">▶　用 YT 頻道的頭像</div><button class="btn pink" data-a="naSave" style="width:100%;justify-content:center;margin-top:12px">新增</button>`;
  if (k === 'verMenu') { const v = ver(S.sheet.id); return `<div class="row" style="margin-bottom:6px">${vcov(v, 'sq', 46)}<div><b>${esc(W[v.w].t)}</b><div class="note3">${tyb(v.type)}${esc(byNames(v))}</div></div></div>
    <div class="act" data-a="playNext" data-id="${v.id}">⤵︎　下一首播放</div><div class="act" data-a="like" data-id="${v.id}">${S.liked.has(v.id) ? '♥　取消喜歡' : '♡　喜歡'}</div><div class="act" data-a="addToList" data-id="${v.id}">≡＋ 加到歌單</div>
    <div class="act" data-a="work" data-w="${v.w}">🎵　看這首歌的所有版本（${versOfWork(v.w).length}）</div>${v.by.map(k => `<div class="act" data-a="artist" data-k="${k}">🎤　去 ${A[k].name}</div>`).join('')}
    <div class="act" data-a="sheet" data-k="edit" data-id="${v.id}">✎　版本資訊（哪首歌、哪一種、誰唱）</div><div class="act">↗　在 YouTube 開啟</div>`; }
  if (k === 'ytMenu') { const v = YV.find(x => x.id === S.sheet.id);
    return `<div class="note3" style="margin:2px 0 6px">${esc(v.title)}</div>${inMusic(v.id) ? `<div class="act" data-a="sheet" data-k="edit" data-id="${v.id}" style="color:var(--ok)">♪　已在音樂：${esc(W[ver(v.id).w].t)}（${ver(v.id).type}）・編輯</div>` : `<div class="act" data-a="startAdd" data-id="${v.id}" style="color:var(--pink)">♪　加進音樂</div>`}
      <div class="act">≡＋ 添加到播放清單</div><div class="act">🕘　開啟紀錄</div><div class="act">⊘　隱藏這部</div><div class="act">↗　在 YouTube 開啟</div>`; }
  if (k === 'artistMenu') { const a = A[S.sheet.ak]; return `<b>${a.name}</b><div class="act" data-a="toast" data-m="（示意）改名字、換頭像">✎　編輯歌手</div><div class="act" data-a="toast" data-m="（示意）把重複的歌手併成一個（例如 Jay Chou 跟 周杰倫）">⇆　跟另一個歌手合併</div>`; }
  if (k === 'workMenu') { const w = W[S.sheet.w]; return `<b>${esc(w.t)}</b><div class="act" data-a="toast" data-m="（示意）改歌名、改原唱、加別名（英文歌名）">✎　編輯歌曲（歌名、原唱、別名）</div><div class="act" data-a="toast" data-m="（示意）把重複的歌併成一首（例如「晴天」跟「晴天 Sunny Day」）">⇆　跟另一首合併</div>`; }
  return '';
}
function candRow(v) { const on = inMusic(v.id); return `<div class="cand">${vcov({ ...v, by: [] }, '')}<div class="meta"><div class="nm">${esc(v.title)}</div><div class="note3">「${YCH[v.ch].name}」・${v.y}・${fmt(v.len)}</div></div>${on ? '<span class="inmusic">已在音樂</span>' : `<span class="addbtn" data-a="startAdd" data-id="${v.id}">＋ 加</span>`}</div>`; }

// ════════ 畫面 ════════
const phone = document.getElementById('phone');
const TABS = [['⌂', '首頁'], ['⌕', '搜尋'], ['♫', '音樂庫']];
function paint(keep = true) {
  const sc = phone.querySelector('.screen'), y = sc && keep ? sc.scrollTop : 0;
  const ae = document.activeElement, kk = ae && phone.contains(ae) && ae.dataset.k, caret = kk ? ae.selectionStart : null;
  let body, chrome = '';
  if (S.mode === 'yt') body = ytPage();
  else {
    body = S.sub ? (S.sub.k === 'artist' ? artistPage(S.sub.a) : S.sub.k === 'work' ? workPage(S.sub.w) : listPage(S.sub.p)) : [home, search, library][S.tab]();
    chrome = `${mini()}${S.full || S.sub ? '' : '<div class="fab" data-a="sheet" data-k="add">＋</div>'}${S.full ? fullPlayer() : `<div class="tabbar lg" style="width:${TABS.length * 84 + 8}px"><div class="blob" style="left:${4 + S.tab * 84}px"></div>${TABS.map(([ic, n], i) => `<button class="${S.tab === i ? 'on' : ''}" data-a="tab" data-i="${i}"><span>${ic}</span>${n}</button>`).join('')}</div>`}`;
  }
  const glow = S.mode === 'yt' ? 'radial-gradient(120% 60% at 50% 0%, rgba(255,55,95,.18), transparent 70%)' : 'radial-gradient(120% 70% at 30% 0%, rgba(59,111,182,.45), transparent 70%)';
  phone.innerHTML = `<div class="bgglow" style="background:${glow}"></div><div class="status"><span>21:41</span><span>▮▮▮ ◔ 82%</span></div><div class="screen">${body}</div>${chrome}
    ${S.sheet ? `<div class="scrim" data-a="closeSheet"><div class="sheet" data-stop><div class="handle"></div>${sheetBody()}</div></div>` : ''}
    ${S.toast ? `<div class="toast">${S.toast.m}${S.toast.act ? `<span class="act2" data-a="${S.toast.act[0]}" data-w="${S.toast.act[1] || ''}">${S.toast.act[2]}</span>` : ''}</div>` : ''}<div class="home-ind"></div>`;
  phone.querySelector('.screen').scrollTop = y;
  if (kk) { const el = phone.querySelector(`[data-k="${kk}"]`); if (el && el.tagName === 'INPUT') { el.focus(); el.setSelectionRange(caret, caret); } }
}
function notes() {
  document.getElementById('notes').innerHTML = `<h2>${S.mode === 'mu' ? '② 音樂功能（主角）' : '① YT 管理（只是來源）'}</h2><span class="tag">最終版</span>
    <h3>資料三層（音樂自己存）</h3><div class="layers">
      <div>🎤 <b>歌手</b><small>名字、頭像。不一定要有 YT 頻道（例如翻唱的小花）。重複的可以合併。</small></div>
      <div>🎵 <b>歌曲</b><small>一首作品：歌名、原唱（可以好幾個）、別名。同一首歌所有人唱的版本都掛在它底下。</small></div>
      <div>▶ <b>版本</b><small>一部 YouTube 影片＝誰唱的哪一版：演唱／合唱／翻唱／Live／清唱／其他。<b>影片 id、標題、縮圖、長度、上傳頻道抄一份</b>，播放用影片 id。</small></div></div>
    <h3>兩種看法（音樂庫上面的分頁）</h3><table><tr><th></th><th>依歌手</th><th>依歌曲</th></tr>
      <tr><td>列表</td><td>每個歌手、他有幾個版本（演唱 3・翻唱 1…）</td><td>每首歌、幾個版本、原唱是誰</td></tr>
      <tr><td>點進去</td><td>他唱的全部版本，篩演唱／合唱／翻唱／Live／清唱；下面「他原唱的歌」</td><td>這首歌所有版本，照種類分段；「依序聽每個版本」「＋ 加版本」</td></tr></table>
    <h3>怎麼加（YT 管理只是來源）</h3><ul>
      <li><b>YT 管理</b>：影片往左滑第一顆「♪ 加進音樂」→ 跳「加進音樂」面板（自動判斷哪首歌、哪一種、誰唱）→ 按一下就抄進音樂。已經加過的縮圖標「♪ 在音樂」。</li>
      <li><b>音樂裡</b>：＋ → 從 YT 管理挑（選頻道 → 影片）、貼網址；歌曲頁「＋ 加版本」翻快取裡標題有這個歌名的；搜尋找不到也能直接加。</li>
      <li>加完就是音樂自己的：YT 那邊刪頻道、取消追蹤、換分類都不影響；音樂裡刪掉也不動 YT。</li></ul>
    <h3>跟上一版不同</h3><ul><li>上一版「♪ 歌曲」只是 YT 影片上的標記、音樂去 YT 讀；這版改成<b>音樂自己存</b>，YT 的 ♪ 只是「已在音樂」的提示。</li>
      <li>多了「<b>依歌曲</b>」：一首歌被很多人唱、cover，都收在同一首底下。</li><li>版本種類多「<b>清唱</b>」「<b>其他</b>」。</li></ul>
    <div class="try">試試看：<br>① 音樂庫 →「依歌曲」→《晴天》：演唱、翻唱、Live 三段 →「依序聽每個版本」<br>
      ② 「依歌手」→ 周杰倫：篩「合唱」「清唱」；拉到下面「他原唱的歌」→《安靜》看林俊傑的翻唱<br>
      ③ 切到「YT 管理」→ 小花翻唱 →「【翻唱】告白氣球」⋮ → 加進音樂（自動判斷：翻唱、告白氣球已存在）→ 回音樂看《告白氣球》多一版<br>
      ④ YT 管理 → 告五人 →「愛人錯過」加進音樂：新歌曲＋新歌手；再加五月天頻道的「五月天 x 告五人【愛人錯過】」→ 合唱<br>
      ⑤ 播放器：歌名可以點進歌曲頁，下面列「這首歌的其他版本」</div>`;
}
function drawModes() {
  document.getElementById('modes').innerHTML = `<button class="${S.mode === 'mu' ? 'on' : ''}" data-m="mu">② 音樂功能</button><button class="yt ${S.mode === 'yt' ? 'on' : ''}" data-m="yt">① YT 管理（來源）</button>`;
  document.querySelectorAll('#modes button').forEach(b => b.onclick = () => { S.mode = b.dataset.m; S.sheet = null; S.full = false; drawModes(); notes(); paint(false); });
}
phone.addEventListener('input', e => { if (e.target.dataset.k === 'search') { S.search = e.target.value; paint(); } });
phone.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.dataset.a === 'closeSheet' && e.target.closest('[data-stop]') && !e.target.closest('button')) return;
  e.stopPropagation();
  const a = el.dataset.a, id = el.dataset.id, d = el.dataset, listOf = x => (x || '').split(',').filter(Boolean);
  switch (a) {
    case 'tab': S.sub = null; S.tab = +d.i; paint(false); return;
    case 'lib': S.lib = d.l; S.tab = 2; S.sub = null; S.sheet = null; paint(false); return;
    case 'artist': S.mode = 'mu'; drawModes(); S.sub = { k: 'artist', a: d.k }; S.aFilter = '全部'; S.sheet = null; S.full = false; paint(false); return;
    case 'work': S.mode = 'mu'; drawModes(); S.sub = { k: 'work', w: d.w }; S.wFilter = '全部'; S.sheet = null; S.full = false; S.toast = null; paint(false); return;
    case 'list': S.sub = { k: 'list', p: d.p }; paint(false); return;
    case 'back': S.sub = null; paint(false); return;
    case 'aFilter': S.aFilter = d.f; break;
    case 'wFilter': S.wFilter = d.f; break;
    case 'quick': S.search = d.q; break;
    case 'play': play(id, listOf(d.list)); S.sheet = null; break;
    case 'playAll': { const l = listOf(d.list); if (!l.length) return; if (d.shuffle) S.shuffle = true; play(S.shuffle ? l[Math.floor(Math.random() * l.length)] : l[0], l); break; }
    case 'toggle': S.playing = !S.playing; break;
    case 'next': next(false); break;
    case 'prev': S.qi = Math.max(0, S.qi - 1); S.now = S.queue[S.qi]; S.pos = 0; break;
    case 'shuffle': S.shuffle = !S.shuffle; break;
    case 'repeat': S.repeat = (S.repeat + 1) % 3; break;
    case 'openFull': S.full = true; break;
    case 'closeFull': S.full = false; break;
    case 'video': S.video = d.v === '1'; break;
    case 'like': S.liked.has(id) ? S.liked.delete(id) : S.liked.add(id); S.sheet = null; break;
    case 'playNext': S.queue.splice(S.qi + 1, 0, id); if (!S.now) play(id); S.sheet = null; toast('下一首播放'); break;
    case 'addToList': S.lists[0].ids.push(id); S.sheet = null; toast('已加到「開車必聽」（示意）'); break;
    case 'newList': { const n = prompt('新歌單的名字'); if (n && n.trim()) S.lists.push({ id: 'p' + Date.now(), name: n.trim(), ids: [] }); S.sheet = null; break; }
    case 'verMenu': S.sheet = { k: 'verMenu', id }; break;
    case 'sheet': S.sheet = { k: d.k, id: id || undefined, c: d.c, w: d.w, ak: d.ak }; S.toast = null; break;
    case 'closeSheet': S.sheet = null; break;
    case 'toast': toast(d.m); break;
    case 'pasteUrl': S.draft = guess(YV.find(v => v.id === 'wf_cover')); S.sheet = { k: 'addVer' }; toast('🔗 讀到網址：告五人 翻唱 五月天【突然好想你】'); break;
    // YT 來源
    case 'ytCh': S.yt.ch = d.c; paint(false); return;
    case 'ytBack': S.yt.ch = null; paint(false); return;
    case 'ytMenu': S.sheet = { k: 'ytMenu', id }; break;
    case 'startAdd': S.draft = guess(YV.find(v => v.id === id)); S.sheet = { k: 'addVer' }; break;
    // 加進音樂面板
    case 'dWork': S.draft.work = d.w || null; if (d.w) S.draft.orig = W[d.w].orig.slice(); break;
    case 'dType': S.draft.type = d.t; break;
    case 'dBy': { const b = S.draft.by; S.draft.by = b.includes(d.k) ? b.filter(x => x !== d.k) : [...b, d.k]; break; }
    case 'dOrig': { const o = S.draft.orig; S.draft.orig = o.includes(d.k) ? o.filter(x => x !== d.k) : [...o, d.k]; break; }
    case 'dNew': S.draft.newNames = S.draft.newNames.filter(n => n !== d.n); break;
    case 'dAddName': { const n = prompt('新歌手的名字'); if (n && n.trim()) S.draft.newNames.push(n.trim()); break; }
    case 'dSave': {
      const dr = S.draft, v = dr.v;
      const newKeys = dr.newNames.map(n => { const k = 'a' + Math.random().toString(36).slice(2, 7); A[k] = { name: n, color: '#2F6FB0' }; return k; });
      let w = dr.work;
      if (!w) { w = 'w' + Math.random().toString(36).slice(2, 7); const nm = (document.getElementById('dName') || {}).value || dr.name; W[w] = { t: nm.trim() || dr.name, orig: dr.orig.length ? dr.orig : (newKeys.length ? newKeys : dr.by.slice(0, 1)) }; }
      V.push({ id: v.id, w, type: dr.type, by: [...dr.by, ...newKeys], up: YCH[v.ch] ? YCH[v.ch].name : v.ch, title: v.title, th: v.th, len: v.len, y: v.y });
      S.sheet = null; S.draft = null; toast(`♪ 已加進音樂：《${esc(W[w].t)}》${dr.type}（共 ${versOfWork(w).length} 個版本）`, ['work', w, '看這首 →']); break; }
    case 'naSave': { const n = (document.getElementById('naName') || {}).value; if (n && n.trim()) { A['a' + Date.now()] = { name: n.trim(), color: '#5A6B8C' }; toast('🎤 已新增歌手：' + esc(n.trim())); } S.sheet = null; break; }
    // 版本資訊
    case 'eType': ver(id).type = d.t; break;
    case 'eBy': { const v = ver(id); if (v.by.includes(d.k) && v.by.length === 1) { toast('至少要有一個人'); break; } v.by = v.by.includes(d.k) ? v.by.filter(x => x !== d.k) : [...v.by, d.k]; break; }
    case 'delVer': { const i = V.findIndex(v => v.id === id); const w = V[i].w; V.splice(i, 1); if (!versOfWork(w).length) delete W[w]; S.sheet = null; if (S.now === id) { S.now = null; S.playing = false; } if (S.sub && S.sub.k === 'work' && !W[S.sub.w]) S.sub = null; toast('已從音樂刪掉（YT 管理不動）'); break; }
  }
  paint();
});
drawModes(); notes(); paint(false);
</script>
