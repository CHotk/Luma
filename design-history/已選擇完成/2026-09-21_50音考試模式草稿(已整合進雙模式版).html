<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日文手寫考試模式</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #4A2036 0%, #2E2440 50%, #7A3F55 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #1B1420;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            border: 1px solid rgba(234, 146, 172, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .mode-badge {
            display: inline-block;
            background: #EA92AC;
            color: #241019;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 28px;
            color: #F3F2F8;
            margin-bottom: 8px;
        }

        .progress {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #A3A2B2;
            font-size: 14px;
        }

        /* 考試內容區 */
        .exam-content {
            background: rgba(234, 146, 172, 0.08);
            border-radius: 12px;
            padding: 40px 30px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid rgba(234, 146, 172, 0.15);
        }

        .question-prompt {
            color: #A3A2B2;
            font-size: 13px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 28px;
            color: #F3F2F8;
            margin-bottom: 8px;
            font-weight: 600;
        }

        /* 隱藏的字 */
        .hidden-character {
            font-size: 80px;
            font-weight: bold;
            color: transparent;
            text-shadow: 0 0 0 rgba(0, 0, 0, 0);
            margin: 20px 0;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(90deg, rgba(74, 32, 54, 0.4) 0%, rgba(107, 53, 80, 0.4) 50%, rgba(74, 32, 54, 0.4) 100%);
            border-radius: 8px;
            position: relative;
            border: 1px solid rgba(234, 146, 172, 0.2);
        }

        .hidden-indicator {
            color: #74738A;
            font-size: 14px;
            font-weight: normal;
        }

        /* 提示方式 */
        .hints-section {
            margin: 30px 0;
        }

        .hints-title {
            font-size: 12px;
            color: #74738A;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .hints-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .hint-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            border: 1px solid rgba(234, 146, 172, 0.3);
            background: rgba(234, 146, 172, 0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
            color: #A3A2B2;
        }

        .hint-btn:hover {
            border-color: #EA92AC;
            background: rgba(234, 146, 172, 0.15);
            color: #F3F2F8;
        }

        .hint-btn.active {
            border-color: #EA92AC;
            background: #EA92AC;
            color: #241019;
        }

        .hint-icon {
            font-size: 18px;
            margin-right: 6px;
        }

        /* 手寫區域 */
        .drawing-area {
            margin: 30px 0;
        }

        .canvas-container {
            border: 1px solid rgba(234, 146, 172, 0.3);
            border-radius: 8px;
            background: rgba(41, 35, 48, 0.6);
            overflow: hidden;
            margin-bottom: 12px;
            aspect-ratio: 1;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
        }

        .canvas-info {
            font-size: 12px;
            color: #74738A;
            text-align: center;
        }

        /* 按鈕組 */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-clear {
            background: rgba(234, 146, 172, 0.1);
            color: #A3A2B2;
            border: 1px solid rgba(234, 146, 172, 0.2);
        }

        .btn-clear:hover {
            background: rgba(234, 146, 172, 0.2);
            color: #F3F2F8;
        }

        .btn-submit {
            background: #EA92AC;
            color: #241019;
            grid-column: 1 / -1;
            font-size: 15px;
            padding: 14px;
        }

        .btn-submit:hover {
            background: #F5A5C1;
            box-shadow: 0 4px 12px rgba(234, 146, 172, 0.4);
        }

        /* 結果顯示 */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .result-card {
            background: #1B1420;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease;
            border: 1px solid rgba(234, 146, 172, 0.2);
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .result-icon {
            font-size: 60px;
            margin-bottom: 16px;
        }

        .result-icon.correct {
            color: #5FE08D;
        }

        .result-icon.incorrect {
            color: #FF938B;
        }

        .result-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #F3F2F8;
        }

        .result-message {
            color: #A3A2B2;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .result-comparison {
            background: rgba(74, 32, 54, 0.3);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            font-size: 36px;
            font-weight: bold;
            border: 1px solid rgba(234, 146, 172, 0.15);
            color: #F3F2F8;
        }

        .result-comparison-label {
            display: flex;
            justify-content: space-around;
            font-size: 12px;
            color: #74738A;
            gap: 20px;
            margin-top: 8px;
        }

        .btn-next {
            background: #EA92AC;
            color: #241019;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
        }

        .btn-next:hover {
            background: #F5A5C1;
        }

        .btn-reveal {
            background: rgba(234, 146, 172, 0.1);
            color: #A3A2B2;
            width: 100%;
            border: 1px solid rgba(234, 146, 172, 0.2);
        }

        .btn-reveal:hover {
            background: rgba(234, 146, 172, 0.2);
            color: #F3F2F8;
        }

        /* 隱藏 */
        .hidden {
            display: none;
        }

        /* 響應式 */
        @media (max-width: 480px) {
            .container {
                padding: 24px;
            }

            .exam-content {
                padding: 30px 20px;
            }

            .hidden-character {
                font-size: 60px;
                height: 80px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="mode-badge">🚨 考試模式</div>
            <h1>平假名 手寫試験</h1>
            <div class="progress">
                <span>問題 3 / 20</span>
                <span>•</span>
                <span>正解: 2</span>
            </div>
        </div>

        <div class="exam-content" id="examContent">
            <div class="question-prompt">下の音をひらがなで書いてください</div>

            <div style="display: flex; align-items: center; justify-content: center; gap: 16px; margin: 24px 0;">
                <button onclick="playAudio()" style="background: #EA92AC; color: #241019; border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;" onmouseover="this.style.background='#F5A5C1'" onmouseout="this.style.background='#EA92AC'">🔊</button>
                <div class="question-text">a</div>
            </div>

            <div class="drawing-area">
                <div class="canvas-container">
                    <canvas id="canvas"></canvas>
                </div>
                <div class="canvas-info">ここに書いてください • マウスとタッチに対応</div>
            </div>

            <div class="button-group">
                <button class="btn-clear" onclick="clearCanvas()">消す</button>
                <button class="btn-submit" onclick="submitAnswer()">採点する</button>
            </div>
        </div>
    </div>

    <!-- 結果彈窗 -->
    <div class="result-overlay hidden" id="resultOverlay">
        <div class="result-card" id="resultCard">
            <div class="result-icon correct" id="resultIcon">✓</div>
            <div class="result-title" id="resultTitle">完璧です！</div>
            <div class="result-message" id="resultMessage">筆の流れと正確さが完全に一致しました</div>

            <div class="result-comparison">
                <div style="margin-bottom: 8px; font-size: 18px; color: #A3A2B2;">比較</div>
                <div style="display: flex; justify-content: space-around; gap: 20px;">
                    <div style="text-align: center;">
                        <div style="font-size: 14px; color: #74738A; margin-bottom: 4px;">あなたの答え</div>
                        <div style="font-size: 48px; color: #F3F2F8;">あ</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 14px; color: #74738A; margin-bottom: 4px;">正解</div>
                        <div style="font-size: 48px; color: #EA92AC;">あ</div>
                    </div>
                </div>
            </div>

            <button class="btn-next" onclick="nextQuestion()">次の問題へ</button>
            <button class="btn-reveal" onclick="closeResult()">詳細を見る</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        // 設置 canvas 尺寸
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 繪圖功能
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // 觸控支援
        canvas.addEventListener('touchstart', handleTouch);
        canvas.addEventListener('touchmove', handleTouch);
        canvas.addEventListener('touchend', stopDrawing);

        function startDrawing(e) {
            isDrawing = true;
            draw(e);
        }

        function draw(e) {
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            ctx.fillStyle = '#2c3e50';
            ctx.beginPath();
            ctx.arc(x, y, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function handleTouch(e) {
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent(e.type === 'touchstart' ? 'mousedown' : 'mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function playAudio() {
            // 这里实际应该用Web Audio API播放声音
            // 现在暂时用alert演示
            const utterance = new SpeechSynthesisUtterance('a');
            utterance.lang = 'ja-JP';
            speechSynthesis.speak(utterance);
        }

        function submitAnswer() {
            document.getElementById('resultOverlay').classList.remove('hidden');
        }

        function nextQuestion() {
            clearCanvas();
            document.getElementById('resultOverlay').classList.add('hidden');
            alert('次の問題を読み込み中...');
        }

        function closeResult() {
            document.getElementById('resultOverlay').classList.add('hidden');
        }
    </script>
</body>
</html>
