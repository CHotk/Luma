<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首頁設計 3 問候與快速動作</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--accent:#7EA6FF;--yt:#FF2D40;--diary:#8FBF9F;--jp:#EA92AC;--fit:#F2A65A;--sync:#7ED6D0;--dbg:#B39DDB}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.tag{display:inline-block;background:var(--accent);color:#0c0c13;border-radius:99px;padding:2px 10px;font-size:11px;margin-top:8px}
.phone{width:380px;height:760px;margin:0 auto;border:8px solid #000;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.scroll>*{flex-shrink:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px;flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:12px;background:var(--panel);display:grid;place-items:center;font-size:16px}
.top b{font-size:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.sub{color:var(--sub);font-size:12px}
.note{max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
.nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding:8px 4px 12px;flex-shrink:0}
.nav div{flex:1;text-align:center;font-size:10px;color:var(--sub)}.nav div span{display:block;font-size:20px}.nav .on{color:var(--accent)}</style></head><body><div class="intro"><div class="eyebrow">HOME · 版本 3 / 5</div><h1>問候與快速動作</h1><p>大字問候＋最常做的「動作」而不是「功能」：寫今天日記、記一組訓練、背單字、看新影片。</p></div><div class="phone"><div class="top"><div class="icon-btn">☰</div><b></b><div class="icon-btn">⚙</div></div><div class="scroll"><div style="padding:8px 2px 4px"><div class="sub">晚安，這個時間適合…</div><div style="font-size:28px;font-weight:700;margin-top:4px">今天想做什麼？</div></div>
<div class="card" style="display:flex;align-items:center;gap:14px"><div style="width:44px;height:44px;border-radius:14px;background:var(--diary);display:grid;place-items:center;font-size:22px;color:#0c0c13">✍</div><div style="flex:1;font-size:15px">寫今天的日記</div><div class="sub">›</div></div><div class="card" style="display:flex;align-items:center;gap:14px"><div style="width:44px;height:44px;border-radius:14px;background:var(--fit);display:grid;place-items:center;font-size:22px;color:#0c0c13">🏋</div><div style="flex:1;font-size:15px">記錄一組訓練</div><div class="sub">›</div></div><div class="card" style="display:flex;align-items:center;gap:14px"><div style="width:44px;height:44px;border-radius:14px;background:var(--accent);display:grid;place-items:center;font-size:22px;color:#0c0c13">📖</div><div style="flex:1;font-size:15px">背 12 個單字</div><div class="sub">›</div></div><div class="card" style="display:flex;align-items:center;gap:14px"><div style="width:44px;height:44px;border-radius:14px;background:var(--jp);display:grid;place-items:center;font-size:22px;color:#0c0c13">あ</div><div style="flex:1;font-size:15px">練習平假名</div><div class="sub">›</div></div><div class="card" style="display:flex;align-items:center;gap:14px"><div style="width:44px;height:44px;border-radius:14px;background:var(--yt);display:grid;place-items:center;font-size:22px;color:#0c0c13">▶</div><div style="flex:1;font-size:15px">看訂閱新影片</div><div class="sub">›</div></div>
<div class="sub" style="text-align:center;padding-top:6px">全部功能請點左上 ☰</div></div></div><p class="note">優點：以動作為主，減少決策；可依時段換排序（早上背單字、晚上日記）。缺點：完整功能清單得靠側邊選單。</p></body></html>
