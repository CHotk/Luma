<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首頁設計 2 今日儀表板</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--accent:#7EA6FF;--yt:#FF2D40;--diary:#8FBF9F;--jp:#EA92AC;--fit:#F2A65A;--sync:#7ED6D0;--dbg:#B39DDB}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.tag{display:inline-block;background:var(--accent);color:#0c0c13;border-radius:99px;padding:2px 10px;font-size:11px;margin-top:8px}
.phone{width:380px;height:760px;margin:0 auto;border:8px solid #000;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.scroll>*{flex-shrink:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px;flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:12px;background:var(--panel);display:grid;place-items:center;font-size:16px}
.top b{font-size:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.sub{color:var(--sub);font-size:12px}
.note{max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
.nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding:8px 4px 12px;flex-shrink:0}
.nav div{flex:1;text-align:center;font-size:10px;color:var(--sub)}.nav div span{display:block;font-size:20px}.nav .on{color:var(--accent)}</style></head><body><div class="intro"><div class="eyebrow">HOME · 版本 2 / 5</div><h1>今日儀表板</h1><p>打開就看到今天各功能的狀態：待複習單字、日記有沒有寫、健身、YT 新影片。點卡片進入該功能。</p></div><div class="phone"><div class="top"><div class="icon-btn">☰</div><b>今天</b><div class="icon-btn">⚙</div></div><div class="scroll">
<div class="card" style="border-color:var(--accent)"><div class="sub">🇬🇧 英文</div><div style="font-size:22px;margin:4px 0">今日單字 12 個</div><div class="sub">已完成 5 / 12</div><div style="height:6px;background:var(--panel2);border-radius:9px;margin-top:8px"><div style="width:42%;height:100%;background:var(--accent);border-radius:9px"></div></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="card"><div class="sub">🇯🇵 日文</div><div style="font-size:18px;margin-top:4px">考試 3 次</div></div>
<div class="card"><div class="sub">📔 日記</div><div style="font-size:18px;margin-top:4px;color:var(--diary)">今天還沒寫</div></div>
<div class="card"><div class="sub">💪 健身</div><div style="font-size:18px;margin-top:4px">昨天練了胸</div></div>
<div class="card"><div class="sub">▶ YT</div><div style="font-size:18px;margin-top:4px;color:var(--yt)">8 支新影片</div></div></div>
<div class="card"><div class="sub">☁ 同步</div><div style="margin-top:4px;font-size:14px">10 分鐘前同步成功</div></div></div></div><p class="note">優點：一眼掌握全部。缺點：每個功能都要提供摘要資料，開發量最大。</p></body></html>
