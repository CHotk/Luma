<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>看盤頻率記錄 5 統計分析儀表</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--accent:#7EA6FF;--ok:#5FE08D;--warn:#F5C763;--bad:#FF938B;--btc:#F7931A}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.tag{display:inline-block;background:var(--accent);color:#0c0c13;border-radius:99px;padding:2px 10px;font-size:11px;margin-top:8px}
.phone{width:380px;height:760px;margin:0 auto;border:8px solid #000;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.scroll{flex:1;overflow:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.scroll>*{flex-shrink:0}
.top{display:flex;align-items:center;gap:8px;padding:18px 16px 10px;flex-shrink:0}
.top b{font-size:16px;flex:1}
.ib{width:32px;height:32px;border-radius:10px;background:var(--panel);display:grid;place-items:center;font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.sub{color:var(--sub);font-size:12px}
.big{font-size:44px;font-weight:700;line-height:1}
.btn{display:block;text-align:center;border-radius:14px;padding:14px;font-size:15px;font-weight:700;background:linear-gradient(180deg,#5b86e6,#2E6BFF);color:#fff}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:500}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.bar{height:8px;background:var(--panel2);border-radius:9px;overflow:hidden}
.note{max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin:2px}</style></head><body><div class="intro"><div class="eyebrow">看盤頻率 · 版本 5 / 5</div><h1>統計分析儀表</h1><p>偏「自我覺察」：近 7 天長條圖、一天中哪個時段最常看、平均間隔、觸發原因分布（焦慮／無聊／例行）。</p></div><div class="phone"><div class="top"><div class="ib">☰</div><b>看盤記錄</b><div class="ib">⚙</div></div><div class="scroll"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="card"><div class="sub">今天</div><div style="font-size:26px;font-weight:700;color:var(--warn)">4 次</div></div><div class="card"><div class="sub">平均間隔</div><div style="font-size:26px;font-weight:700">2.4 小時</div></div></div>
<div class="card"><div class="sub">近 7 天</div><div style="display:flex;gap:6px;align-items:flex-end;height:110px;margin-top:8px"><div style="flex:1;text-align:center"><div style="height:48px;background:var(--accent);border-radius:5px 5px 0 0;margin-top:48px"></div><div class="sub" style="margin-top:4px">一</div></div><div style="flex:1;text-align:center"><div style="height:32px;background:var(--accent);border-radius:5px 5px 0 0;margin-top:64px"></div><div class="sub" style="margin-top:4px">二</div></div><div style="flex:1;text-align:center"><div style="height:80px;background:var(--bad);border-radius:5px 5px 0 0;margin-top:16px"></div><div class="sub" style="margin-top:4px">三</div></div><div style="flex:1;text-align:center"><div style="height:16px;background:var(--accent);border-radius:5px 5px 0 0;margin-top:80px"></div><div class="sub" style="margin-top:4px">四</div></div><div style="flex:1;text-align:center"><div style="height:64px;background:var(--bad);border-radius:5px 5px 0 0;margin-top:32px"></div><div class="sub" style="margin-top:4px">五</div></div><div style="flex:1;text-align:center"><div style="height:32px;background:var(--accent);border-radius:5px 5px 0 0;margin-top:64px"></div><div class="sub" style="margin-top:4px">六</div></div><div style="flex:1;text-align:center"><div style="height:64px;background:var(--bad);border-radius:5px 5px 0 0;margin-top:32px"></div><div class="sub" style="margin-top:4px">日</div></div></div></div>
<div class="card"><div class="sub" style="margin-bottom:8px">最常看的時段</div><div style="font-size:12px;margin-top:8px">深夜 22–24</div><div class="bar" style="margin-top:4px"><div style="width:70%;height:100%;background:var(--bad)"></div></div><div style="font-size:12px;margin-top:8px">午休 12–14</div><div class="bar" style="margin-top:4px"><div style="width:45%;height:100%;background:var(--warn)"></div></div><div style="font-size:12px;margin-top:8px">早上 8–10</div><div class="bar" style="margin-top:4px"><div style="width:25%;height:100%;background:var(--accent)"></div></div></div>
<div class="card"><div class="sub">為什麼看？</div><div style="margin-top:8px;font-size:13px">焦慮 45%・無聊 30%・例行 25%</div></div><div class="btn">👀 我剛看了價格</div></div></div><p class="note">優點：看得出行為模式（例如深夜最容易失控），最能幫助改變習慣。缺點：資料要累積幾天才有意義，畫面較複雜。</p></body></html>
