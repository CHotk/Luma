<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>碼錶 5 極簡全螢幕巨數字式</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--acc:#4FD1C5;--accInk:#032824;--bad:#FF938B}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--acc);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.phone{width:380px;height:760px;margin:0 auto;border:8px solid #000;border-radius:38px;background:#000;overflow:hidden;display:flex;flex-direction:column}
.zone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.zone.top{background:rgba(79,209,197,.08)}
.zone.bottom{background:rgba(255,147,139,.06);border-top:1px solid #1a1a1a}
.disp{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--acc)}
.disp2{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums}
.lbl{color:var(--sub);font-size:12px;margin-top:8px;letter-spacing:.1em}
.hint{position:absolute;bottom:14px;font-size:10.5px;color:#4a4a55}
.laplist{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center;gap:10px;font-size:10px;color:var(--sub)}
</style></head><body><div class="intro"><div class="eyebrow">碼錶 · 版本 5 / 5</div><h1>極簡全螢幕巨數字式</h1><p>沒有按鈕文字、沒有清單卡片，整個螢幕分成上下兩區：上半是巨大數字顯示，點一下整個上半區＝分圈；下半區點一下＝停止。專為運動中一瞥、大拇指盲按設計。</p></div><div class="phone">
<div class="zone top"><div class="laplist">圈4 09.4・圈3 11.1・圈2 08.2</div><div class="disp">00:42.18</div><div class="lbl">點此區記錄分圈</div></div>
<div class="zone bottom"><div class="disp2" style="color:var(--bad)">✕</div><div class="lbl">點此區停止計時</div><div class="hint">長按重新開始</div></div>
</div><p class="note" style="max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center">優點：畫面極簡到跑步/騎車時餘光一瞥就懂，整個上/下半區都是熱區，不用瞄準小按鈕。缺點：沒有文字標籤，第一次用需要有人講解「上面分圈、下面停止」，不是每個人一看就懂的慣例。</p></body></html>
