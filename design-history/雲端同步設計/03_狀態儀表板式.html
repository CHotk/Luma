<!doctype html>
<title>雲端同步03・狀態儀表板式</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" />
<style>
  :root { color-scheme: dark; --bg:#0c0c13; --bg-deep:#0a0a10; --ink:#f3f2f8; --ink2:#a3a2b2; --ink3:#74738a;
    --glass-edge: rgba(255,255,255,0.14); --glass-fill: rgba(255,255,255,0.045); --accent:#7ea6ff; --ok:#5fe08d; --mid:#f5c763; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg-deep); color: var(--ink); font-family: "Noto Sans TC", system-ui, sans-serif; }
  body { padding: 32px 20px 48px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .intro { max-width: 460px; text-align: center; }
  .eyebrow { font-size: 11.5px; letter-spacing: 0.18em; color: #8b8690; text-transform: uppercase; }
  .intro h1 { font-weight: 800; font-size: 21px; margin: 6px 0 8px; }
  .intro p { margin: 0 auto; font-size: 13px; line-height: 1.7; color: #a9a4ad; max-width: 46ch; }
  .phone { position: relative; width: 100%; max-width: 380px; min-height: 760px; flex-shrink: 0; border-radius: 40px; padding: 12px; isolation: isolate; overflow: hidden;
    background: radial-gradient(120% 100% at 50% -10%, #131019 0%, var(--bg) 45%, var(--bg-deep) 100%);
    box-shadow: 0 40px 90px -30px rgba(0,0,0,0.75), inset 0 0 0 1px rgba(255,255,255,0.04); }
  .amb { position: absolute; border-radius: 50%; filter: blur(72px); opacity: 0.4; z-index: -1; }
  .amb-1 { width: 230px; height: 230px; top: -80px; left: -60px; background: #1a1a33; }
  .amb-2 { width: 220px; height: 220px; bottom: 60px; right: -80px; background: #201d1a; }
  .shell { position: relative; min-height: 100%; border-radius: 30px; padding: 20px 17px;
    background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.022) 100%);
    backdrop-filter: blur(22px); border: 1px solid var(--glass-edge);
    display: flex; flex-direction: column; gap: 12px; }
  .topbar { display: flex; align-items: center; gap: 10px; }
  .icon-btn { width: 32px; height: 32px; border-radius: 11px; border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.03); display: flex; align-items: center; justify-content: center; color: var(--ink2); font-size: 15px; }
  .topbar-title { font-weight: 800; font-size: 16.5px; flex: 1; }
  .panel-label { font-size: 10px; letter-spacing: 1.2px; color: var(--ink2); font-weight: 500; }
  .all-btn { padding: 11px; border-radius: 14px; background: var(--accent); color: #0a0f1f; font-size: 12.5px; font-weight: 800; text-align: center; }
  .feat-list { display: flex; flex-direction: column; gap: 6px; }
  .feat-row { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-radius: 13px; background: var(--glass-fill); border: 1px solid var(--glass-edge); }
  .feat-row .ic { font-size: 15px; }
  .feat-row .name { flex: 1; font-size: 12.5px; font-weight: 600; }
  .feat-row .st { font-size: 10.5px; display: flex; align-items: center; gap: 4px; }
  .feat-row .dot { width: 6px; height: 6px; border-radius: 50%; }
  .feat-row.done .st { color: var(--ok); }
  .feat-row.done .dot { background: var(--ok); }
  .feat-row.pending .st { color: var(--mid); }
  .feat-row.pending .dot { background: var(--mid); }
  .feat-row.off .st { color: var(--ink3); }
  .feat-row.off .dot { background: var(--ink3); }
</style>

<div class="intro">
  <p class="eyebrow">Lume · 雲端同步 03（Mock・狀態儀表板式）</p>
  <h1>每個功能各自的同步狀態</h1>
  <p>最上面一顆「全部同步」，下面列出每個功能各自的狀態（已同步／待同步／尚未支援），單獨點某一列可以只同步那個功能。適合階段性開發的現況——先只有日記做完，其他都標「尚未支援」，之後每做完一個功能狀態就會多亮一個，使用者清楚看得到進度，不會誤以為「全部都同步了」。</p>
</div>

<div class="phone">
  <div class="amb amb-1"></div>
  <div class="amb amb-2"></div>
  <div class="shell">
    <div class="topbar">
      <div class="icon-btn">←</div>
      <div class="topbar-title">設定</div>
    </div>
    <div class="panel-label">多裝置同步</div>
    <div class="all-btn">全部同步</div>
    <div class="feat-list">
      <div class="feat-row done"><span class="ic">📖</span><span class="name">日記</span><span class="st"><span class="dot"></span>3 分鐘前</span></div>
      <div class="feat-row off"><span class="ic">🏋️</span><span class="name">健身打卡</span><span class="st"><span class="dot"></span>尚未支援</span></div>
      <div class="feat-row off"><span class="ic">📺</span><span class="name">YT 頻道追蹤</span><span class="st"><span class="dot"></span>尚未支援</span></div>
      <div class="feat-row off"><span class="ic">📚</span><span class="name">單字紀錄</span><span class="st"><span class="dot"></span>尚未支援</span></div>
    </div>
  </div>
</div>
