<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鬧鐘 1 經典清單開關</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--ok:#5FE08D;--bad:#FF938B;--acc:#FFA959;--accInk:#2b1600}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--acc);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.tag{display:inline-block;background:var(--acc);color:var(--accInk);border-radius:99px;padding:2px 10px;font-size:11px;margin-top:8px}
.phone{width:380px;height:760px;margin:0 auto;border:8px solid #000;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;gap:8px;padding:18px 16px 10px;flex-shrink:0}
.top b{font-size:18px;flex:1}
.ib{width:32px;height:32px;border-radius:10px;background:var(--panel);display:grid;place-items:center;font-size:15px}
.scroll{flex:1;overflow:auto;padding:6px 16px 16px;display:flex;flex-direction:column;gap:10px}
.scroll>*{flex-shrink:0}
.item{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:16px;padding:14px 16px}
.item .time{font-size:28px;font-weight:800}
.item.off{opacity:.4}
.item .mid{flex:1}
.item .lbl{font-size:12.5px;color:var(--sub)}
.item .days{display:flex;gap:5px;margin-top:4px}
.item .days span{font-size:9.5px;color:var(--sub);width:15px;height:15px;border-radius:50%;display:grid;place-items:center}
.item .days span.on{background:var(--acc);color:var(--accInk);font-weight:700}
.sw{width:44px;height:26px;border-radius:99px;background:var(--panel2);position:relative;flex-shrink:0}
.sw.on{background:var(--acc)}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.sw.on i{left:21px}
.fab{position:absolute;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--accInk);display:grid;place-items:center;font-size:24px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.note{max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
</style></head><body><div class="intro"><div class="eyebrow">鬧鐘 · 版本 1 / 5</div><h1>經典清單開關</h1><p>時間由大到小排列成清單，右側一顆開關切換啟用/停用，副標顯示重複星期跟標籤——iOS/Android 內建鬧鐘 App 的標準做法，幾乎不用學就會用。</p><span class="tag">主流慣例：iOS / Android 內建鬧鐘</span></div><div class="phone"><div class="top"><b>鬧鐘</b><div class="ib">✎</div></div><div class="scroll">
<div class="item"><div class="time">07:00</div><div class="mid"><div class="lbl">上班日</div><div class="days"><span class="on">一</span><span class="on">二</span><span class="on">三</span><span class="on">四</span><span class="on">五</span><span>六</span><span>日</span></div></div><div class="sw on"><i></i></div></div>
<div class="item off"><div class="time">09:30</div><div class="mid"><div class="lbl">補眠</div><div class="days"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="on">六</span><span class="on">日</span></div></div><div class="sw"><i></i></div></div>
<div class="item"><div class="time">22:30</div><div class="mid"><div class="lbl">睡前吃藥提醒</div><div class="days"><span class="on">一</span><span class="on">二</span><span class="on">三</span><span class="on">四</span><span class="on">五</span><span class="on">六</span><span class="on">日</span></div></div><div class="sw on"><i></i></div></div>
</div></div><div class="fab">＋</div><p class="note">優點：零學習成本，重複星期/開關狀態一目了然。缺點：鬧鐘多了以後全部長得一樣，要靠標籤文字才分得出用途，視覺上沒有分類感。</p></body></html>
