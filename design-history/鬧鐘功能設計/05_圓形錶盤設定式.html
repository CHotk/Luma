<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鬧鐘 5 圓形錶盤設定式</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--acc:#FFA959;--accInk:#2b1600}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--acc);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.phone{width:380px;height:760px;margin:0 auto;border:8px solid #000;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:18px 16px 6px;flex-shrink:0}
.top b{font-size:16px;flex:1}
.ib{width:32px;height:32px;border-radius:10px;background:var(--panel);display:grid;place-items:center;font-size:15px}
.dialwrap{display:flex;justify-content:center;padding:14px 0 8px;flex-shrink:0}
.dial{width:230px;height:230px;border-radius:50%;background:conic-gradient(var(--panel2) 0deg,var(--panel2) 360deg);position:relative}
.dial .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--acc) 0deg 105deg,transparent 105deg 142deg,var(--acc) 142deg 172deg,transparent 172deg 360deg);-webkit-mask:radial-gradient(circle,transparent 78px,#000 79px);mask:radial-gradient(circle,transparent 78px,#000 79px)}
.dial .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .center .now{font-size:13px;color:var(--sub)}
.dial .center .cnt{font-size:22px;font-weight:800;margin-top:2px}
.dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--bg)}
.scroll{flex:1;overflow:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:8px}
.scroll>*{flex-shrink:0}
.item{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:13px;padding:10px 13px}
.dotlg{width:8px;height:8px;border-radius:50%;background:var(--acc);flex-shrink:0}
.item b{font-size:14px}
.item span{color:var(--sub);font-size:11px;margin-left:auto}
.fab{position:relative;margin:0 auto -26px;width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--accInk);display:grid;place-items:center;font-size:24px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.4);z-index:2}
.note{max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
</style></head><body><div class="intro"><div class="eyebrow">鬧鐘 · 版本 5 / 5</div><h1>圓形錶盤設定式</h1><p>把一天 24 小時畫成一圈錶盤，每顆鬧鐘是圓周上的一個弧段/點，視覺上直接呈現「一天當中鬧鐘分布在哪些時段」，下方才是文字清單——參考傳統類比時鐘＋現代健康 App 睡眠時段圖的混合概念。</p></div><div class="phone"><div class="top"><div class="ib">☰</div><b>今天的鬧鐘</b><div class="ib">✎</div></div>
<div class="dialwrap"><div class="dial"><div class="ring"></div><div class="dot" style="top:10px;left:112px"></div><div class="dot" style="top:70px;left:200px"></div><div class="dot" style="top:180px;left:40px"></div><div class="center"><div class="now">現在</div><div class="cnt">14:32</div></div></div></div>
<div class="scroll">
<div class="item"><div class="dotlg"></div><b>07:00</b><span>上班日</span></div>
<div class="item"><div class="dotlg" style="background:var(--sub)"></div><b>09:30</b><span>補眠・已關閉</span></div>
<div class="item"><div class="dotlg"></div><b>22:30</b><span>睡前吃藥提醒</span></div>
</div></div><p class="note">優點：視覺上很有特色，能直接感受一天鬧鐘分布是否太密集。缺點：錶盤本身無法直接編輯（時間太密集點很難分辨），實際新增/修改鬧鐘還是得靠下面清單或另開設定頁，錶盤偏向裝飾/總覽用途。</p></body></html>
