<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提醒 1 待辦清單分組</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--ok:#5FE08D;--bad:#FF938B;--acc:#B592FF;--accInk:#1c0f30}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--acc);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.tag{display:inline-block;background:var(--acc);color:var(--accInk);border-radius:99px;padding:2px 10px;font-size:11px;margin-top:8px}
.phone{width:380px;height:760px;margin:0 auto;border:8px solid #000;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;position:relative}
.top{padding:20px 18px 10px;flex-shrink:0}
.top b{font-size:22px;font-weight:800;display:block}
.cards{display:flex;gap:10px;padding:6px 18px 12px;flex-shrink:0}
.mc{flex:1;background:var(--panel);border-radius:14px;padding:11px}
.mc .n{font-size:22px;font-weight:800}
.mc .l{font-size:11px;color:var(--sub);margin-top:2px}
.mc.today .n{color:var(--acc)}
.scroll{flex:1;overflow:auto;padding:0 18px 18px;display:flex;flex-direction:column;gap:16px}
.scroll>*{flex-shrink:0}
.grp .h{font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:8px}
.item{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line)}
.circ{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex-shrink:0}
.circ.p{border-color:var(--bad)}
.item b{font-size:13.5px;display:block}
.item span{color:var(--sub);font-size:11px}
.item.done b{text-decoration:line-through;color:var(--sub)}
.item.done .circ{background:var(--ok);border-color:var(--ok)}
.fab{position:absolute;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--accInk);display:grid;place-items:center;font-size:24px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.note{max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
</style></head><body><div class="intro"><div class="eyebrow">提醒 · 版本 1 / 5</div><h1>待辦清單分組</h1><p>頂部「今天／已排程／全部」計數卡快速切換範圍，下面依日期分組列出待辦，打勾即完成——蘋果「提醒事項」App 的經典版型，功能單純好上手。</p><span class="tag">主流慣例：Apple 提醒事項</span></div><div class="phone"><div class="top"><b>提醒事項</b></div>
<div class="cards">
<div class="mc today"><div class="n">3</div><div class="l">今天</div></div>
<div class="mc"><div class="n">7</div><div class="l">已排程</div></div>
<div class="mc"><div class="n">15</div><div class="l">全部</div></div>
</div>
<div class="scroll">
<div class="grp"><div class="h">今天</div>
<div class="item"><div class="circ p"></div><div><b>繳信用卡帳單</b><span>18:00 截止</span></div></div>
<div class="item"><div class="circ"></div><div><b>回覆房東訊息</b></div></div>
<div class="item done"><div class="circ"></div><div><b>倒垃圾</b></div></div>
</div>
<div class="grp"><div class="h">明天</div>
<div class="item"><div class="circ"></div><div><b>領取包裹</b><span>超商店到店</span></div></div>
</div>
<div class="grp"><div class="h">之後</div>
<div class="item"><div class="circ"></div><div><b>續辦駕照</b><span>10/15 前</span></div></div>
</div>
</div></div><div class="fab">＋</div></div><p class="note">優點：大家用過蘋果提醒事項或類似 App，零學習成本。缺點：純文字清單，事項一多容易變成長長的一串，找特定一件事要慢慢往下滑。</p></body></html>
