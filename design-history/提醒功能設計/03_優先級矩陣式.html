<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提醒 3 優先級矩陣式</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--acc:#B592FF;--accInk:#1c0f30;--bad:#FF938B;--warn:#F5C763;--ok:#5FE08D}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--acc);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.phone{width:380px;height:760px;margin:0 auto;border:8px solid #000;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;position:relative}
.top{padding:18px 18px 10px;flex-shrink:0}
.top b{font-size:18px}
.scroll{flex:1;overflow:auto;padding:6px 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quad{background:var(--panel);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:160px}
.quad .h{font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;margin-bottom:2px}
.quad .h i{width:6px;height:6px;border-radius:50%}
.mini{background:var(--panel2);border-radius:9px;padding:6px 8px;font-size:11px}
.mini b{display:block;font-size:11.5px}
.note{max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
</style></head><body><div class="intro"><div class="eyebrow">提醒 · 版本 3 / 5</div><h1>優先級矩陣式</h1><p>經典「重要／緊急」四象限（艾森豪矩陣），新增待辦時要先決定丟進哪一格，畫面上就直接看出「哪些事該現在做、哪些可以再等」，給重視時間管理方法論的人用。</p></div><div class="phone"><div class="top"><b>優先事項矩陣</b></div><div class="scroll">
<div class="quad"><div class="h"><i style="background:var(--bad)"></i>緊急且重要</div>
<div class="mini"><b>繳信用卡帳單</b>今天 18:00</div>
<div class="mini"><b>回覆房東訊息</b></div>
</div>
<div class="quad"><div class="h"><i style="background:var(--acc)"></i>重要不緊急</div>
<div class="mini"><b>續辦駕照</b>10/15 前</div>
<div class="mini"><b>整理衣櫃</b></div>
</div>
<div class="quad"><div class="h"><i style="background:var(--warn)"></i>緊急不重要</div>
<div class="mini"><b>領取包裹</b></div>
</div>
<div class="quad"><div class="h"><i style="background:var(--ok)"></i>不緊急不重要</div>
<div class="mini"><b>倒垃圾</b></div>
<div class="mini"><b>澆花</b></div>
</div>
</div></div><p class="note">優點：強迫自己每件事都先判斷輕重緩急，避免瞎忙緊急但不重要的雜事。缺點：每次新增待辦都要多想一步「這算哪一格」，對只想快速記一筆的人來說門檻偏高，格子小待辦多時容易擠不下。</p></body></html>
