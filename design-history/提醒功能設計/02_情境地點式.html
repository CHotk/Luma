<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提醒 2 情境地點式</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--acc:#B592FF;--accInk:#1c0f30}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--acc);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.phone{width:380px;height:760px;margin:0 auto;border:8px solid #000;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;gap:8px;padding:18px 16px 10px;flex-shrink:0}
.top b{font-size:16px;flex:1}
.ib{width:32px;height:32px;border-radius:10px;background:var(--panel);display:grid;place-items:center;font-size:15px}
.scroll{flex:1;overflow:auto;padding:6px 16px 16px;display:flex;flex-direction:column;gap:16px}
.scroll>*{flex-shrink:0}
.grp .h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:8px}
.grp .h .ic{width:26px;height:26px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;font-size:13px}
.item{display:flex;align-items:center;gap:11px;background:var(--panel);border-radius:13px;padding:11px 13px;margin-bottom:6px}
.circ{width:19px;height:19px;border-radius:50%;border:2px solid var(--line);flex-shrink:0}
.item b{font-size:13px;display:block}
.item span{color:var(--sub);font-size:10.5px}
.note{max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
</style></head><body><div class="intro"><div class="eyebrow">提醒 · 版本 2 / 5</div><h1>情境地點式</h1><p>提醒不是按日期分組，而是按「什麼情境該做」分組——到家、到公司、出門前、週末——參考 Apple 提醒事項的「地點提醒」概念延伸，適合很多待辦其實跟時間無關、只跟場合有關的人。</p></div><div class="phone"><div class="top"><div class="ib">☰</div><b>依情境分類</b><div class="ib">✎</div></div><div class="scroll">
<div class="grp"><div class="h"><div class="ic">🚪</div>出門前</div>
<div class="item"><div class="circ"></div><div><b>帶雨傘</b><span>今天有雨</span></div></div>
<div class="item"><div class="circ"></div><div><b>帶健保卡</b></div></div>
</div>
<div class="grp"><div class="h"><div class="ic">🏠</div>到家後</div>
<div class="item"><div class="circ"></div><div><b>倒垃圾</b></div></div>
<div class="item"><div class="circ"></div><div><b>澆花</b></div></div>
</div>
<div class="grp"><div class="h"><div class="ic">🏢</div>到公司</div>
<div class="item"><div class="circ"></div><div><b>印出合約</b></div></div>
</div>
<div class="grp"><div class="h"><div class="ic">🗓️</div>週末</div>
<div class="item"><div class="circ"></div><div><b>整理衣櫃</b></div></div>
<div class="item"><div class="circ"></div><div><b>續辦駕照</b></div></div>
</div>
</div></div><p class="note">優點：很多「沒有明確截止日」但重要的小事有地方安放，不會被時間排序的清單淹沒。缺點：需要先想好情境分類，事情性質模糊時（到底算出門前還是到家後）會猶豫該放哪一類。</p></body></html>
