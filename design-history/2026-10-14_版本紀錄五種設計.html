<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>版本紀錄設計</title>
<style>
  :root {
    --bg: #0C0C13; --card: #151520; --card2: #1A1A27; --sheet: #1C1C29; --line: #2A2A3D;
    --ink: #F3F2F8; --ink2: #A3A2B2; --ink3: #74738A;
    --accent: #7EA6FF; --ios: #0A84FF; --new: #5FE08D; --imp: #7EA6FF; --fix: #F5C763; --del: #FF7A7A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); min-height: 100vh; font: 14px/1.5 -apple-system, "SF Pro Text", system-ui, "Segoe UI", "Microsoft JhengHei", sans-serif; }
  .page { max-width: 1140px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .lead { color: var(--ink2); font-size: 13px; margin: 0 0 14px; } .lead b { color: var(--ink); }
  .vtabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .vtabs button { border: 1px solid var(--line); background: var(--card); color: var(--ink2); padding: 8px 14px; border-radius: 99px; cursor: pointer; font-size: 13px; }
  .vtabs button.on { border-color: var(--accent); color: #fff; background: rgba(46,107,255,.35); }
  .stage { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .notes { flex: 1 1 320px; max-width: 470px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; font-size: 13.5px; color: var(--ink2); }
  .notes h2 { color: var(--ink); font-size: 17px; margin: 0 0 4px; }
  .notes .tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px; background: rgba(126,166,255,.15); color: var(--accent); margin-bottom: 8px; }
  .notes h3 { color: var(--ink); font-size: 13.5px; margin: 14px 0 4px; }
  .notes ul { margin: 0; padding-left: 18px; } .notes li { margin: 3px 0; }
  .notes .box { margin-top: 14px; padding: 11px 13px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); font-size: 12.5px; }
  .notes .box b { color: var(--ink); }
  .notes .try { margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: rgba(126,166,255,.08); border: 1px solid rgba(126,166,255,.25); color: var(--ink); font-size: 12.5px; }
  .notes button.demo { margin-top: 8px; border: 1px solid var(--line); background: var(--card2); color: var(--ink); border-radius: 10px; padding: 6px 10px; cursor: pointer; font-size: 12px; }

  .phone { width: 390px; max-width: 100%; height: 820px; flex-shrink: 0; border-radius: 44px; border: 1px solid var(--line);
    background: radial-gradient(120% 55% at 20% 0%, #1f2440 0%, #0e0e17 60%); position: relative; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .screen { position: absolute; inset: 0; overflow-y: auto; padding: 46px 16px 40px; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  .status { position: absolute; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; font-size: 13px; font-weight: 700; z-index: 30; pointer-events: none; }
  .home-ind { position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%); width: 124px; height: 5px; border-radius: 9px; background: rgba(255,255,255,.55); z-index: 90; pointer-events: none; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 2px 0 12px; }
  .bar .t { flex: 1; font-weight: 800; font-size: 18px; }
  .ib { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: var(--ink2); cursor: pointer; flex-shrink: 0; font-size: 17px; }
  .ib:hover { background: rgba(255,255,255,.06); }
  .note { font-size: 12px; color: var(--ink2); } .note3 { font-size: 11px; color: var(--ink3); }
  .row { display: flex; align-items: center; gap: 8px; } .sp { flex: 1; }
  .glass { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 18px; padding: 14px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { border: 1px solid var(--line); color: var(--ink2); border-radius: 99px; padding: 5px 11px; font-size: 12px; cursor: pointer; background: transparent; white-space: nowrap; }
  .chip.on { background: rgba(46,107,255,.35); border-color: var(--accent); color: #fff; }
  .ty { font-size: 10.5px; font-weight: 800; padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
  .ty.new { background: rgba(95,224,141,.15); color: var(--new); } .ty.imp { background: rgba(126,166,255,.15); color: var(--imp); }
  .ty.fix { background: rgba(245,199,99,.15); color: var(--fix); } .ty.del { background: rgba(255,122,122,.15); color: var(--del); }
  .ft { font-size: 10.5px; padding: 1px 7px; border-radius: 6px; background: rgba(255,255,255,.07); color: var(--ink2); white-space: nowrap; }
  .item { display: flex; gap: 9px; align-items: flex-start; padding: 7px 0; cursor: pointer; }
  .item .tx { flex: 1; font-size: 13.5px; line-height: 1.45; }
  .item:hover .tx { color: #fff; }
  .btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 800; font-size: 14px; cursor: pointer; background: var(--ios); color: #fff; }
  .btn.ghost { background: rgba(255,255,255,.1); color: var(--ink); }
  .link { color: var(--ios); cursor: pointer; font-size: 13px; font-weight: 600; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 70; display: flex; align-items: flex-end; animation: fade .18s; }
  .sheet { width: 100%; background: var(--sheet); border-radius: 26px 26px 0 0; padding: 0 18px 34px; max-height: 82%; overflow-y: auto; animation: up .25s cubic-bezier(.2,.9,.3,1); }
  .handle { width: 40px; height: 5px; border-radius: 9px; background: rgba(255,255,255,.18); margin: 9px auto 10px; }
  .toast { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); z-index: 99; width: max-content; max-width: 86%; background: rgba(40,40,58,.96);
    border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 9px 14px; font-size: 12.5px; animation: drop .22s; }
  @keyframes fade { from { opacity: 0 } }
  @keyframes up { from { transform: translateY(60px); opacity: .4 } }
  @keyframes drop { from { transform: translate(-50%, -12px); opacity: 0 } }

  /* 1 App Store */
  .ver { border-bottom: 1px solid rgba(255,255,255,.07); padding: 14px 0; }
  .ver .vh { display: flex; align-items: baseline; gap: 8px; }
  .ver .vh b { font-size: 17px; }
  .cur { font-size: 10.5px; font-weight: 800; color: #111; background: var(--new); padding: 1px 7px; border-radius: 99px; }
  .settings-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,.06); }
  .settings-row:last-child { border-bottom: 0; }
  .settings-row .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 15px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #FF453A; }

  /* 2 時間軸 */
  .tl { position: relative; padding-left: 22px; }
  .tl::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--accent), rgba(126,166,255,.1)); border-radius: 2px; }
  .tl .day { position: relative; margin: 14px 0 6px; font-weight: 800; font-size: 13px; }
  .tl .day::before { content: ""; position: absolute; left: -21px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2.5px solid var(--accent); }
  .tl .ev { position: relative; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .tl .ev:hover { border-color: rgba(126,166,255,.4); }
  .search { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.07); border-radius: 12px; padding: 0 12px; height: 40px; margin-bottom: 10px; }
  .search input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--ink); font: inherit; }

  /* 3 What's New */
  .wn { position: absolute; inset: 0; z-index: 60; background: #0d0d16; display: flex; flex-direction: column; animation: fade .25s; }
  .wn .slides { flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .wn .slides::-webkit-scrollbar { display: none; }
  .wn .sl { flex: 0 0 100%; scroll-snap-align: center; padding: 70px 26px 20px; display: flex; flex-direction: column; }
  .wn .art { height: 300px; border-radius: 28px; display: grid; place-items: center; font-size: 96px; position: relative; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  .wn .art .mock { position: absolute; inset: auto 22px 22px 22px; height: 64px; border-radius: 32px; }
  .wn .pager { display: flex; gap: 6px; justify-content: center; margin: 4px 0 14px; }
  .wn .pager i { width: 7px; height: 7px; border-radius: 9px; background: rgba(255,255,255,.25); transition: all .25s; }
  .wn .pager i.on { width: 22px; background: #fff; }

  /* 4 依功能 */
  .feat { border-radius: 18px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07); margin-bottom: 10px; overflow: hidden; }
  .feat .fh { display: flex; align-items: center; gap: 12px; padding: 13px 14px; cursor: pointer; }
  .feat .fi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; }
  .feat .fb { padding: 0 14px 10px 66px; }
  .bars { display: flex; gap: 2px; align-items: flex-end; height: 22px; }
  .bars i { width: 5px; border-radius: 2px; background: var(--accent); opacity: .8; }

  /* 5 月曆熱度 */
  .heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .heat .h { aspect-ratio: 1; border-radius: 9px; display: grid; place-items: center; font-size: 11.5px; color: var(--ink2); cursor: pointer; position: relative; }
  .heat .h.sel { outline: 2px solid #fff; }
  .heat .wd { font-size: 10.5px; color: var(--ink3); text-align: center; }
  .stat { flex: 1; text-align: center; padding: 10px 4px; border-radius: 14px; background: rgba(255,255,255,.04); }
  .stat b { display: block; font-size: 20px; }
</style>
</head>
<body>
<div class="page">
  <h1>版本紀錄：五種設計</h1>
  <p class="lead">
    在 App 裡看「每一次更新新增了什麼」。裡面的內容是<b>這 10 天真的更新</b>（從 git 紀錄整理的），所以看起來就是真的做出來的樣子。<br>
    每一條都能點開看細節、「去看看」直接跳到那個功能。五版差在<b>怎麼排、怎麼找、更新後怎麼告訴你</b>。
  </p>
  <div class="vtabs" id="vtabs"></div>
  <div class="stage">
    <div class="phone" id="phone"></div>
    <div class="notes" id="notes"></div>
  </div>
</div>
<script>
// ── 資料：2026-10-06 ~ 10-14 真的更新（從 commit 整理成白話） ─────────
// type: new 新功能／imp 改善／fix 修正／del 拿掉
const FEATS = {
  app: { n: '全 App', e: '✨', c: '#7EA6FF' }, yt: { n: 'YT 管理', e: '▶', c: '#FF4E45' }, trade: { n: '交易&自律', e: '📈', c: '#F5C763' },
  jp: { n: '日文', e: 'あ', c: '#FF8FB8' }, sync: { n: '多裝置同步', e: '☁', c: '#52D1FF' }, home: { n: '首頁', e: '⌂', c: '#5FE08D' }, debt: { n: '負債管理', e: '💳', c: '#C792EA' },
};
const LOG = [
  { d: '2026-10-14', items: [
    ['new', 'app', '底部浮動分頁列', 'iOS 26 那種浮起來的毛玻璃膠囊，往下滑縮成一顆、往上滑展開；全 App 共用（英文／日文／YT）或切成各功能自己的。', '設定 → 首頁 → 底部分頁列'],
    ['new', 'yt', 'YT 播放清單', '影片右邊 ⋮ → 存到稍後觀看／存到播放清單（可勾好幾個、直接新建），播放清單頁有封面拼貼；多裝置同步。', 'YT → 播放清單'],
    ['new', 'yt', 'YT 頻道頁搜尋', '右上 🔍 → 搜這個頻道的影片：先找快取，再把整個頻道抓完（抓過的不重抓），找完才說找不到。', 'YT → 任一頻道 → 🔍'],
    ['imp', 'trade', '記一筆改成一題一題問', '第一題先問「現在開倉」還是「補記以前的單」，答了才出下一題，不會漏填。', '交易&自律 → 記一筆交易'],
    ['imp', 'trade', '日期跟時間合成一格', '只打數字就好：10142140 → 10/14 21:40，旁邊有「現在」。', '交易&自律 → 記一筆 → 時間'],
    ['imp', 'trade', '持倉中亮卡、已平倉票根', '持倉中是亮黃卡＋呼吸黃點＋平倉鈕；甘特圖點已平倉的單出虛線票根；持倉中的條像水流一樣慢慢流。', '交易&自律'],
    ['imp', 'yt', '依影片顯示預設不抓待評鑑', '跟冷藏一樣，設定可以打開。', '設定 → YT'],
    ['fix', 'trade', '修交易紀錄可能撞號', '同一毫秒記兩單 id 會一樣，點這單卻選到那單。', null],
  ] },
  { d: '2026-10-12', items: [
    ['new', 'yt', '影片下架檢查', '每兩週（可設定）把快取裡的影片問 YouTube 還在不在，被刪或改私人的標「已下架」，快取不刪。', '設定 → YT → 影片下架檢查'],
    ['new', 'sync', '同步中即時進度', '同步途中跳去別頁，最上面一條「同步中 5／12」＋進度條，點了回同步頁。', '同步'],
    ['new', 'yt', '頻道頁直接點著改', '按 ✏️ 進編輯，頭像、名稱、網址、簡介直接在頁面上點著改，名稱旁邊有「原本：…」。', 'YT → 頻道 → ✏️'],
    ['imp', 'yt', '「回到最上面」可以拖', '像 iPhone 小圓點一樣跟手指走，放開磁吸到最近的一邊，位置會同步。', 'YT → 頻道頁'],
    ['imp', 'home', 'Q 彈效果', '首頁功能方塊、長按頻道卡都會 Q 彈一下。', '首頁'],
    ['imp', 'home', '首頁圖示跟著格子縮放', '手機上圖示變大。', '首頁'],
    ['imp', 'trade', '月曆開／平照時間排', '同一天先平後開，「平」排在「開」左邊；點某天列出整天抱著的單。', '交易&自律 → 月曆'],
    ['imp', 'jp', '日文摘要標籤講清楚', '「今天練了 N 題」「已經過了」「練習天數」。', '日文 → 學習摘要'],
    ['fix', 'sync', '同步網路瞬斷自動重試', 'Safari「Load failed」或雲端 5xx 自動重試 3 次；修背景同步完當掉。', null],
  ] },
  { d: '2026-10-10', items: [
    ['imp', 'trade', 'USDT 後面加台幣', '匯率預設 31，可改、多裝置同步。', '交易&自律'],
    ['imp', 'trade', '補記先填 % 跟損益', '本金自動算（＝損益 ÷ %），自己改過就不蓋掉。', '交易&自律 → 記一筆'],
    ['imp', 'trade', '時間直接打字', '開倉／平倉時間一打開就是輸入框，24 小時制。', null],
    ['del', 'trade', '拿掉看盤次數', '看盤卡片、看盤統計、月曆 👁 全部移除，舊資料也刪。', null],
  ] },
  { d: '2026-10-08', items: [
    ['new', 'debt', '負債管理', '每月還款表＋月曆，貸款可填年利率、期數、開辦費；有密碼鎖（跟日記同一組）。', '負債管理'],
    ['new', 'trade', '交易&自律', '看盤記錄改成交易紀錄：槓桿拉桿、損益月曆、月報、可以補記以前的單。', '交易&自律'],
    ['new', 'sync', '雲端備份整包 zip', '一鍵下載雲端全部資料的壓縮檔。', '同步 → 備份'],
    ['imp', 'app', '長按選單快 1/3', '長按 0.33 秒就跳選單。', null],
    ['fix', 'yt', '影片類型標籤偶爾漏標', '背景掃描跑到一半又要重掃時會漏，現在接著補。', null],
  ] },
  { d: '2026-10-06', items: [
    ['new', 'yt', '待評鑑區', '新加進來的頻道先放分類最下面「待評鑑」，自己分到置頂／一般／冷藏。', 'YT → 分類'],
    ['new', 'yt', '影片時長篩選', '類型列尾端「時長 ▾」：不限／2 分內／2–6 分…', 'YT → 頻道頁'],
    ['new', 'home', '首頁功能順序', '設定裡拖曳排順序，多裝置同步。', '設定 → 首頁'],
    ['imp', 'yt', '影片清單變順', '只建畫面上看得到的列，幾百部也不卡。', null],
    ['imp', 'app', '長按不放手直接滑選', '長按出泡泡選單後，手指滑到按鈕上放開就選。', null],
    ['fix', 'yt', '置頂要按兩次', '網頁版位元運算只有 32 位，id 變 0；改掉了。', null],
  ] },
];
const TY = { new: '新功能', imp: '改善', fix: '修正', del: '拿掉' };
const ALL = LOG.flatMap(v => v.items.map(([t, f, ti, de, go], i) => ({ t, f, ti, de, go, d: v.d, k: v.d + i })));
const ver = d => d.replace(/-/g, '.');
const md = d => { const [, m, dd] = d.split('-'); return `${+m}/${+dd}`; };
const wk = d => '日一二三四五六'[new Date(d).getDay()];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const tyTag = t => `<span class="ty ${t}">${TY[t]}</span>`;
const ftTag = f => `<span class="ft">${FEATS[f].e} ${FEATS[f].n}</span>`;
const itemRow = x => `<div class="item" data-a="detail" data-k="${x.k}">${tyTag(x.t)}<div class="tx">${esc(x.ti)}<div class="note3">${FEATS[x.f].n}</div></div><span class="note3">›</span></div>`;

const S = { v: 0, sheet: null, toast: null, open: {}, f: 'all', t: 'all', q: '', page: 'settings', wn: false, slide: 0, day: '2026-10-14', seen: '2026-10-12' };

const V = [];
// 1 App Store 式（主流）
V.push({
  name: '1 App Store 式（主流）', title: '版本 1：設定 → 關於 → 版本紀錄，一版一張', tag: 'App Store「版本紀錄」那樣',
  desc: `<h3>長相</h3><ul><li>設定最下面「關於」裡一列「版本紀錄」，有新版本時旁邊紅點。</li>
    <li>點進去：最新在最上面，每一版寫版本號（日期）、幾天前、前 3 條，「更多」展開全部；目前用的那版有綠色「目前版本」。</li></ul>
    <h3>好處</h3><ul><li>大家最熟，乾淨。</li></ul><h3>缺點</h3><ul><li>只能從上往下翻，想找「YT 改了什麼」要自己看。</li></ul>`,
  render() {
    if (S.page === 'settings') return `<div class="bar"><div class="ib">☰</div><div class="t">設定</div></div>
      <div class="glass" style="padding:0">${[['🔑', 'YT API 金鑰', '#2E6BFF'], ['☁', '多裝置同步', '#52D1FF'], ['⌂', '首頁', '#5FE08D'], ['🔒', '日記密碼', '#C792EA']].map(([e, n, c]) => `<div class="settings-row"><div class="ic" style="background:${c}33">${e}</div>${n}<span class="sp"></span><span class="note3">›</span></div>`).join('')}</div>
      <div class="note3" style="margin:16px 4px 6px">關於</div>
      <div class="glass" style="padding:0"><div class="settings-row" data-a="goLog"><div class="ic" style="background:#7EA6FF33">🗒</div>版本紀錄<span class="sp"></span>${S.seen < LOG[0].d ? '<span class="dot"></span><span class="note" style="color:#FF453A">新</span>' : ''}<span class="note3">${ver(LOG[0].d)} ›</span></div>

V.push({

// ── 畫面 ─────────────────────────────────────────────
const phone = document.getElementById('phone');
function toast(m) { S.toast = m; clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; paint(); }, 2000); }
function sheet() {
  if (!S.sheet) return '';
  const x = ALL.find(a => a.k === S.sheet);
  return `<div class="scrim" data-a="close"><div class="sheet" data-stop><div class="handle"></div>
    <div class="row">${tyTag(x.t)}${ftTag(x.f)}<span class="sp"></span><span class="note3">${md(x.d)}・版本 ${ver(x.d)}</span></div>
    <div style="font-size:21px;font-weight:900;margin:10px 0 6px">${esc(x.ti)}</div><div style="font-size:14px;color:var(--ink2);line-height:1.7">${esc(x.de)}</div>
    ${x.go ? `<div class="glass" style="margin-top:14px;padding:11px 13px"><div class="note3">在哪裡</div><div style="font-weight:700">${esc(x.go)}</div></div><button class="btn" style="width:100%;margin-top:14px" data-a="go" data-k="${x.k}">去看看 ›</button>` : ''}
    <button class="btn ghost" style="width:100%;margin-top:8px" data-a="close">關閉</button></div></div>`;
}
function paint(keep = true) {
  const sc = phone.querySelector('.screen'), y = sc && keep ? sc.scrollTop : 0;
  const ae = document.activeElement, caret = ae && phone.contains(ae) && ae.dataset.k ? ae.selectionStart : null;
  const v = V[S.v];
  phone.innerHTML = `<div class="status"><span>21:41</span><span>▮▮▮ ◔ 82%</span></div><div class="screen">${v.render()}</div>${v.overlay ? v.overlay() : ''}${sheet()}
    ${S.toast ? `<div class="toast">${S.toast}</div>` : ''}<div class="home-ind"></div>`;
  phone.querySelector('.screen').scrollTop = y;
  const sl = phone.querySelector('#slides');
  if (sl) { sl.scrollLeft = S.slide * sl.clientWidth; sl.onscroll = () => { const i = Math.round(sl.scrollLeft / sl.clientWidth); if (i !== S.slide) { S.slide = i; phone.querySelectorAll('.pager i').forEach((el, j) => el.classList.toggle('on', j === i)); const b = phone.querySelector('.wn .btn'); b.textContent = i === SLIDES.length - 1 ? '開始用' : '下一個'; b.dataset.a = i === SLIDES.length - 1 ? 'wnClose' : 'wnNext'; } }; }
  if (caret != null) { const el = phone.querySelector('[data-k]'); if (el) { el.focus(); el.setSelectionRange(caret, caret); } }
}
const COMMON = `<div class="box"><b>五版都一樣的地方</b><ul>
  <li><b>內容從哪來</b>：每次部署時把這次的 commit 整理成白話（我寫 commit 時本來就有寫「改了什麼、為什麼」），存成 App 裡的一份檔案；不用你自己寫。</li>
  <li><b>版本號</b>：用日期（${ver(LOG[0].d)}），同一天部署好幾次合成一版。</li>
  <li>每一條分<b>新功能／改善／修正／拿掉</b>，標是哪個功能；點開看細節、「去看看」直接跳到那個功能。</li>
  <li>「看過到哪一版」跨裝置同步：在手機看過，電腦就不會再顯示「新」。</li></ul></div>`;
function notes() {
  const v = V[S.v];
  document.getElementById('notes').innerHTML = `<h2>${v.title}</h2><span class="tag">${v.tag}</span>${v.desc}${COMMON}
    <div class="try">試試看：${['點「版本紀錄」→ 點「更多」→ 點一條看細節、按「去看看」', '點功能「交易&自律」、類型「修正」；搜「同步」', '一開就是彈出畫面：左右滑或按「下一個」', '點「YT 管理」展開；看右邊小長條', '點月曆上亮的格子'][S.v]}
      <br><button class="demo" id="demo">⏩ 模擬：部署了新版（出現「新」、版本 3 會彈出）</button></div>`;
  document.getElementById('demo').onclick = () => { S.seen = '2026-10-12'; S.wn = S.v === 2; S.slide = 0; S.page = 'settings'; paint(false); };
}
function pick(i) {
  Object.assign(S, { v: i, sheet: null, open: {}, f: 'all', t: 'all', q: '', page: 'settings', wn: i === 2, slide: 0, day: '2026-10-14', seen: '2026-10-12' });
  document.querySelectorAll('#vtabs button').forEach((b, j) => b.classList.toggle('on', j === i));
  notes(); paint(false);
}
document.getElementById('vtabs').innerHTML = V.map(v => `<button>${v.name}</button>`).join('');
document.querySelectorAll('#vtabs button').forEach((b, i) => b.onclick = () => pick(i));
phone.addEventListener('input', e => { if (e.target.dataset.k === 'q') { S.q = e.target.value; paint(); } });
phone.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.dataset.a === 'close' && e.target.closest('[data-stop]') && el.classList.contains('scrim')) return;
  const a = el.dataset.a;
  switch (a) {
    case 'goLog': S.page = 'log'; S.seen = LOG[0].d; paint(false); return;
    case 'back': S.page = 'settings'; paint(false); return;
    case 'more': S.open[el.dataset.d] = !S.open[el.dataset.d]; break;
    case 'detail': S.sheet = el.dataset.k; break;
    case 'close': S.sheet = null; break;
    case 'go': { const x = ALL.find(y => y.k === el.dataset.k); S.sheet = null; S.wn = false; toast('（示意）跳到：' + x.go); break; }
    case 'f': S.f = el.dataset.f; break;
    case 't': S.t = el.dataset.t; break;
    case 'clearQ': S.q = ''; break;
    case 'wnOpen': S.wn = true; S.slide = 0; break;
    case 'wnNext': S.slide = Math.min(SLIDES.length - 1, S.slide + 1); { const sl = phone.querySelector('#slides'); sl.scrollTo({ left: S.slide * sl.clientWidth, behavior: 'smooth' }); } return;
    case 'wnClose': S.wn = false; S.seen = LOG[0].d; toast('看過了，其他裝置也不會再彈'); break;
    case 'toggleF': S.open[el.dataset.f] = !S.open[el.dataset.f]; S.seen = LOG[0].d; break;
    case 'day': S.day = el.dataset.d; break;
    case 'noop': return;
  }
  paint();
});
pick(0);
