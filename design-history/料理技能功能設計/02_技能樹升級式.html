<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>料理技能 2 技能樹升級式</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--acc:#FF8A5B;--accInk:#2b1204;--ok:#5FE08D}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--acc);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.phone{width:380px;height:760px;margin:0 auto;border:8px solid #000;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.top{padding:18px 16px 6px;flex-shrink:0;text-align:center}
.top b{font-size:17px}
.lvlcard{margin:8px 16px 6px;background:linear-gradient(135deg,rgba(255,138,91,.2),rgba(255,138,91,.05));border:1px solid var(--acc);border-radius:16px;padding:14px;text-align:center;flex-shrink:0}
.lvlcard .n{font-size:26px;font-weight:800;color:var(--acc)}
.lvlcard .l{font-size:11.5px;color:var(--sub)}
.xpbar{height:8px;border-radius:99px;background:var(--panel2);margin-top:8px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--acc);width:62%}
.scroll{flex:1;overflow:auto;padding:6px 20px 18px;position:relative}
.tree{position:relative;padding-left:20px}
.tree::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.node{position:relative;margin-bottom:16px;padding-left:14px}
.node::before{content:'';position:absolute;left:-16px;top:2px;width:18px;height:18px;border-radius:50%;background:var(--ok);border:3px solid var(--bg)}
.node.locked::before{background:var(--panel2)}
.node.current::before{background:var(--acc);box-shadow:0 0 0 4px rgba(255,138,91,.25)}
.node b{font-size:13.5px;display:block}
.node span{color:var(--sub);font-size:11px}
.node.locked b,.node.locked span{color:var(--sub)}
.note{max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
</style></head><body><div class="intro"><div class="eyebrow">料理技能 · 版本 2 / 5</div><h1>技能樹升級式</h1><p>把學做菜當成打遊戲練等——完成一道菜獲得經驗值，菜色排成技能樹，前面的菜解鎖後面更難的菜，給喜歡遊戲化、「刻意練習」感的人。</p></div><div class="phone"><div class="top"><b>中式料理技能樹</b></div>
<div class="lvlcard"><div class="n">Lv. 4</div><div class="l">見習廚師</div><div class="xpbar"><i></i></div></div>
<div class="scroll"><div class="tree">
<div class="node"><b>✓ 番茄炒蛋</b><span>入門菜・已完成 3 次</span></div>
<div class="node"><b>✓ 蒜炒空心菜</b><span>入門菜・已完成 2 次</span></div>
<div class="node current"><b>▶ 紅燒獅子頭</b><span>進行中・掌握控溫技巧</span></div>
<div class="node locked"><b>🔒 麻婆豆腐</b><span>需先完成紅燒獅子頭</span></div>
<div class="node locked"><b>🔒 東坡肉</b><span>需 Lv.6 解鎖</span></div>
</div></div></div><p class="note">優點：遊戲化的成長感能提高持續練習的動機，適合把料理當興趣認真練的人。缺點：把料理硬套進「解鎖」邏輯，想學的菜如果不在樹狀順序上（例如臨時想做甜點）會覺得綁手綁腳。</p></body></html>
