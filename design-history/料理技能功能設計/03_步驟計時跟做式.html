<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>料理技能 3 步驟計時跟做式</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--acc:#FF8A5B;--accInk:#2b1204;--ok:#5FE08D}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--acc);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.phone{width:380px;height:760px;margin:0 auto;border:8px solid #000;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:16px;flex-shrink:0}
.ib{width:32px;height:32px;border-radius:10px;background:var(--panel);display:grid;place-items:center;font-size:15px}
.top .prog{flex:1;text-align:center;font-size:12px;color:var(--sub)}
.stepwrap{flex:1;display:flex;flex-direction:column;padding:0 20px}
.stepimg{height:150px;background:linear-gradient(135deg,#3a2410,#241608);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:44px;flex-shrink:0}
.stepno{color:var(--acc);font-size:12px;font-weight:700;margin-top:14px}
.steptext{font-size:16px;font-weight:600;line-height:1.6;margin-top:6px}
.timerbox{margin-top:auto;margin-bottom:16px;background:var(--panel);border-radius:16px;padding:14px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.timerbox .cd{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.timerbox .l{color:var(--sub);font-size:11px}
.timerbox .startbtn{margin-left:auto;background:var(--acc);color:var(--accInk);padding:9px 18px;border-radius:99px;font-size:12.5px;font-weight:700}
.navbtns{display:flex;gap:10px;padding:0 20px 20px;flex-shrink:0}
.navbtns div{flex:1;text-align:center;padding:14px;border-radius:14px;font-weight:700;font-size:13px}
.navbtns .prev{background:var(--panel2);color:var(--sub)}
.navbtns .next{background:var(--acc);color:var(--accInk)}
.note{max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
</style></head><body><div class="intro"><div class="eyebrow">料理技能 · 版本 3 / 5</div><h1>步驟計時跟做式</h1><p>不是瀏覽食譜清單，而是「跟著做」的全螢幕引導模式：一次只顯示一個步驟＋內建計時器，手上沾滿油醬時單手滑就能切下一步——參考 NYT Cooking 的 Cook Mode / 智慧廚房秤重機 App。</p></div><div class="phone"><div class="top"><div class="ib">✕</div><div class="prog">步驟 3 / 7</div><div class="ib">⏸</div></div>
<div class="stepwrap">
<div class="stepimg">🍲</div>
<div class="stepno">STEP 3</div>
<div class="steptext">加入醬油與冰糖，轉小火燉煮，過程中不要開蓋。</div>
<div class="timerbox"><div><div class="cd">12:00</div><div class="l">小火燉煮</div></div><div class="startbtn">開始計時</div></div>
</div>
<div class="navbtns"><div class="prev">‹ 上一步</div><div class="next">下一步 ›</div></div>
</div><p class="note">優點：下廚當下最需要的「現在要做什麼、要等多久」被放到最大最清楚，手忙腳亂時不用重讀整篇食譜。缺點：不適合想「先通篇看過食譜規劃」的人，這個模式假設你已經看過一次、現在是實際操作階段。</p></body></html>
