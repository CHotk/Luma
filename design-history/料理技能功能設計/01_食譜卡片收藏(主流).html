<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>料理技能 1 食譜卡片收藏</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--ok:#5FE08D;--bad:#FF938B;--acc:#FF8A5B;--accInk:#2b1204}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--acc);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.tag{display:inline-block;background:var(--acc);color:var(--accInk);border-radius:99px;padding:2px 10px;font-size:11px;margin-top:8px}
.phone{width:380px;height:760px;margin:0 auto;border:8px solid #000;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;gap:8px;padding:18px 16px 10px;flex-shrink:0}
.top b{font-size:18px;flex:1}
.ib{width:32px;height:32px;border-radius:10px;background:var(--panel);display:grid;place-items:center;font-size:15px}
.tabs{display:flex;gap:8px;padding:0 16px 12px;flex-shrink:0}
.tabs div{background:var(--panel);color:var(--sub);font-size:12px;padding:7px 14px;border-radius:99px}
.tabs div.on{background:var(--acc);color:var(--accInk);font-weight:700}
.scroll{flex:1;overflow:auto;padding:0 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.rcard{background:var(--panel);border-radius:16px;overflow:hidden}
.rimg{height:96px;background:linear-gradient(135deg,#3a2410,#241608);display:flex;align-items:center;justify-content:center;font-size:32px}
.rinfo{padding:9px 10px}
.rinfo b{font-size:12.5px;display:block;line-height:1.3}
.meta{display:flex;gap:8px;margin-top:5px;color:var(--sub);font-size:10px}
.level{display:flex;gap:2px;margin-top:5px}
.level i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.level i.on{background:var(--acc)}
.note{max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
