<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飲食控制 1 三大營養素圓環</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--ok:#5FE08D;--bad:#FF938B;--acc:#7ED957;--accInk:#0d2205;--carb:#F5C763;--protein:#7EA6FF;--fat:#FF938B}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--acc);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.tag{display:inline-block;background:var(--acc);color:var(--accInk);border-radius:99px;padding:2px 10px;font-size:11px;margin-top:8px}
.phone{width:380px;height:760px;margin:0 auto;border:8px solid #000;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;gap:8px;padding:18px 16px 10px;flex-shrink:0}
.top b{font-size:16px;flex:1}
.ib{width:32px;height:32px;border-radius:10px;background:var(--panel);display:grid;place-items:center;font-size:15px}
.scroll{flex:1;overflow:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.scroll>*{flex-shrink:0}
.hero{background:var(--panel);border-radius:18px;padding:18px;display:flex;align-items:center;gap:16px}
.ring{width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--acc) 0deg 252deg,var(--panel2) 252deg 360deg);position:relative;flex-shrink:0}
.ring::after{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--panel)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;font-weight:800}
.ring b span{font-size:10px;color:var(--sub);font-weight:400}
.macros{flex:1;display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:6px;font-size:11.5px}
.mrow .sw{width:8px;height:8px;border-radius:50%}
.mrow b{margin-left:auto;font-weight:700}
.card{background:var(--panel);border-radius:16px;padding:12px 14px}
.meal{display:flex;align-items:center;gap:11px;padding:8px 0}
.meal .ic{width:36px;height:36px;border-radius:11px;background:var(--panel2);display:grid;place-items:center;font-size:16px}
.meal b{font-size:13px;display:block}
.meal span{color:var(--sub);font-size:11px}
.meal .kcal{margin-left:auto;font-size:12.5px;font-weight:700}
.fab{position:absolute;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--accInk);display:grid;place-items:center;font-size:24px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.note{max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
</style></head><body><div class="intro"><div class="eyebrow">飲食控制 · 版本 1 / 5</div><h1>三大營養素圓環</h1><p>頂部熱量圓環＋三大營養素（碳水/蛋白質/脂肪）小條，下面是今天吃過的餐點清單——MyFitnessPal、Lose It! 這類主流飲食紀錄 App 的標準首頁版型。</p><span class="tag">主流慣例：MyFitnessPal 首頁</span></div><div class="phone"><div class="top"><div class="ib">☰</div><b>今日飲食</b><div class="ib">📊</div></div><div class="scroll">
<div class="hero"><div class="ring"><b>1,680<span>/ 2,200</span></b></div>
<div class="macros">
<div class="mrow"><div class="sw" style="background:var(--carb)"></div>碳水<b>180g</b></div>
<div class="mrow"><div class="sw" style="background:var(--protein)"></div>蛋白質<b>92g</b></div>
<div class="mrow"><div class="sw" style="background:var(--fat)"></div>脂肪<b>48g</b></div>
</div></div>
<div class="card">
<div class="meal"><div class="ic">🌅</div><div><b>早餐</b><span>燕麥・雞蛋</span></div><div class="kcal">420</div></div>
<div class="meal"><div class="ic">☀️</div><div><b>午餐</b><span>雞胸沙拉</span></div><div class="kcal">560</div></div>
<div class="meal"><div class="ic">🌙</div><div><b>晚餐</b><span>還沒記錄</span></div><div class="kcal" style="color:var(--sub)">—</div></div>
<div class="meal"><div class="ic">🍎</div><div><b>點心</b><span>香蕉</span></div><div class="kcal">105</div></div>
</div>
</div></div><div class="fab">＋</div><p class="note">優點：市面同類 App 都長這樣，資料完整、上手快。缺點：每一餐要手動輸入食物跟份量，記錄過程比較繁瑣，容易半途放棄。</p></body></html>
