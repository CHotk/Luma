<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>飲食控制 3 體重趨勢優先式</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--ok:#5FE08D;--acc:#7ED957;--accInk:#0d2205}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--acc);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.phone{width:380px;height:760px;margin:0 auto;border:8px solid #000;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:18px 16px 10px;flex-shrink:0}
.top b{font-size:16px;flex:1}
.ib{width:32px;height:32px;border-radius:10px;background:var(--panel);display:grid;place-items:center;font-size:15px}
.scroll{flex:1;overflow:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.scroll>*{flex-shrink:0}
.hero{background:var(--panel);border-radius:18px;padding:16px}
.hero .row{display:flex;justify-content:space-between;align-items:baseline}
.hero .n{font-size:30px;font-weight:800}
.sub{color:var(--sub);font-size:12px}
.hero .delta{color:var(--ok);font-size:13px;font-weight:700}
.chartline{height:80px;margin-top:14px;position:relative}
.chartline svg{width:100%;height:100%}
.goalcard{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:12px 14px}
.goalcard .bar{flex:1;height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.goalcard .bar i{display:block;height:100%;background:var(--acc);width:64%}
.goalcard b{font-size:12.5px}
.logrow{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
.logrow span{color:var(--sub);font-size:11px}
.note{max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
</style></head><body><div class="intro"><div class="eyebrow">飲食控制 · 版本 3 / 5</div><h1>體重趨勢優先式</h1><p>把「體重變化趨勢線」放在最上面當主角，飲食紀錄退居輔助角色——給真正在意「有沒有往目標體重前進」勝過「每口熱量算得多準」的人，呼應體重本身就有波動、看趨勢比看單日數字更有意義。</p></div><div class="phone"><div class="top"><div class="ib">☰</div><b>體重與目標</b><div class="ib">🍽️</div></div><div class="scroll">
<div class="hero"><div class="row"><div class="n">64.2 kg</div><div class="delta">▼ 0.8kg 本週</div></div>
<div class="chartline"><svg viewBox="0 0 300 80" preserveAspectRatio="none"><polyline points="0,20 50,30 100,25 150,45 200,40 250,60 300,55" fill="none" stroke="#7ED957" stroke-width="3"/></svg></div>
</div>
<div class="goalcard"><b>距目標 60kg</b><div class="bar"><i></i></div><b>64%</b></div>
<div class="hero" style="padding:14px 16px">
<div class="sub" style="color:var(--sub);font-size:12px;margin-bottom:6px">今天飲食（簡易記錄）</div>
<div class="logrow"><span>早餐</span><span>燕麥・雞蛋</span></div>
<div class="logrow"><span>午餐</span><span>雞胸沙拉</span></div>
<div class="logrow" style="border:none"><span>晚餐</span><span style="color:var(--sub)">還沒記錄</span></div>
</div>
</div></div><p class="note">優點：符合「結果比過程更重要」的心態，減少每天糾結熱量數字的壓力。缺點：飲食細節被弱化，想細查某一餐吃了什麼、營養素夠不夠，要多點一層才看得到完整資料。</p></body></html>
