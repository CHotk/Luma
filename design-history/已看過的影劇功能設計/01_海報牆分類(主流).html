<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>已看過的影劇 1 海報牆分類</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--ok:#5FE08D;--warn:#F5C763;--acc:#C77DFF;--accInk:#210a33}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--acc);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.tag{display:inline-block;background:var(--acc);color:var(--accInk);border-radius:99px;padding:2px 10px;font-size:11px;margin-top:8px}

.top{display:flex;align-items:center;gap:8px;padding:18px 16px 10px;flex-shrink:0}
.top b{font-size:18px;flex:1}
.ib{width:32px;height:32px;border-radius:10px;background:var(--panel);display:grid;place-items:center;font-size:15px}
.tabs{display:flex;gap:8px;padding:0 16px 12px;flex-shrink:0}
.tabs div{background:var(--panel);color:var(--sub);font-size:12px;padding:7px 14px;border-radius:99px}
.tabs div.on{background:var(--acc);color:var(--accInk);font-weight:700}
.scroll{flex:1;overflow:auto;padding:0 16px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.poster{aspect-ratio:2/3;border-radius:10px;background:linear-gradient(135deg,#2a1a3a,#1a1024);display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;overflow:hidden}

.fab{position:absolute;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--accInk);display:grid;place-items:center;font-size:24px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.note{max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
