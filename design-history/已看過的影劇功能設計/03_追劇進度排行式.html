<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>已看過的影劇 3 追劇進度排行式</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--acc:#C77DFF;--accInk:#210a33;--ok:#5FE08D;--warn:#F5C763}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--acc);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.phone{width:380px;height:760px;margin:0 auto;border:8px solid #000;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:18px 16px 10px;flex-shrink:0}
.top b{font-size:16px;flex:1}
.ib{width:32px;height:32px;border-radius:10px;background:var(--panel);display:grid;place-items:center;font-size:15px}
.scroll{flex:1;overflow:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:16px}
.scroll>*{flex-shrink:0}
.grp .h{font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:8px}
.show{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:11px 13px;margin-bottom:8px}
.poster{width:42px;height:58px;border-radius:8px;background:linear-gradient(135deg,#2a1a3a,#1a1024);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sinfo{flex:1}
.sinfo b{font-size:13px;display:block}
.sinfo .ep{color:var(--sub);font-size:11px;margin-top:2px}
.bar{height:6px;border-radius:99px;background:var(--panel2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.done-badge{background:rgba(95,224,141,.15);color:var(--ok);font-size:10px;padding:3px 8px;border-radius:99px;flex-shrink:0}
.note{max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
</style></head><body><div class="intro"><div class="eyebrow">已看過的影劇 · 版本 3 / 5</div><h1>追劇進度排行式</h1><p>影集用「追到第幾集/共幾集」的進度條呈現，正在追的排最上面，這一版把重點從「看過的紀錄庫」轉為「還沒追完的待辦清單」，解決「這部到底追到哪了」的實際困擾。</p></div><div class="phone"><div class="top"><div class="ib">☰</div><b>追劇進度</b><div class="ib">＋</div></div><div class="scroll">
<div class="grp"><div class="h">追劇中</div>
<div class="show"><div class="poster">📺</div><div class="sinfo"><b>熊之驚奇</b><div class="ep">S3 · 第 6 / 8 集</div><div class="bar"><i style="width:75%"></i></div></div></div>
<div class="show"><div class="poster">📺</div><div class="sinfo"><b>怪奇物語</b><div class="ep">S5 · 第 2 / 9 集</div><div class="bar"><i style="width:22%"></i></div></div></div>
</div>
<div class="grp"><div class="h">已追完</div>
<div class="show"><div class="poster">📺</div><div class="sinfo"><b>紙房子</b><div class="ep">全 5 季・已看完</div></div><div class="done-badge">✓ 完結</div></div>
<div class="show"><div class="poster">📺</div><div class="sinfo"><b>絕命毒師</b><div class="ep">全 5 季・已看完</div></div><div class="done-badge">✓ 完結</div></div>
</div>
</div></div><p class="note">優點：正在追的劇「追到哪」一目了然，避免忘記進度、重複看錯集。缺點：電影本身沒有「進度」概念，這套版型偏向影集/動畫為主，電影類要另外併入或用別的方式呈現才自然。</p></body></html>
