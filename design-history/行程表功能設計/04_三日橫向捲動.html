<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行程表 4 三日橫向捲動</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--ok:#5FE08D;--bad:#FF938B;--acc:#5B8DEF;--accInk:#eef3ff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--acc);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.phone{width:380px;height:760px;margin:0 auto;border:8px solid #000;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:18px 16px 10px;flex-shrink:0}
.top b{font-size:16px;flex:1}
.ib{width:32px;height:32px;border-radius:10px;background:var(--panel);display:grid;place-items:center;font-size:15px}
.cols{flex:1;display:flex;overflow-x:auto;overflow-y:hidden}
.col{flex:0 0 78%;border-right:1px solid var(--line);display:flex;flex-direction:column;scroll-snap-align:start}
.cols{scroll-snap-type:x mandatory}
.colhead{padding:8px 14px;text-align:center;border-bottom:1px solid var(--line);flex-shrink:0}
.colhead .dow{font-size:11px;color:var(--sub)}
.colhead .num{font-size:18px;font-weight:800}
.col.today .colhead{background:rgba(91,141,239,.14)}
.col.today .num{color:var(--acc)}
.colbody{flex:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:8px}
.ev{border-radius:10px;padding:8px 10px;font-size:11.5px;border-left:3px solid var(--acc);background:rgba(91,141,239,.14)}
.ev b{display:block;font-size:12px}
.ev span{color:var(--sub);font-size:10px}
.ev.g{border-color:var(--ok);background:rgba(95,224,141,.14)}
.ev.r{border-color:var(--bad);background:rgba(255,147,139,.14)}
.note{max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
</style></head><body><div class="intro"><div class="eyebrow">行程表 · 版本 4 / 5</div><h1>三日橫向捲動</h1><p>畫面同時看到「今天＋明天＋後天」三欄並排，左右滑就能連續往前後捲，不用先點回上一頁再選日期——參考 Fantastical 手機版的 3-day view，適合想快速比較這幾天行程量的人。</p></div><div class="phone"><div class="top"><div class="ib">☰</div><b>2026 年 9 月</b><div class="ib">📅</div></div>
<div class="cols">
<div class="col today"><div class="colhead"><div class="dow">週三</div><div class="num">30</div></div><div class="colbody">
<div class="ev"><b>晨會</b><span>09:00</span></div>
<div class="ev g"><b>午餐約會</b><span>12:00</span></div>
<div class="ev"><b>專案開發</b><span>14:00–16:00</span></div>
<div class="ev r"><b>牙醫回診</b><span>18:00</span></div>
</div></div>
<div class="col"><div class="colhead"><div class="dow">週四</div><div class="num">1</div></div><div class="colbody">
<div class="ev"><b>週會</b><span>10:00</span></div>
</div></div>
<div class="col"><div class="colhead"><div class="dow">週五</div><div class="num">2</div></div><div class="colbody">
<div class="ev g"><b>朋友聚餐</b><span>19:00</span></div>
</div></div>
</div></div><p class="note">優點：規劃「這幾天」的節奏很直覺，左右滑動比切月曆頁快。缺點：看不到一整週/一整月的全貌，長期規劃（例如找下個月哪天有空）還是得切別的檢視。</p></body></html>
