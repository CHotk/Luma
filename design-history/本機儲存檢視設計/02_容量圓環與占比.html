<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本機儲存檢視 2 容量圓環與占比</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--accent:#7EA6FF;--ok:#5FE08D;--warn:#F5C763;--bad:#FF938B;--yt:#FF2D40;--diary:#8FBF9F;--jp:#EA92AC;--fit:#F2A65A;--sync:#7ED6D0}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.tag{display:inline-block;background:var(--accent);color:#0c0c13;border-radius:99px;padding:2px 10px;font-size:11px;margin-top:8px}
.phone{width:380px;height:760px;margin:0 auto;border:8px solid #000;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.scroll{flex:1;overflow:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.scroll>*{flex-shrink:0}
.top{display:flex;align-items:center;gap:8px;padding:18px 16px 10px;flex-shrink:0}
.top b{font-size:16px;flex:1}
.ib{width:32px;height:32px;border-radius:10px;background:var(--panel);display:grid;place-items:center;font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px}
.sub{color:var(--sub);font-size:12px}
.mono{font-family:Consolas,monospace;font-size:12px}
.bar{height:8px;background:var(--panel2);border-radius:9px;overflow:hidden;display:flex}
.note{max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:10.5px;border:1px solid var(--line);color:var(--sub)}
.btn{display:inline-block;border-radius:10px;padding:6px 12px;font-size:12px;border:1px solid var(--line);background:var(--panel2)}
.btn.bad{color:var(--bad);border-color:#5a2f2f}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--sub);text-align:left;font-weight:500;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:9px 4px;border-bottom:1px solid var(--line)}
pre{background:#0a0a10;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px;line-height:1.6;overflow:auto;color:#b9c7ff}</style></head><body><div class="intro"><div class="eyebrow">INDEXEDDB · 版本 2 / 5</div><h1>容量圓環與占比</h1><p>中間一個大圓環顯示各功能占了多少空間，一眼看出誰最肥（日文練習筆畫占 77%）。下面是圖例清單。</p></div><div class="phone"><div class="top"><div class="ib">☰</div><b>本機儲存</b><div class="ib">↻</div></div><div class="scroll"><div class="card" style="display:flex;flex-direction:column;align-items:center;gap:10px"><div style="width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--jp) 0 77%,var(--yt) 77% 94%,var(--diary) 94% 96%,var(--fit) 96% 97%,var(--sync) 97% 100%);display:grid;place-items:center"><div style="width:120px;height:120px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center"><div><b style="font-size:22px">18.4</b><div class="sub">MB / 2.1 GB</div></div></div></div></div>
<div class="card" style="display:flex;align-items:center;gap:10px;padding:10px 13px"><span style="width:10px;height:10px;border-radius:50%;background:var(--jp)"></span><span style="flex:1;font-size:13px">日文練習 77%</span><span class="sub">14.8 MB</span></div><div class="card" style="display:flex;align-items:center;gap:10px;padding:10px 13px"><span style="width:10px;height:10px;border-radius:50%;background:var(--yt)"></span><span style="flex:1;font-size:13px">YT 影片快取 17%</span><span class="sub">3.1 MB</span></div><div class="card" style="display:flex;align-items:center;gap:10px;padding:10px 13px"><span style="width:10px;height:10px;border-radius:50%;background:var(--diary)"></span><span style="flex:1;font-size:13px">日記 1.3%</span><span class="sub">241 KB</span></div><div class="card" style="display:flex;align-items:center;gap:10px;padding:10px 13px"><span style="width:10px;height:10px;border-radius:50%;background:var(--fit)"></span><span style="flex:1;font-size:13px">健身 0.3%</span><span class="sub">48 KB</span></div><div class="card" style="display:flex;align-items:center;gap:10px;padding:10px 13px"><span style="width:10px;height:10px;border-radius:50%;background:var(--sync)"></span><span style="flex:1;font-size:13px">其他 4%</span><span class="sub">~0.7 MB</span></div></div></div><p class="note">優點：視覺直覺、一秒看出誰最占空間。缺點：看不到個別紀錄內容。</p></body></html>
