<!doctype html>
<title>YT頻道02・標籤篩選式</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap"
/>
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0c13;
    --bg-deep: #0a0a10;
    --panel-edge: rgba(255, 255, 255, 0.14);
    --ink: #f3f2f8;
    --ink2: #a3a2b2;
    --ink3: #74738a;
    --glass-edge: rgba(255, 255, 255, 0.14);
    /* 標籤篩選版用靛紫：跟分類資料夾版區分開。 */
    --accent: #8592e0;
    --accent-ink: #12153a;
    --amb-1: #2c3160;
    --amb-2: #402a55;
    --amb-3: #23304f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg-deep); color: var(--ink); font-family: "Zen Kaku Gothic New", "Noto Sans TC", system-ui, sans-serif; }
  body { padding-inline: 20px; padding-block: 32px 48px; display: flex; flex-direction: column; align-items: center; gap: 18px; }

  .intro { max-width: 480px; width: 100%; text-align: center; }
  .eyebrow { font-size: 12px; letter-spacing: 0.16em; color: #8b8690; text-transform: uppercase; }
  .intro h1 { font-weight: 800; font-size: clamp(20px, 5vw, 24px); margin: 6px 0 8px; color: #f4f1f4; }
  .intro p { margin: 0 0 4px; font-size: 13px; line-height: 1.7; color: #a9a4ad; max-width: 48ch; margin-inline: auto; }
  .intro ul { text-align: left; max-width: 40ch; margin: 10px auto 0; padding-left: 18px; font-size: 12.5px; line-height: 1.8; color: #9d98a4; }

  .phone { position: relative; width: 100%; max-width: 380px; height: 760px; flex-shrink: 0; border-radius: 34px; padding: 14px; isolation: isolate; overflow: hidden; background: var(--bg); box-shadow: 0 30px 70px -30px rgba(0,0,0,0.7); }
  .amb { position: absolute; border-radius: 50%; filter: blur(55px); opacity: 0.46; z-index: -1; }
  .amb-1 { width: 220px; height: 220px; top: -70px; left: -60px; background: var(--amb-1); }
  .amb-2 { width: 200px; height: 200px; bottom: 90px; right: -70px; background: var(--amb-2); }
  .amb-3 { width: 190px; height: 190px; bottom: -90px; left: 30px; background: var(--amb-3); }

  .shell { position: relative; height: 100%; border-radius: 24px; padding: 18px 16px; background: rgba(255,255,255,0.04); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--panel-edge); overflow: hidden; display: flex; flex-direction: column; gap: 12px; }

  .topbar { display: flex; align-items: center; gap: 10px; flex: none; }
  .icon-btn { appearance: none; border: none; background: rgba(255,255,255,0.06); color: var(--ink2); width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; flex: none; }
  .icon-btn:hover { background: rgba(255,255,255,0.1); }
  .topbar-title { font-weight: 800; font-size: 16px; }
  .topbar-sub { font-size: 11px; color: var(--ink3); margin-left: auto; }

  .view { flex: 1; min-height: 0; overflow-y: auto; display: none; flex-direction: column; gap: 12px; }
  .view.active { display: flex; }

  /* 標籤篩選列，橫向可滑 */
  .tag-scroll { flex: none; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .tag-chip { flex: none; padding: 7px 13px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--glass-edge); background: rgba(255,255,255,0.03); color: var(--ink2); white-space: nowrap; }
  .tag-chip.selected { border-color: var(--tag-color, var(--accent)); background: color-mix(in srgb, var(--tag-color, var(--accent)) 26%, transparent); color: var(--ink); }

  .filter-hint { flex: none; font-size: 11px; color: var(--ink3); }

  .chan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
  .chan-card { border-radius: 14px; padding: 10px; background: rgba(255,255,255,0.035); border: 1px solid var(--glass-edge); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .chan-card:hover { background: rgba(255,255,255,0.06); }
  .chan-card .av { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: rgba(255,255,255,0.06); }
  .chan-card .name { font-size: 12px; font-weight: 700; color: var(--ink); }
  .chan-card .last { font-size: 10px; color: var(--ink3); }
  .chan-card .tags { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
  .chan-card .tags span { width: 6px; height: 6px; border-radius: 50%; }

  /* 頻道詳情 */
  .chan-header { display: flex; align-items: center; gap: 12px; flex: none; padding: 6px 4px 4px; }
  .chan-header .av { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; background: rgba(255,255,255,0.06); border: 1px solid var(--glass-edge); }
  .chan-header .name { font-size: 16px; font-weight: 800; }
  .chan-header .sub { font-size: 11.5px; color: var(--ink3); margin-top: 2px; }

  .edit-tags-label { font-size: 11px; color: var(--ink3); flex: none; }
  .edit-tags { flex: none; display: flex; gap: 6px; flex-wrap: wrap; }

  .video-row { display: flex; gap: 10px; padding: 8px 4px; border-radius: 12px; }
  .video-row:hover { background: rgba(255,255,255,0.04); }
  .video-row .thumb { flex: none; width: 88px; height: 54px; border-radius: 10px; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 40%, #222), #222); display: flex; align-items: center; justify-content: center; font-size: 10px; color: rgba(255,255,255,0.7); }
  .video-row .vmeta { flex: 1; min-width: 0; }
  .video-row .vt { font-size: 12.5px; color: var(--ink); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .video-row .vd { font-size: 11px; color: var(--ink3); margin-top: 4px; }

  .list-label { font-size: 11px; letter-spacing: 0.06em; color: var(--ink3); text-transform: uppercase; flex: none; margin-top: 2px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="intro">
  <p class="eyebrow">Lume · YT 頻道追蹤 02（Mock，資料全假）</p>
  <h1>標籤篩選式</h1>
  <p>跟 01 版的差別：一個頻道可以同時貼好幾個標籤（例如一個實況主同時打遊戲又唱歌，可以同時是「遊戲」＋「音樂」），不用被迫只選一個分類。上面一排標籤可以複選篩選，比資料夾更彈性。</p>
  <ul>
    <li>頂部是<b>可複選的標籤列</b>，選中的標籤會篩選下面的頻道格子（符合任一標籤就顯示）。</li>
    <li>不選任何標籤＝顯示全部。</li>
    <li>頻道格子右下角的小色點就是這個頻道貼的標籤顏色，一眼看出分類。</li>
    <li>點進頻道詳情還能直接<b>編輯這個頻道的標籤</b>，不用跳回列表頁改。</li>
  </ul>
</div>

<div class="phone">
  <div class="amb amb-1"></div>
  <div class="amb amb-2"></div>
  <div class="amb amb-3"></div>

  <div class="shell">
    <div class="topbar" id="topbar">
      <span class="topbar-title" id="topTitle">頻道追蹤</span>
    </div>

    <div class="view active" id="view-home">
      <div class="tag-scroll" id="tagScroll"></div>
      <p class="filter-hint" id="filterHint">顯示全部 11 個頻道</p>
      <div class="chan-grid" id="chanGrid"></div>
    </div>

    <div class="view" id="view-channel">
      <div class="chan-header">
        <div class="av" id="chAv"></div>
        <div>
          <div class="name" id="chName"></div>
          <div class="sub" id="chSub"></div>
        </div>
      </div>
      <p class="edit-tags-label">標籤（點擊切換）</p>
      <div class="edit-tags" id="editTags"></div>
      <p class="list-label">最近影片</p>
      <div id="chVideos"></div>
    </div>
  </div>
</div>

<script>
  const TAGS = [
    { key: 'game', label: '遊戲', color: '#6aa9e0' },
    { key: 'know', label: '知識', color: '#7fbf8f' },
    { key: 'food', label: '美食', color: '#e0a94e' },
    { key: 'music', label: '音樂', color: '#c98fe0' },
    { key: 'vlog', label: 'Vlog', color: '#e07a7a' },
  ];
  const CHANNELS = [
    { id:'c1', name:'夜貓實況室', tags:['game'], avatar:'🎮', last:'3 小時前', videos:[
      {t:'跟訂閱者一起玩到凌晨的爆笑集錦', time:'3 小時前', dur:'18:24'},
      {t:'排位賽連勝紀錄挑戰', time:'5 天前', dur:'1:02:33'},
    ]},
    { id:'c2', name:'阿凱的知識膠囊', tags:['know'], avatar:'🧠', last:'昨天', videos:[
      {t:'為什麼貓咪喜歡箱子？三分鐘搞懂', time:'昨天', dur:'3:45'},
    ]},
    { id:'c3', name:'小廚房日常', tags:['food'], avatar:'🍳', last:'2 天前', videos:[
      {t:'十分鐘炒出餐廳等級的炒飯', time:'2 天前', dur:'10:05'},
    ]},
    { id:'c4', name:'耳朵懷孕電台', tags:['music'], avatar:'🎧', last:'4 天前', videos:[
      {t:'深夜讀書歌單 Lofi Mix', time:'4 天前', dur:'55:00'},
    ]},
    { id:'c5', name:'阿明的下班日常', tags:['vlog','food'], avatar:'🌇', last:'5 天前', videos:[
      {t:'週末去了趟老家菜市場，順便吃了小吃', time:'5 天前', dur:'12:20'},
    ]},
    { id:'c6', name:'速攻通關社', tags:['game'], avatar:'🕹️', last:'1 週前', videos:[
      {t:'新手向：三個容易忽略的隱藏道具', time:'1 週前', dur:'9:40'},
    ]},
    { id:'c7', name:'唱跳實況社', tags:['game','music'], avatar:'🎤', last:'3 天前', videos:[
      {t:'邊玩音game邊唱歌雜談', time:'3 天前', dur:'44:00'},
    ]},
    { id:'c8', name:'甜點實驗室', tags:['food'], avatar:'🧁', last:'6 天前', videos:[
      {t:'免烤箱提拉米蘇教學', time:'6 天前', dur:'11:11'},
    ]},
    { id:'c9', name:'路人甲的Cover', tags:['music'], avatar:'🎤', last:'1 個月前', videos:[
      {t:'翻唱合輯 Vol.7', time:'1 個月前', dur:'6:40'},
    ]},
    { id:'c10', name:'旅遊吃貨日記', tags:['vlog','food'], avatar:'✈️', last:'2 週前', videos:[
      {t:'日本自由行必吃清單', time:'2 週前', dur:'16:30'},
    ]},
    { id:'c11', name:'未分類頻道A', tags:[], avatar:'📺', last:'2 個月前', videos:[
      {t:'很久以前訂閱、忘記為什麼', time:'2 個月前', dur:'7:00'},
    ]},
  ];

  const selected = new Set();

  function tagColor(key) { return TAGS.find(t => t.key === key)?.color || '#8a8a9a'; }

  const tagScroll = document.getElementById('tagScroll');
  TAGS.forEach(tag => {
    const chip = document.createElement('div');
    chip.className = 'tag-chip';
    chip.style.setProperty('--tag-color', tag.color);
    chip.textContent = tag.label;
    chip.addEventListener('click', () => {
      if (selected.has(tag.key)) selected.delete(tag.key); else selected.add(tag.key);
      chip.classList.toggle('selected');
      renderGrid();
    });
    tagScroll.appendChild(chip);
  });

  function renderGrid() {
    const filtered = selected.size === 0 ? CHANNELS : CHANNELS.filter(c => c.tags.some(t => selected.has(t)));
    document.getElementById('filterHint').textContent = selected.size === 0
      ? `顯示全部 ${CHANNELS.length} 個頻道`
      : `符合 ${filtered.length} 個頻道`;
    const grid = document.getElementById('chanGrid');
    grid.innerHTML = '';
    filtered.forEach(c => {
      const card = document.createElement('div');
      card.className = 'chan-card';
      card.innerHTML = `<div class="av">${c.avatar}</div><div class="name">${c.name}</div><div class="last">${c.last}</div><div class="tags">${c.tags.map(t => `<span style="background:${tagColor(t)}"></span>`).join('') || '<span style="background:#555"></span>'}</div>`;
      card.addEventListener('click', () => openChannel(c.id));
      grid.appendChild(card);
    });
  }

  const views = { home: document.getElementById('view-home'), channel: document.getElementById('view-channel') };
  const topbar = document.getElementById('topbar');

  function showView(name) {
    Object.values(views).forEach(v => v.classList.remove('active'));
    views[name].classList.add('active');
  }

  function renderTopbar(title, showBack) {
    topbar.innerHTML = '';
    if (showBack) {
      const b = document.createElement('button');
      b.className = 'icon-btn';
      b.textContent = '←';
      b.addEventListener('click', () => { renderTopbar('頻道追蹤', false); showView('home'); });
      topbar.appendChild(b);
    }
    const t = document.createElement('span');
    t.className = 'topbar-title';
    t.textContent = title;
    topbar.appendChild(t);
  }

  function openChannel(id) {
    const c = CHANNELS.find(x => x.id === id);
    renderTopbar('頻道', true);
    document.getElementById('chAv').textContent = c.avatar;
    document.getElementById('chName').textContent = c.name;
    document.getElementById('chSub').textContent = '最新更新 ' + c.last;

    const editTags = document.getElementById('editTags');
    editTags.innerHTML = '';
    TAGS.forEach(tag => {
      const chip = document.createElement('div');
      chip.className = 'tag-chip' + (c.tags.includes(tag.key) ? ' selected' : '');
      chip.style.setProperty('--tag-color', tag.color);
      chip.textContent = tag.label;
      chip.addEventListener('click', () => {
        if (c.tags.includes(tag.key)) c.tags = c.tags.filter(t => t !== tag.key);
        else c.tags.push(tag.key);
        chip.classList.toggle('selected');
      });
      editTags.appendChild(chip);
    });

    const vbox = document.getElementById('chVideos');
    vbox.innerHTML = '';
    c.videos.forEach(v => {
      const row = document.createElement('div');
      row.className = 'video-row';
      row.innerHTML = `<div class="thumb">${v.dur}</div><div class="vmeta"><div class="vt">${v.t}</div><div class="vd">${v.time}</div></div>`;
      vbox.appendChild(row);
    });
    showView('channel');
  }

  renderGrid();
</script>
