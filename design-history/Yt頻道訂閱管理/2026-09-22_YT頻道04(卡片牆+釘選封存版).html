<!doctype html>
<title>YT頻道04・卡片牆+釘選封存版</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap"
/>
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0c13;
    --bg-deep: #0a0a10;
    --panel-edge: rgba(255, 255, 255, 0.14);
    --ink: #f3f2f8;
    --ink2: #a3a2b2;
    --ink3: #74738a;
    --glass-edge: rgba(255, 255, 255, 0.14);
    /* 卡片牆＋釘選版用琥珀金：強調「精選、常看」的質感。 */
    --accent: #e0a94e;
    --accent-ink: #2a1c05;
    --amb-1: #4a3a1f;
    --amb-2: #2a2450;
    --amb-3: #3f3320;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg-deep); color: var(--ink); font-family: "Zen Kaku Gothic New", "Noto Sans TC", system-ui, sans-serif; }
  body { padding-inline: 20px; padding-block: 32px 48px; display: flex; flex-direction: column; align-items: center; gap: 18px; }

  .intro { max-width: 480px; width: 100%; text-align: center; }
  .eyebrow { font-size: 12px; letter-spacing: 0.16em; color: #8b8690; text-transform: uppercase; }
  .intro h1 { font-weight: 800; font-size: clamp(20px, 5vw, 24px); margin: 6px 0 8px; color: #f4f1f4; }
  .intro p { margin: 0 0 4px; font-size: 13px; line-height: 1.7; color: #a9a4ad; max-width: 48ch; margin-inline: auto; }
  .intro ul { text-align: left; max-width: 40ch; margin: 10px auto 0; padding-left: 18px; font-size: 12.5px; line-height: 1.8; color: #9d98a4; }

  .phone { position: relative; width: 100%; max-width: 380px; height: 760px; flex-shrink: 0; border-radius: 34px; padding: 14px; isolation: isolate; overflow: hidden; background: var(--bg); box-shadow: 0 30px 70px -30px rgba(0,0,0,0.7); }
  .amb { position: absolute; border-radius: 50%; filter: blur(55px); opacity: 0.46; z-index: -1; }
  .amb-1 { width: 220px; height: 220px; top: -70px; left: -60px; background: var(--amb-1); }
  .amb-2 { width: 200px; height: 200px; bottom: 90px; right: -70px; background: var(--amb-2); }
  .amb-3 { width: 190px; height: 190px; bottom: -90px; left: 30px; background: var(--amb-3); }

  .shell { position: relative; height: 100%; border-radius: 24px; padding: 18px 16px; background: rgba(255,255,255,0.04); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid var(--panel-edge); overflow: hidden; display: flex; flex-direction: column; gap: 12px; }

  .topbar { display: flex; align-items: center; gap: 10px; flex: none; }
  .icon-btn { appearance: none; border: none; background: rgba(255,255,255,0.06); color: var(--ink2); width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; flex: none; }
  .icon-btn:hover { background: rgba(255,255,255,0.1); }
  .topbar-title { font-weight: 800; font-size: 16px; }

  .view { flex: 1; min-height: 0; overflow-y: auto; display: none; flex-direction: column; gap: 12px; }
  .view.active { display: flex; }

  .list-label { font-size: 11px; letter-spacing: 0.06em; color: var(--ink3); text-transform: uppercase; flex: none; }

  /* 常看：橫向大頭像 */
  .pin-scroll { flex: none; display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 6px; }
  .pin-item { flex: none; width: 58px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; }
  .pin-item .av { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; background: color-mix(in srgb, var(--accent) 16%, rgba(255,255,255,0.04)); border: 1.5px solid color-mix(in srgb, var(--accent) 55%, var(--glass-edge)); }
  .pin-item .name { font-size: 10px; color: var(--ink2); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
  .pin-empty { flex: none; font-size: 11.5px; color: var(--ink3); padding: 6px 2px; }

  /* 分類牆 */
  .cat-section { flex: none; }
  .cat-title { font-size: 12px; font-weight: 700; color: var(--ink2); margin-bottom: 7px; }
  .cat-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chan-card { border-radius: 14px; padding: 10px; background: rgba(255,255,255,0.035); border: 1px solid var(--glass-edge); cursor: pointer; display: flex; align-items: center; gap: 8px; position: relative; }
  .chan-card:hover { background: rgba(255,255,255,0.06); }
  .chan-card .av { width: 34px; height: 34px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 16px; background: rgba(255,255,255,0.06); }
  .chan-card .meta { flex: 1; min-width: 0; }
  .chan-card .name { font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chan-card .last { font-size: 10px; color: var(--ink3); }
  .chan-card .pin-toggle { flex: none; font-size: 13px; opacity: 0.55; padding: 2px; cursor: pointer; }
  .chan-card .pin-toggle.pinned { opacity: 1; }
  .chan-card .archive-toggle { flex: none; font-size: 12px; opacity: 0.45; padding: 2px; cursor: pointer; }

  /* 封存區 */
  .archive-toggle-row { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 9px 10px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px dashed var(--glass-edge); cursor: pointer; font-size: 12px; color: var(--ink2); }
  .archive-list { flex: none; display: none; flex-direction: column; gap: 4px; }
  .archive-list.open { display: flex; }
  .archive-row { display: flex; align-items: center; gap: 9px; padding: 8px 6px; opacity: 0.6; }
  .archive-row .av { width: 30px; height: 30px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 14px; background: rgba(255,255,255,0.06); }
  .archive-row .name { flex: 1; font-size: 12px; color: var(--ink2); }
  .archive-row .restore { font-size: 10.5px; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid var(--glass-edge); color: var(--ink2); cursor: pointer; }

  /* 頻道詳情 */
  .chan-header { display: flex; align-items: center; gap: 12px; flex: none; padding: 6px 4px 4px; }
  .chan-header .av { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; background: rgba(255,255,255,0.06); border: 1px solid var(--glass-edge); }
  .chan-header .name { font-size: 16px; font-weight: 800; }
  .chan-header .sub { font-size: 11.5px; color: var(--ink3); margin-top: 2px; }
  .chan-actions { flex: none; display: flex; gap: 8px; }
  .chan-actions button { flex: 1; appearance: none; border: 1px solid var(--glass-edge); background: rgba(255,255,255,0.03); color: var(--ink2); padding: 8px; border-radius: 10px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .chan-actions button.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--ink); }

  .video-row { display: flex; gap: 10px; padding: 8px 4px; border-radius: 12px; }
  .video-row:hover { background: rgba(255,255,255,0.04); }
  .video-row .thumb { flex: none; width: 88px; height: 54px; border-radius: 10px; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 40%, #222), #222); display: flex; align-items: center; justify-content: center; font-size: 10px; color: rgba(255,255,255,0.7); }
  .video-row .vmeta { flex: 1; min-width: 0; }
  .video-row .vt { font-size: 12.5px; color: var(--ink); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .video-row .vd { font-size: 11px; color: var(--ink3); margin-top: 4px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="intro">
  <p class="eyebrow">Lume · YT 頻道追蹤 04（Mock，資料全假）</p>
  <h1>卡片牆＋釘選／封存</h1>
  <p>專門處理「訂閱太多、有些其實根本不看」的情境：常看的頻道可以<b>釘選</b>到頂部，久不看的直接<b>封存</b>收到底部摺疊區，眼不見為淨但不用真的取消訂閱。分類牆還是保留，但重點是「主動整理」而不是被動分類。</p>
  <ul>
    <li>頂部<b>常看</b>列橫向排列釘選過的頻道，一眼直達。</li>
    <li>下面是分類牆，每張頻道卡右邊有 📌 釘選／🗄 封存兩顆小按鈕，不用進詳情頁也能整理。</li>
    <li>封存的頻道摺疊收到最底下，點開才看得到，隨時可以復原。</li>
    <li>頻道詳情頁一樣有釘選／封存按鈕，跟卡片上的操作同步。</li>
  </ul>
</div>

<div class="phone">
  <div class="amb amb-1"></div>
  <div class="amb amb-2"></div>
  <div class="amb amb-3"></div>

  <div class="shell">
    <div class="topbar" id="topbar">
      <span class="topbar-title" id="topTitle">頻道追蹤</span>
    </div>

    <div class="view active" id="view-home">
      <p class="list-label">常看</p>
      <div class="pin-scroll" id="pinScroll"></div>

      <div id="catSections"></div>

      <div class="archive-toggle-row" id="archiveToggle">🗄 封存頻道（<span id="archCount">0</span>）<span id="archArrow">▾</span></div>
      <div class="archive-list" id="archiveList"></div>
    </div>

    <div class="view" id="view-channel">
      <div class="chan-header">
        <div class="av" id="chAv"></div>
        <div>
          <div class="name" id="chName"></div>
          <div class="sub" id="chSub"></div>
        </div>
      </div>
      <div class="chan-actions">
        <button id="pinBtn">📌 釘選</button>
        <button id="archBtn">🗄 封存</button>
      </div>
      <p class="list-label">最近影片</p>
      <div id="chVideos"></div>
    </div>
  </div>
</div>

<script>
  const CATEGORIES = [
    { key: 'game', label: '遊戲實況' },
    { key: 'know', label: '知識科普' },
    { key: 'food', label: '美食' },
    { key: 'music', label: '音樂' },
    { key: 'vlog', label: 'Vlog生活' },
  ];
  const CHANNELS = [
    { id:'c1', name:'夜貓實況室', cat:'game', avatar:'🎮', last:'3 小時前', pinned:true, archived:false, videos:[
      {t:'跟訂閱者一起玩到凌晨的爆笑集錦', time:'3 小時前', dur:'18:24'},
      {t:'新地圖初體驗，全程手忙腳亂', time:'2 天前', dur:'42:10'},
    ]},
    { id:'c2', name:'阿凱的知識膠囊', cat:'know', avatar:'🧠', last:'昨天', pinned:true, archived:false, videos:[
      {t:'為什麼貓咪喜歡箱子？三分鐘搞懂', time:'昨天', dur:'3:45'},
    ]},
    { id:'c3', name:'小廚房日常', cat:'food', avatar:'🍳', last:'2 天前', pinned:false, archived:false, videos:[
      {t:'十分鐘炒出餐廳等級的炒飯', time:'2 天前', dur:'10:05'},
    ]},
    { id:'c4', name:'耳朵懷孕電台', cat:'music', avatar:'🎧', last:'4 天前', pinned:false, archived:false, videos:[
      {t:'深夜讀書歌單 Lofi Mix', time:'4 天前', dur:'55:00'},
    ]},
    { id:'c5', name:'阿明的下班日常', cat:'vlog', avatar:'🌇', last:'5 天前', pinned:false, archived:false, videos:[
      {t:'週末去了趟老家菜市場', time:'5 天前', dur:'12:20'},
    ]},
    { id:'c6', name:'速攻通關社', cat:'game', avatar:'🕹️', last:'1 週前', pinned:false, archived:false, videos:[
      {t:'新手向：三個容易忽略的隱藏道具', time:'1 週前', dur:'9:40'},
    ]},
    { id:'c7', name:'冷知識研究所', cat:'know', avatar:'📚', last:'3 天前', pinned:false, archived:false, videos:[
      {t:'冷氣為什麼要往上吹？', time:'3 天前', dur:'5:20'},
    ]},
    { id:'c8', name:'甜點實驗室', cat:'food', avatar:'🧁', last:'6 天前', pinned:false, archived:false, videos:[
      {t:'免烤箱提拉米蘇教學', time:'6 天前', dur:'11:11'},
    ]},
    { id:'c9', name:'路人甲的Cover', cat:'music', avatar:'🎤', last:'1 個月前', pinned:false, archived:true, videos:[
      {t:'翻唱合輯 Vol.7', time:'1 個月前', dur:'6:40'},
    ]},
    { id:'c10', name:'未分類頻道A', cat:'game', avatar:'📺', last:'2 個月前', pinned:false, archived:true, videos:[
      {t:'很久以前訂閱、忘記為什麼', time:'2 個月前', dur:'7:00'},
    ]},
    { id:'c11', name:'未分類頻道B', cat:'vlog', avatar:'📺', last:'3 個月前', pinned:false, archived:true, videos:[
      {t:'許久沒更新的頻道', time:'3 個月前', dur:'15:00'},
    ]},
  ];

  function renderHome() {
    // 常看
    const pinScroll = document.getElementById('pinScroll');
    pinScroll.innerHTML = '';
    const pinned = CHANNELS.filter(c => c.pinned && !c.archived);
    if (pinned.length === 0) {
      pinScroll.innerHTML = '<div class="pin-empty">還沒有釘選任何頻道——在下面頻道卡點 📌 加進來</div>';
    } else {
      pinned.forEach(c => {
        const item = document.createElement('div');
        item.className = 'pin-item';
        item.innerHTML = `<div class="av">${c.avatar}</div><div class="name">${c.name}</div>`;
        item.addEventListener('click', () => openChannel(c.id));
        pinScroll.appendChild(item);
      });
    }

    // 分類牆（不含封存）
    const catBox = document.getElementById('catSections');
    catBox.innerHTML = '';
    CATEGORIES.forEach(cat => {
      const chans = CHANNELS.filter(c => c.cat === cat.key && !c.archived);
      if (chans.length === 0) return;
      const section = document.createElement('div');
      section.className = 'cat-section';
      section.innerHTML = `<div class="cat-title">${cat.label}</div><div class="cat-cards"></div>`;
      const cardsBox = section.querySelector('.cat-cards');
      chans.forEach(c => cardsBox.appendChild(buildChanCard(c)));
      catBox.appendChild(section);
    });

    // 封存
    const archived = CHANNELS.filter(c => c.archived);
    document.getElementById('archCount').textContent = archived.length;
    const archiveList = document.getElementById('archiveList');
    archiveList.innerHTML = '';
    archived.forEach(c => {
      const row = document.createElement('div');
      row.className = 'archive-row';
      row.innerHTML = `<div class="av">${c.avatar}</div><div class="name">${c.name}</div><div class="restore">復原</div>`;
      row.querySelector('.restore').addEventListener('click', (e) => { e.stopPropagation(); c.archived = false; renderHome(); });
      archiveList.appendChild(row);
    });
  }

  function buildChanCard(c) {
    const card = document.createElement('div');
    card.className = 'chan-card';
    card.innerHTML = `<div class="av">${c.avatar}</div><div class="meta"><div class="name">${c.name}</div><div class="last">${c.last}</div></div><div class="pin-toggle${c.pinned ? ' pinned' : ''}">📌</div><div class="archive-toggle">🗄</div>`;
    card.addEventListener('click', () => openChannel(c.id));
    card.querySelector('.pin-toggle').addEventListener('click', (e) => { e.stopPropagation(); c.pinned = !c.pinned; renderHome(); });
    card.querySelector('.archive-toggle').addEventListener('click', (e) => { e.stopPropagation(); c.archived = true; renderHome(); });
    return card;
  }

  document.getElementById('archiveToggle').addEventListener('click', () => {
    const list = document.getElementById('archiveList');
    const open = list.classList.toggle('open');
    document.getElementById('archArrow').textContent = open ? '▴' : '▾';
  });

  const views = { home: document.getElementById('view-home'), channel: document.getElementById('view-channel') };
  const topbar = document.getElementById('topbar');

  function showView(name) {
    Object.values(views).forEach(v => v.classList.remove('active'));
    views[name].classList.add('active');
  }

  function renderTopbar(title, showBack) {
    topbar.innerHTML = '';
    if (showBack) {
      const b = document.createElement('button');
      b.className = 'icon-btn';
      b.textContent = '←';
      b.addEventListener('click', () => { renderTopbar('頻道追蹤', false); showView('home'); renderHome(); });
      topbar.appendChild(b);
    }
    const t = document.createElement('span');
    t.className = 'topbar-title';
    t.textContent = title;
    topbar.appendChild(t);
  }

  function openChannel(id) {
    const c = CHANNELS.find(x => x.id === id);
    renderTopbar('頻道', true);
    document.getElementById('chAv').textContent = c.avatar;
    document.getElementById('chName').textContent = c.name;
    document.getElementById('chSub').textContent = CATEGORIES.find(x => x.key === c.cat).label + '・最新更新 ' + c.last;

    const pinBtn = document.getElementById('pinBtn');
    const archBtn = document.getElementById('archBtn');
    function syncButtons() {
      pinBtn.classList.toggle('active', c.pinned);
      archBtn.classList.toggle('active', c.archived);
    }
    syncButtons();
    pinBtn.onclick = () => { c.pinned = !c.pinned; syncButtons(); };
    archBtn.onclick = () => { c.archived = !c.archived; syncButtons(); };

    const vbox = document.getElementById('chVideos');
    vbox.innerHTML = '';
    c.videos.forEach(v => {
      const row = document.createElement('div');
      row.className = 'video-row';
      row.innerHTML = `<div class="thumb">${v.dur}</div><div class="vmeta"><div class="vt">${v.t}</div><div class="vd">${v.time}</div></div>`;
      vbox.appendChild(row);
    });
    showView('channel');
  }

  renderHome();
</script>
