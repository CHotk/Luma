<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首頁設計 1 圖示格啟動器</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--bg:#0c0c13;--panel:#161622;--panel2:#1e1e2e;--line:#2a2a3d;--text:#eceaf5;--sub:#8b8ba3;--accent:#7EA6FF;--yt:#FF2D40;--diary:#8FBF9F;--jp:#EA92AC;--fit:#F2A65A;--sync:#7ED6D0;--dbg:#B39DDB}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding:32px 16px}
.intro{max-width:640px;margin:0 auto 24px;text-align:center}
.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.2em}
h1{font-size:22px;margin:6px 0}
.intro p{color:var(--sub);font-size:13px;line-height:1.7}
.tag{display:inline-block;background:var(--accent);color:#0c0c13;border-radius:99px;padding:2px 10px;font-size:11px;margin-top:8px}
.phone{width:380px;height:760px;margin:0 auto;border:8px solid #000;border-radius:38px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.scroll>*{flex-shrink:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px;flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:12px;background:var(--panel);display:grid;place-items:center;font-size:16px}
.top b{font-size:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.sub{color:var(--sub);font-size:12px}
.note{max-width:380px;margin:14px auto 0;color:var(--sub);font-size:12px;line-height:1.7;text-align:center}
.nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding:8px 4px 12px;flex-shrink:0}
.nav div{flex:1;text-align:center;font-size:10px;color:var(--sub)}.nav div span{display:block;font-size:20px}.nav .on{color:var(--accent)}</style></head><body><div class="intro"><div class="eyebrow">HOME · 版本 1 / 5</div><h1>圖示格啟動器</h1><p>像手機桌面：每個功能一個圖示，點了就進去。最直覺、最不需要學習。</p><span class="tag">主流慣例：手機主畫面／App 啟動器</span></div><div class="phone"><div class="top"><div class="icon-btn">☰</div><b>Lume</b><div class="icon-btn">⚙</div></div><div class="scroll"><div class="sub" style="padding:4px 2px">2026 年 9 月 24 日 · 週四</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px 8px;padding-top:8px"><div style="text-align:center"><div style="width:66px;height:66px;margin:0 auto 6px;border-radius:20px;background:var(--accent);display:grid;place-items:center;font-size:30px">🇬🇧</div><div style="font-size:12px">英文</div></div><div style="text-align:center"><div style="width:66px;height:66px;margin:0 auto 6px;border-radius:20px;background:var(--jp);display:grid;place-items:center;font-size:30px">🇯🇵</div><div style="font-size:12px">日文</div></div><div style="text-align:center"><div style="width:66px;height:66px;margin:0 auto 6px;border-radius:20px;background:var(--diary);display:grid;place-items:center;font-size:30px">📔</div><div style="font-size:12px">日記</div></div><div style="text-align:center"><div style="width:66px;height:66px;margin:0 auto 6px;border-radius:20px;background:var(--fit);display:grid;place-items:center;font-size:30px">💪</div><div style="font-size:12px">健身</div></div><div style="text-align:center"><div style="width:66px;height:66px;margin:0 auto 6px;border-radius:20px;background:var(--yt);display:grid;place-items:center;font-size:30px">▶</div><div style="font-size:12px">YT 頻道</div></div><div style="text-align:center"><div style="width:66px;height:66px;margin:0 auto 6px;border-radius:20px;background:var(--sync);display:grid;place-items:center;font-size:30px">☁</div><div style="font-size:12px">雲端同步</div></div><div style="text-align:center"><div style="width:66px;height:66px;margin:0 auto 6px;border-radius:20px;background:var(--dbg);display:grid;place-items:center;font-size:30px">🐞</div><div style="font-size:12px">除錯</div></div></div>
<div class="card" style="margin-top:14px"><div class="sub">最近使用</div><div style="margin-top:6px;font-size:14px">🇯🇵 平假名手寫練習 · 昨天</div></div></div></div><p class="note">優點：零學習成本、功能再多也放得下。缺點：只是入口，沒有任何資訊。</p></body></html>
