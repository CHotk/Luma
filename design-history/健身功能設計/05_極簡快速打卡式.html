<!doctype html>
<title>健身05・極簡快速打卡式</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0c13; --bg-deep: #0a0a10; --ink: #f3f2f8; --ink2: #a3a2b2; --ink3: #74738a;
    --glass-edge: rgba(255,255,255,0.14); --glass-fill: rgba(255,255,255,0.045); --hairline: rgba(255,255,255,0.07);
    --accent: #c7e05f; --accent-ink: #1b2004;
    --amb-1: #262f14; --amb-2: #1a2233; --amb-3: #201d1a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg-deep); color: var(--ink); font-family: "Noto Sans TC", system-ui, sans-serif; }
  body { padding: 32px 20px 48px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .intro { max-width: 480px; text-align: center; }
  .eyebrow { font-size: 11.5px; letter-spacing: 0.18em; color: #8b8690; text-transform: uppercase; }
  .intro h1 { font-weight: 800; font-size: 22px; margin: 6px 0 8px; }
  .intro p { margin: 0 auto; font-size: 13px; line-height: 1.7; color: #a9a4ad; max-width: 46ch; }
  .phone { position: relative; width: 100%; max-width: 380px; min-height: 780px; flex-shrink: 0; border-radius: 40px; padding: 12px; isolation: isolate; overflow: hidden;
    background: radial-gradient(120% 100% at 50% -10%, #131019 0%, var(--bg) 45%, var(--bg-deep) 100%);
    box-shadow: 0 40px 90px -30px rgba(0,0,0,0.75), inset 0 0 0 1px rgba(255,255,255,0.04); }
  .amb { position: absolute; border-radius: 50%; filter: blur(72px); opacity: 0.4; z-index: -1; }
  .amb-1 { width: 230px; height: 230px; top: -80px; left: -60px; background: var(--amb-1); }
  .amb-2 { width: 220px; height: 220px; bottom: 60px; right: -80px; background: var(--amb-2); }
  .shell { position: relative; min-height: 100%; border-radius: 30px; padding: 20px 17px;
    background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.022) 100%);
    backdrop-filter: blur(22px); border: 1px solid var(--glass-edge);
    display: flex; flex-direction: column; gap: 16px; }
  .topbar { display: flex; align-items: center; gap: 10px; }
  .icon-btn { width: 32px; height: 32px; border-radius: 11px; border: 1px solid var(--hairline); background: rgba(255,255,255,0.03); display: flex; align-items: center; justify-content: center; color: var(--ink2); font-size: 15px; }
  .topbar-title { font-weight: 800; font-size: 16.5px; }
  .prompt { text-align: center; margin-top: 6px; }
  .prompt .big { font-size: 15px; font-weight: 700; }
  .prompt .small { font-size: 11px; color: var(--ink3); margin-top: 4px; }
  .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .quick-btn { aspect-ratio: 1.15; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    background: var(--glass-fill); border: 1px solid var(--hairline); }
  .quick-btn .ico { font-size: 30px; }
  .quick-btn .lbl { font-size: 12.5px; font-weight: 700; }
  .quick-btn.today { background: color-mix(in srgb, var(--accent) 24%, transparent); border-color: var(--accent); }
  .quick-btn.today .lbl { color: var(--ink); }
  .quick-btn.today .check { font-size: 10px; color: var(--accent); font-weight: 800; margin-top: -4px; }
  .recent-row { display: flex; gap: 6px; align-items: center; justify-content: center; }
  .recent-row .pill { font-size: 10px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.04); color: var(--ink3); }
  .streak-mini { text-align: center; font-size: 11.5px; color: var(--ink2); }
  .streak-mini b { color: var(--accent); }
</style>

<div class="intro">
  <p class="eyebrow">Lume · 健身功能 05（Mock・極簡快速打卡式）</p>
  <h1>一鍵打卡，先求有</h1>
  <p>整個首頁只有一件事：點一下今天練的類型就算完成，不用先填組數重量時長——降低每天記錄的心理門檻，細節之後想補再去該筆紀錄補。跟儀表板版正好相反：這版賭的是「先讓使用者持續打卡養成習慣」，數據分析放到很後面才需要。</p>
</div>

<div class="phone">
  <div class="amb amb-1"></div>
  <div class="amb amb-2"></div>
  <div class="shell">
    <div class="topbar">
      <div class="icon-btn">☰</div>
      <div class="topbar-title">健身</div>
    </div>
    <div class="prompt">
      <div class="big">今天練了什麼？</div>
      <div class="small">點一下就記錄，細節之後再補</div>
    </div>
    <div class="quick-grid">
      <div class="quick-btn today"><div class="ico">🏋️</div><div class="lbl">重訓</div><div class="check">✓ 已打卡</div></div>
      <div class="quick-btn"><div class="ico">🏃</div><div class="lbl">有氧</div></div>
      <div class="quick-btn"><div class="ico">🧘</div><div class="lbl">瑜珈</div></div>
      <div class="quick-btn"><div class="ico">🤸</div><div class="lbl">伸展</div></div>
    </div>
    <div class="streak-mini">🔥 連續 <b>12</b> 天，別中斷</div>
    <div class="recent-row">
      <span class="pill">昨天 有氧</span>
      <span class="pill">前天 重訓</span>
      <span class="pill">9/18 瑜珈</span>
    </div>
  </div>
</div>
