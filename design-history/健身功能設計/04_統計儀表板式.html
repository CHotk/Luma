<!doctype html>
<title>健身04・統計儀表板式</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0c13; --bg-deep: #0a0a10; --ink: #f3f2f8; --ink2: #a3a2b2; --ink3: #74738a;
    --glass-edge: rgba(255,255,255,0.14); --glass-fill: rgba(255,255,255,0.045); --hairline: rgba(255,255,255,0.07);
    --accent: #c98fe0; --accent-ink: #1e0d26;
    --amb-1: #2a1a33; --amb-2: #1a2233; --amb-3: #201d1a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg-deep); color: var(--ink); font-family: "Noto Sans TC", system-ui, sans-serif; }
  body { padding: 32px 20px 48px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .intro { max-width: 480px; text-align: center; }
  .eyebrow { font-size: 11.5px; letter-spacing: 0.18em; color: #8b8690; text-transform: uppercase; }
  .intro h1 { font-weight: 800; font-size: 22px; margin: 6px 0 8px; }
  .intro p { margin: 0 auto; font-size: 13px; line-height: 1.7; color: #a9a4ad; max-width: 46ch; }
  .phone { position: relative; width: 100%; max-width: 380px; min-height: 780px; flex-shrink: 0; border-radius: 40px; padding: 12px; isolation: isolate; overflow: hidden;
    background: radial-gradient(120% 100% at 50% -10%, #131019 0%, var(--bg) 45%, var(--bg-deep) 100%);
    box-shadow: 0 40px 90px -30px rgba(0,0,0,0.75), inset 0 0 0 1px rgba(255,255,255,0.04); }
  .amb { position: absolute; border-radius: 50%; filter: blur(72px); opacity: 0.4; z-index: -1; }
  .amb-1 { width: 230px; height: 230px; top: -80px; left: -60px; background: var(--amb-1); }
  .amb-2 { width: 220px; height: 220px; bottom: 60px; right: -80px; background: var(--amb-2); }
  .shell { position: relative; min-height: 100%; border-radius: 30px; padding: 20px 17px;
    background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.022) 100%);
    backdrop-filter: blur(22px); border: 1px solid var(--glass-edge);
    display: flex; flex-direction: column; gap: 12px; }
  .topbar { display: flex; align-items: center; gap: 10px; }
  .icon-btn { width: 32px; height: 32px; border-radius: 11px; border: 1px solid var(--hairline); background: rgba(255,255,255,0.03); display: flex; align-items: center; justify-content: center; color: var(--ink2); font-size: 15px; }
  .topbar-title { font-weight: 800; font-size: 16.5px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .stat-card { padding: 12px; border-radius: 16px; background: var(--glass-fill); border: 1px solid var(--hairline); }
  .stat-card .n { font-size: 20px; font-weight: 800; color: var(--accent); }
  .stat-card .l { font-size: 10px; color: var(--ink3); margin-top: 2px; }
  .chart-card { padding: 13px; border-radius: 16px; background: var(--glass-fill); border: 1px solid var(--hairline); }
  .chart-card .ttl { font-size: 11.5px; font-weight: 700; color: var(--ink2); margin-bottom: 10px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 70px; }
  .bars .bar { flex: 1; border-radius: 5px 5px 2px 2px; background: color-mix(in srgb, var(--accent) 55%, transparent); }
  .bars .lbl-row { display:flex; gap:6px; margin-top:5px; }
  .bars .lbl-row span { flex:1; text-align:center; font-size:8.5px; color:var(--ink3); }
  .donut-row { display: flex; align-items: center; gap: 14px; }
  .donut { width: 64px; height: 64px; border-radius: 50%; flex: none;
    background: conic-gradient(#5fc9a8 0% 45%, #6aa9e0 45% 70%, #c98fe0 70% 88%, #e0a94e 88% 100%); position: relative; }
  .donut::after { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: var(--bg); }
  .legend { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .legend .row { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--ink2); }
  .legend .dot { width: 7px; height: 7px; border-radius: 50%; }
  .list-label { font-size: 10.5px; letter-spacing: 0.1em; color: var(--ink3); text-transform: uppercase; }
</style>

<div class="intro">
  <p class="eyebrow">Lume · 健身功能 04（Mock・統計儀表板式）</p>
  <h1>數據優先的儀表板</h1>
  <p>一打開先看整體數字：本週訓練次數、總時長、連續天數，接著是週趨勢長條圖跟類型佔比甜甜圈圖，紀錄清單反而往下放。適合已經有健身習慣、更在意「量有沒有累積夠」的使用者；缺點是剛開始用、資料還很少時，這頁會很空。</p>
</div>

<div class="phone">
  <div class="amb amb-1"></div>
  <div class="amb amb-2"></div>
  <div class="shell">
    <div class="topbar">
      <div class="icon-btn">☰</div>
      <div class="topbar-title">健身統計</div>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="n">4</div><div class="l">本週訓練次數</div></div>
      <div class="stat-card"><div class="n">3.2h</div><div class="l">本週總時長</div></div>
      <div class="stat-card"><div class="n">12</div><div class="l">連續天數</div></div>
      <div class="stat-card"><div class="n">36</div><div class="l">累計次數</div></div>
    </div>
    <div class="chart-card">
      <div class="ttl">近 8 週訓練次數</div>
      <div class="bars">
        <div class="bar" style="height:40%"></div><div class="bar" style="height:60%"></div><div class="bar" style="height:30%"></div>
        <div class="bar" style="height:80%"></div><div class="bar" style="height:55%"></div><div class="bar" style="height:70%"></div>
        <div class="bar" style="height:45%"></div><div class="bar" style="height:90%"></div>
      </div>
      <div class="lbl-row"><span>7/27</span><span></span><span></span><span></span><span></span><span></span><span></span><span>9/21</span></div>
    </div>
    <div class="chart-card">
      <div class="ttl">類型佔比</div>
      <div class="donut-row">
        <div class="donut"></div>
        <div class="legend">
          <div class="row"><span class="dot" style="background:#5fc9a8"></span>重訓 45%</div>
          <div class="row"><span class="dot" style="background:#6aa9e0"></span>有氧 25%</div>
          <div class="row"><span class="dot" style="background:#c98fe0"></span>瑜珈 18%</div>
          <div class="row"><span class="dot" style="background:#e0a94e"></span>伸展 12%</div>
        </div>
      </div>
    </div>
    <div class="list-label">最近一次：9/20・上半身推系</div>
  </div>
</div>
