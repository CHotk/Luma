name: lume
description: "Lume 微光 — 一天一點未來光"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # 狀態管理。每個 feature 的 provider 放自己的資料夾，不開全域大 provider。
  flutter_riverpod: ^2.6.1
  # 路由。所有路徑只在 app/router.dart 定義。
  go_router: ^14.6.2
  # v1 的儲存後端。之後換成 drift 時只要換掉 data/storage 這一層。
  shared_preferences: ^2.3.3
  # 單字/句子發音。Web／Android／iOS 同一份 code，背後自動接瀏覽器的
  # SpeechSynthesis 或系統原生 TTS 引擎，見 domain/services/tts_service.dart。
  flutter_tts: ^4.2.5
  # 讀 assets/config/app_defaults.yaml 用的。選 YAML 不選 JSON，是因為
  # JSON 不能寫註解，這份設定檔每個數字都需要說明才看得懂，見該檔內容。
  yaml: ^3.1.2
  # 五十音手寫練習「匯入既有圖片」用的：讓使用者從本機挑一張已經寫好
  # 的圖片存進 App 的練習紀錄，不是只能靠畫布現寫。Web／Android／iOS
  # 同一份 API，跟 flutter_tts 選型的理由一樣。
  image_picker: ^1.1.2
  # 五十音手寫練習「匯出這張」用的：把練習紀錄存成真正的檔案（Web 上
  # 是觸發瀏覽器下載，App 上是存到裝置），同一份 API 全平台通用。
  file_saver: ^0.2.14
  # 設定頁最下面顯示的版本號用的：跟 pubspec.yaml 的 version 對得上，
  # 不用自己手動同步一份常數，Web／Android／iOS 同一份 API。
  package_info_plus: ^8.1.2
  # 手寫練習重播「下載動畫」用的：把逐格畫出來的筆畫編成動畫 GIF。
  # 真的編碼成 mp4/webm 需要很重的影片編碼套件，純 Flutter Web 沒有
  # 內建能力，跟這個小功能的規模不相稱；GIF 純 Dart 就能做，不用加
  # 重依賴（2026-09-18 使用者決定）。
  image: ^4.3.0
  # YT 頻道追蹤「依影片顯示」用的：直接呼叫 YouTube Data API v3 抓頻道
  # 最新影片，純前端打 Google API 走 HTTP，不用整包 googleapis SDK。
  http: ^1.2.2
  # 多裝置同步用的：R2 的 S3 相容 API 要求 AWS SigV4 簽章，簽章要用
  # HMAC-SHA256／SHA256，Dart 沒有內建，這個是官方維護的標準套件。
  crypto: ^3.0.6
  # AWS 官方（Amplify Flutter 團隊）維護的 SigV4 簽章實作，不要自己
  # 手刻——手刻的簽章邏輯沒有真的 R2 帳號沒辦法驗證對不對，簽章這種
  # 東西錯一個字元的編碼規則就整個失敗，有現成、AWS 自己在用的實作
  # 就不該重新發明（2026-09-23 使用者問「應該自己刻嗎」才改用這個）。
  aws_signature_v4: ^0.6.10
  # aws_signature_v4 的 AWSHttpRequest／AWSService 這些型別實際定義在
  # 這個套件裡，直接 import 用到就該直接宣告依賴，不要只靠遞移依賴
  # 悄悄可以用。
  aws_common: ^0.7.13
  # 英文發音優先試有道辭典的真人錄音（比合成語音自然），這個套件負責
  # 播放那段 mp3 URL，Web／Android／iOS 同一份 API。播不出來就退回
  # flutter_tts，見 domain/services/tts_service.dart 的說明。
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/config/
    - assets/images/yt_tracker/
    - assets/images/fitness/
    - assets/images/nav_icons/
    - assets/images/app_logo/
    - assets/images/user_profile/
