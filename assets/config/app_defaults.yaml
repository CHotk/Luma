# 學習規則的預設值。只有全新使用者（還沒在設定頁存過任何東西）會讀到
# 這份檔案，讀取邏輯在 lib/data/seed/rules_defaults_loader.dart。
#
# 改這裡的數字不用重新編譯 App，但要注意：
#   1. 這份檔案讀壞、讀不到、或漏了某個欄位，都會自動退回
#      lib/domain/rules_config.dart 建構子裡寫死的那組值（同一套邏輯，
#      因為讀取用的是既有的 RulesConfig.fromJson）。這份是「保險」，
#      改了這裡記得順手把 rules_config.dart 的建構子預設值也改成一樣，
#      兩邊本來就該同步，不是誰取代誰。
#   2. 使用者一旦在設定頁存過一次，之後就永遠讀存起來的那份，
#      這份檔案的值就不會再被用到，除非使用者清掉本機儲存重新開始。

# 一輪總共幾題。
roundSize: 10

# 其中有幾題抽待複習的字，其餘出新字。
# 待複習是「考過但還沒掌握」的字，含答錯過的，也含答對過但還沒到
# 門檻的。只有三種狀態，沒有中間類別。
pendingPerRound: 7

# 每輪固定回頭考幾個已經掌握的字。
# 掌握不代表永遠不會忘，隔一陣子碰一次才知道是不是真的還記得。
masteredPerRound: 1

# 每輪固定出幾題句型（整句英文，標了 sentenceTag「句型」的字）。
# 配額是從新字的名額裡挪一題出來，不是額外加題數。
sentencePerRound: 1

# 混合模式（quizStyle: mixed）下有幾題要打字。其他模式不看這個值。
typeQuestions: 3

# 題型模式，三選一：
#   tapOnly   只點選（看英文想中文，按會或不會，最快，一輪兩分鐘）
#   mixed     大部分點選，少數幾題打字
#   typeOnly  全部打字（中翻英，每題都要打出來，練得最扎實但最累）
quizStyle: tapOnly

# 每天最多幾輪。做滿就擋住，這是防止做過頭然後放棄的核心。
roundsPerDay: 5

# 每天目標幾分鐘。只是顯示參考，不是限制條件（跟 roundsPerDay 不一樣，
# 這個不會真的擋住使用者）。
minutesPerDay: 15

# 從沒錯過的字要答對幾次才算掌握。
# 調高之後，原本掌握但沒到新門檻的字會自動掉回待複習。
confirmRight: 4

# 錯過的字要翻身，答對次數得是答錯次數的幾倍。
# 例：這個值是 5，錯五次就要答對二十五次才算掌握，整個字總共會被
# 考三十次。這個數字刻意訂得重，錯過的字本來就該被多考幾次才能相信。
recoveryRatio: 5

# 待複習出題時，從「離掌握最遠」的前幾名候選裡隨機抽，這是候選池的
# 大小。不是直接拿排最前面的 pendingPerRound 個，是先圈出這麼多個
# 最需要練的字，再從裡面完全隨機抽幾個出題，同一批最需要練的字才
# 不會每輪都長一樣。
pendingCandidatePoolSize: 30
