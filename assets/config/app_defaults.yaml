# App 裡所有「調一調數字就好，不用改 code」的設定，集中在這一份檔案。
# 讀取邏輯都在 lib/data/seed/app_defaults_loader.dart。
#
# 這份檔案本身就是唯一的來源（single source of truth），code 裡不
# 另外留一份寫死的預設值當保險（使用者 2026-09-17 決定）。所以：
#   - 這份檔案讀不到、格式壞掉、或缺欄位，載入時會直接丟例外讓
#     App 炸給你看，不會有「其實悄悄退回舊值、你以為改了其實沒改」
#     這種狀況——除了下面「學習規則」那一節，那節是例外，見說明。
#   - 改這裡的數字不用重新編譯 App，重新整理／重新開啟就生效。
#
# 【例外】「學習規則」那一節（roundSize 到 pendingCandidatePoolSize）
# 是唯一還在 lib/domain/rules_config.dart 建構子裡留一份保險預設值的
# 部分，因為它們是核心排題邏輯，讀取用的是既有的 RulesConfig.fromJson
# （原本就有的、給使用者存在本機的舊設定做欄位補齊用），順便沿用
# 這個保險機制不算額外成本。改了這節記得順手把 rules_config.dart
# 建構子的預設值也改成一樣，兩邊本來就該同步，不是誰取代誰。
# 使用者一旦在設定頁存過一次，之後就永遠讀存起來的那份，這節的值
# 就不會再被用到，除非使用者清掉本機儲存重新開始。

## ---- 學習規則（有保險預設值，見上方例外說明）----

# 一輪總共幾題。
roundSize: 10

# 其中有幾題抽待複習的字，其餘出新字。
# 待複習是「考過但還沒掌握」的字，含答錯過的，也含答對過但還沒到
# 門檻的。只有三種狀態，沒有中間類別。
pendingPerRound: 7

# 每輪固定回頭考幾個已經掌握的字。
# 掌握不代表永遠不會忘，隔一陣子碰一次才知道是不是真的還記得。
masteredPerRound: 1

# 每輪固定出幾題句型（整句英文，標了 sentenceTag「句型」的字）。
# 配額是從新字的名額裡挪一題出來，不是額外加題數。
sentencePerRound: 1

# 混合模式（quizStyle: mixed）下有幾題要打字。其他模式不看這個值。
typeQuestions: 3

# 題型模式，三選一：
#   tapOnly   只點選（看英文想中文，按會或不會，最快，一輪兩分鐘）
#   mixed     大部分點選，少數幾題打字
#   typeOnly  全部打字（中翻英，每題都要打出來，練得最扎實但最累）
quizStyle: tapOnly

# 每天最多幾輪。做滿就擋住，這是防止做過頭然後放棄的核心。
roundsPerDay: 5

# 每天目標幾分鐘。只是顯示參考，不是限制條件（跟 roundsPerDay 不一樣，
# 這個不會真的擋住使用者）。
minutesPerDay: 15

# 從沒錯過的字要答對幾次才算掌握。
# 調高之後，原本掌握但沒到新門檻的字會自動掉回待複習。
confirmRight: 4

# 錯過的字要翻身，答對次數得是答錯次數的幾倍。
# 例：這個值是 5，錯五次就要答對二十五次才算掌握，整個字總共會被
# 考三十次。這個數字刻意訂得重，錯過的字本來就該被多考幾次才能相信。
recoveryRatio: 5

# 待複習出題時，從「離掌握最遠」的前幾名候選裡隨機抽，這是候選池的
# 大小。不是直接拿排最前面的 pendingPerRound 個，是先圈出這麼多個
# 最需要練的字，再從裡面完全隨機抽幾個出題，同一批最需要練的字才
# 不會每輪都長一樣。
pendingCandidatePoolSize: 30

## ---- 發音（TTS）----
## 唯一來源，code 裡沒有備份值（lib/domain/services/tts_service.dart
## 只接參數，不寫死語言／音調）。

# 發音語言。這個 App 只練英文單字/句子，中文（word.zh）不會被唸出來，
# 所以固定唸英文，不用跟著使用者介面語言切換。
ttsLanguage: en-US

# 音調。1.0 是引擎預設值，語速也刻意用引擎預設，不要調慢
# （使用者 2026-09-16 決定過一次，不要因為改設定檔又调回去）。
ttsPitch: 1.0

## ---- 啟動畫面 ----
## 唯一來源，code 裡沒有備份值（lib/features/splash/splash_page.dart）。

# 啟動畫面停留幾毫秒才自動跳轉到首頁。不要做成要點一下才進去，
# 每天都要看的東西多一次點擊就是多一分懶得開。
splashHoldMs: 1600

## ---- 日文複習排程（簡化版）----
## 跟「學習規則」那節同一種保險政策：有 lib/domain/jp_review_config.dart
## 建構子的預設值當底，這份檔案讀不到、壞掉就退回那邊的值，不會讓
## App 打不開——因為這也是日文首頁核心數字（進度環、下一輪清單）的
## 一部分，跟排序偏好那種壞了無所謂的設定不一樣。

# 今天要練幾個字才算「今天的份量做完」，首頁進度環看這個。
jpDailyKanaTarget: 5

# 目標練習分鐘數，進度環下方那行參考用，不是限制條件。
jpDailyMinutesTarget: 10

# 純手寫（不算輔助描摹）要練到幾次才算「已掌握」這個字。
jpMasteryPracticeCount: 3

# 已掌握的字超過幾天沒再碰，就退回待複習——複習本來就該隔一段時間
# 才有意義，不是練到門檻就永遠不用管了。
jpReviewStaleDays: 7

## ---- 單字庫標籤排序 ----
## 唯一來源，code 裡沒有備份值（lib/features/library/library_page.dart
## 只接參數，不寫死順序）。讀不到、格式壞掉就整個當空的，退回純字母序
## ——排序偏好本身不影響資料對不對，壞掉最多就是排列比較普通，
## 不值得為這個讓 App 炸掉，跟學習規則／發音／啟動畫面那三節的
## 態度不一樣，是刻意的。

# 這些標籤要在下拉選單裡相黏在一起，順序照這裡列的（不是字母序）。
# 例：git 跟工程師是同一類，git 排在工程師前面。標籤庫裡如果剛好
# 沒有其中一個，就跳過，不用理它。
libraryTagAdjacentGroups:
  - [git, 工程師]

# 這些標籤要照這個順序排在一般標籤清單的最後（多標籤選項本身固定
# 排在整個選單最底部，不受這裡影響，見 multiTagLabel）。清單裡某個
# 標籤如果目前沒有任何字用到，就跳過。
libraryTagTrailingOrder:
  - 中等字
  - 基礎字
  - 超基礎字

## ---- 手寫練習重播動畫 GIF ----
## 跟「日文複習排程」同一種保險政策：有 lib/data/seed/
## app_defaults_loader.dart 裡 KanaGifDefaults 建構子的預設值當底，
## 這份檔案讀不到、壞掉就退回那邊的值，不會讓「下載該次筆跡」這個
## 小功能直接壞掉、拖累其他畫面（2026-09-18 使用者要求：GIF 相關
## 設定移到專門設定檔，不要寫死在 code 裡）。

# 每一格間隔幾毫秒，愈小愈流暢，但格數（在同樣長度下）會變多，
# 檔案愈大、編碼愈久。之前寫死 45ms（約 22fps）使用者覺得還是有點
# 頓，這裡調成 30ms（約 33fps）。
kanaGifFrameIntervalMs: 30

# 格數上限：寫比較久的字最多切成這麼多格，不會因為寫很久格數就
# 一路增加、檔案跟編碼時間跟著爆炸。frameIntervalMs 調低之後，同樣
# 長度需要的格數變多，這個上限也要跟著往上調，不然长一點的字還是會
# 被這個上限卡回更粗的格率，等於調 frameIntervalMs 白調。
kanaGifMaxFrames: 150

# 輸出的正方形邊長（像素）。
kanaGifSize: 320

# 色盤大小，愈小編碼愈快、檔案愈小——幾乎全是紙色背景加深色墨線的
# 簡單畫面，不需要到 256 色。
kanaGifNumColors: 64
